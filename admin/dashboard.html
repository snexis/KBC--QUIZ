<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBC Admin Dashboard</title>
    <!-- Favicon Fix to Prevent 404 -->
    <link rel="icon" href="data:,">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(31, 40, 51, 0.7);
            --border-color: #45a29e;
            --text-color: #c5c6c7;
            --accent-color: #66fcf1;
            --hover-color: #45a29e;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 50%, #1f2833 0%, #0b0c10 100%);
        }

        /* Login Overlay */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 12, 16, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .login-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.2);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .login-box h2 {
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: rgba(11, 12, 16, 0.8);
            color: #fff;
            outline: none;
        }

        .btn {
            background: var(--accent-color);
            color: #0b0c10;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .btn:hover {
            background: var(--hover-color);
            color: #fff;
        }

        /* Navbar */
        .navbar {
            background: rgba(31, 40, 51, 0.9);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            color: var(--accent-color);
            font-size: 20px;
        }

        /* Container & Tabs */
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--border-color);
            color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 14px;
            color: var(--text-color);
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 10px;
        }

        /* Tables */
        .table-responsive {
            overflow-x: auto;
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(69, 162, 158, 0.2);
        }

        th {
            background: rgba(11, 12, 16, 0.5);
            color: var(--accent-color);
        }

        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .badge-active { background: rgba(16, 185, 129, 0.2); color: var(--success-color); }
        .badge-blocked { background: rgba(239, 68, 68, 0.2); color: var(--danger-color); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1100;
        }

        .modal-content {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <!-- Admin Login Modal -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Admin Login</h2>
            <div class="input-group">
                <label for="admin-user">Username</label>
                <input type="text" id="admin-user" placeholder="Enter Admin ID">
            </div>
            <div class="input-group">
                <label for="admin-pass">Password</label>
                <input type="password" id="admin-pass" placeholder="Enter Password">
            </div>
            <button class="btn" onclick="loginAdminCheck()">Login</button>
        </div>
    </div>

    <!-- Main Navigation -->
    <nav class="navbar">
        <h1><i class="fa-solid fa-user-shield"></i> KBC Admin Panel</h1>
        <button class="tab-btn" onclick="logoutAdmin()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </nav>

    <!-- Main Content Container -->
    <div class="container">
        <!-- Navigation Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('dashboard', this)"><i class="fa-solid fa-chart-line"></i> Dashboard</button>
            <button class="tab-btn" onclick="switchTab('players', this)"><i class="fa-solid fa-users"></i> Players Management</button>
            <button class="tab-btn" onclick="switchTab('add-question', this)"><i class="fa-solid fa-circle-plus"></i> Add Question</button>
            <button class="tab-btn" onclick="openAuditModal()"><i class="fa-solid fa-clock-rotate-left"></i> Audit Logs</button>
        </div>

        <!-- Tab 1: Dashboard Overview -->
        <div id="dashboard" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>TOTAL REGISTERED PLAYERS</h3>
                    <div class="value" id="total-players">0</div>
                </div>
                <div class="stat-card">
                    <h3>ACTIVE SESSIONS (LIVE)</h3>
                    <div class="value" id="active-sessions">0</div>
                </div>
                <div class="stat-card">
                    <h3>TOTAL QUESTIONS IN BANK</h3>
                    <div class="value" id="total-questions">0</div>
                </div>
            </div>
        </div>

        <!-- Tab 2: Players List -->
        <div id="players" class="tab-content">
            <h2><i class="fa-solid fa-users"></i> Registered Players</h2>
            <br>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Phone / ID</th>
                            <th>Name / Status</th>
                            <th>Score</th>
                            <th>Account Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="player-table-body">
                        <tr>
                            <td colspan="5" style="text-align: center; color: #aaa;">ডেটা লোড হচ্ছে...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Tab 3: Add New Question -->
        <div id="add-question" class="tab-content">
            <h2><i class="fa-solid fa-circle-plus"></i> Add New Question</h2>
            <br>
            <div style="background: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border-color);">
                <div class="input-group">
                    <label>Created By (Admin Name):</label>
                    <input type="text" id="admin-q-author" placeholder="Admin Name">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="input-group">
                        <label>Subject Category:</label>
                        <select id="admin-q-subj">
                            <option value="General">General Knowledge</option>
                            <option value="Science">Science</option>
                            <option value="History">History</option>
                            <option value="Geography">Geography</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Difficulty Level:</label>
                        <select id="admin-q-level">
                            <option value="1">Level 1 (Easy)</option>
                            <option value="2">Level 2 (Medium)</option>
                            <option value="3">Level 3 (Hard)</option>
                        </select>
                    </div>
                </div>
                <div class="input-group">
                    <label>Question Text (Bangla):</label>
                    <textarea id="admin-q-text" rows="3" placeholder="প্রশ্নটি লিখুন..."></textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="input-group"><label>Option A:</label><input type="text" id="admin-opt-a"></div>
                    <div class="input-group"><label>Option B:</label><input type="text" id="admin-opt-b"></div>
                    <div class="input-group"><label>Option C:</label><input type="text" id="admin-opt-c"></div>
                    <div class="input-group"><label>Option D:</label><input type="text" id="admin-opt-d"></div>
                </div>
                <div class="input-group">
                    <label>Correct Option:</label>
                    <select id="admin-correct-opt">
                        <option value="a">Option A</option>
                        <option value="b">Option B</option>
                        <option value="c">Option C</option>
                        <option value="d">Option D</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Explanation / Note (Optional):</label>
                    <textarea id="admin-q-exp" rows="2" placeholder="প্রশ্নের ব্যাখ্যা লিখুন..."></textarea>
                </div>
                <button class="btn" onclick="addNewQuestionFromAdmin()">Save Question</button>
            </div>
        </div>
    </div>

    <!-- Audit Log Modal -->
    <div id="audit-modal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--accent-color); margin-bottom: 15px;">Audit Logs</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Admin</th>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Snippet</th>
                        </tr>
                    </thead>
                    <tbody id="audit-log-tbody">
                    </tbody>
                </table>
            </div>
            <br>
            <button class="btn" onclick="closeAuditModal()" style="background: var(--danger-color); color: white;">Close</button>
        </div>
    </div>

    <!-- Inline Script for Login & UI Controls -->
    <script>
        // Check Login Status on Load
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('kbc_admin_logged_in') === 'true') {
                const overlay = document.getElementById('login-overlay');
                if (overlay) overlay.style.display = 'none';
            }
        });

        // Smart Login Handler with Trim and Case Insensitivity
        function loginAdminCheck() {
            const user = document.getElementById('admin-user').value.trim().toLowerCase();
            const pass = document.getElementById('admin-pass').value.trim();

            if (user === 'admin' && pass === 'admin123') {
                sessionStorage.setItem('kbc_admin_logged_in', 'true');
                document.getElementById('login-overlay').style.display = 'none';
            } else {
                alert('ভুল অ্যাডমিন আইডি বা পাসওয়ার্ড!');
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('kbc_admin_logged_in');
            location.reload();
        }

        // Navigation Tab Switching Logic
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            const targetTab = document.getElementById(tabId);
            if (targetTab) targetTab.classList.add('active');
            if (btnElement) btnElement.classList.add('active');
        }

        // Modal Controls
        function openAuditModal() {
            const modal = document.getElementById('audit-modal');
            if (modal) {
                modal.style.display = 'flex';
                if (typeof loadAuditLogs === 'function') {
                    loadAuditLogs();
                }
            }
        }

        function closeAuditModal() {
            const modal = document.getElementById('audit-modal');
            if (modal) modal.style.display = 'none';
        }
    </script>

<!-- Final Absolute Path Fix for GitHub Pages Sub-folder -->
<script src="/KBC--QUIZ/network/networkadapter.js?v=3.0"></script>
<script src="app.js?v=3.0"></script>
</body>
</html>
