<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBC Admin Control Panel</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        /* Modern Glassmorphism Center Layout for Login Card */
        body {
            background: radial-gradient(circle at center, #111827 0%, #070913 100%);
            color: var(--text-main, #fff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .admin-card {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid var(--border-gold, #ffd700);
            border-radius: 20px;
            padding: 35px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 35px var(--gold-glow, rgba(255, 215, 0, 0.35));
            backdrop-filter: blur(15px);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .admin-card:hover {
            transform: translateY(-3px);
        }

        .admin-card h2 {
            color: var(--border-gold, #ffd700);
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--gold-glow, rgba(255, 215, 0, 0.35));
        }

        .admin-card p {
            color: var(--text-muted, #94a3b8);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-cyan, #00f2fe);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            box-sizing: border-box;
            outline: none;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input:focus {
            border-color: var(--accent-cyan, #00f2fe);
            box-shadow: 0 0 12px var(--cyan-glow, rgba(0, 242, 254, 0.4));
        }

        .btn-admin {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
            border: none;
            font-weight: 800;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            transition: all 0.3s ease;
        }

        .btn-admin:hover {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>🔑 KBC ADMIN PORTAL</h2>
        <p>অ্যাডমিন প্যানেলে প্রবেশ করতে লগইন করুন</p>
        
        <div class="input-group">
            <label for="admin-user">Admin Username / ID</label>
            <input type="text" id="admin-user" placeholder="Enter Admin Username">
        </div>
        
        <div class="input-group">
            <label for="admin-pass">Master Passcode</label>
            <input type="password" id="admin-pass" placeholder="Enter Secret Passcode">
        </div>

        <button class="btn-admin" onclick="adminLogin()">LOGIN TO DASHBOARD</button>
    </div>

    <script>
        function adminLogin() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;

            if (user === "admin" && pass === "ADMIN2026") {
                sessionStorage.setItem('adminLoggedIn', 'true');
                alert("Welcome Admin! Redirecting to Dashboard...");
                window.location.href = "dashboard.html";
            } else {
                alert("Invalid Credentials! Please try again.");
            }
        }
    </script>
</body>
</html>
