<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBC Admin Control Panel</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            background-color: #0b0c10;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .admin-card {
            background: #1f2833;
            border: 2px solid #c5a059;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.3);
            text-align: center;
        }
        .admin-card h2 {
            color: #c5a059;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #45a29e;
            background: #0b0c10;
            color: #fff;
            box-sizing: border-box;
        }
        .btn-admin {
            width: 100%;
            padding: 12px;
            background: #c5a059;
            color: #000;
            border: none;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-admin:hover {
            background: #66fcf1;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>🔑 KBC ADMIN PORTAL</h2>
        <p>অ্যাডমিন প্যানেলে প্রবেশ করতে লগইন করুন</p>
        
        <div class="input-group">
            <label for="admin-user">Admin Username / ID</label>
            <input type="text" id="admin-user" placeholder="Enter Admin Username">
        </div>
        
        <div class="input-group">
            <label for="admin-pass">Master Passcode</label>
            <input type="password" id="admin-pass" placeholder="Enter Secret Passcode">
        </div>

        <button class="btn-admin" onclick="adminLogin()">LOGIN TO DASHBOARD</button>
    </div>

    <script>
        function adminLogin() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;

            if (user === "admin" && pass === "ADMIN2026") {
                sessionStorage.setItem('adminLoggedIn', 'true');
                alert("Welcome Admin! Redirecting to Dashboard...");
                window.location.href = "dashboard.html";
            } else {
                alert("Invalid Credentials! Please try again.");
            }
        }
    </script>
</body>
</html>
