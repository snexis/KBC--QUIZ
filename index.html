        <div id="scr-game" class="screen">

            <div class="stats">

            <div class="question-box" id="q-text"></div>
            <div id="exp-box"
style="
display:none;
margin-top:15px;
padding:15px;
background:rgba(255,255,255,.08);
border-left:4px solid #ffd700;
border-radius:10px;
font-size:15px;
line-height:1.6;
text-align:left;">
</div>
            <div class="options-grid" id="opt-container"></div>
        </div>

        <!-- Result -->
        <div id="scr-res" class="screen">
            <h1>GAME OVER</h1>
            <div style="font-size: 1.3rem; margin: 20px 0;">
                <p>TOTAL SCORE: <span id="res-score" style="color:var(--gold)"></span></p>
                <p>CORRECT: <span id="res-cor" style="color:var(--correct)"></span></p>
                <p>WRONG: <span id="res-wr" style="color:var(--wrong)"></span></p>
            </div>
            <button class="btn" onclick="location.reload()">RESTART</button>
        </div>
    </div>

     <!-- Voice Command Indicator -->
    <div class="voice-indicator" id="voice-btn" onclick="toggleVoice()" title="Toggle Voice Commands">🎤</div>

            {qb:"ভারতের সবচেয়ে বড় লেক কোনটি?", qe:"Largest lake in India?", ab:["চিল্কা","উলার","ডাল","সম্ভর"], ae:["Chilika","Wular","Dal","Sambhar"], ans:0},
            {qb:"বায়ুর চাপ মাপার যন্ত্র কোনটি?", qe:"Instrument to measure air pressure?", ab:["ব্যারোমিটার","থার্মোমিটার","হাইড্রোমিটার","ল্যাক্টোমিটার"], ae:["Barometer","Thermometer","Hydrometer","Lactometer"], ans:0},
            {qb:"দুধের বিশুদ্ধতা মাপা হয় কী দিয়ে?", qe:"Instrument to test purity of milk?", ab:["ব্যারোমিটার","হাইড্রোমিটার","ল্যাক্টোমিটার","থার্মোমিটার"], ae:["Barometer","Hydrometer","Lactometer","Thermometer"], ans:2},
            {qb:"সূর্যের আলো পৃথিবীতে আসতে কত সময় লাগে?", qe:"Time for sunlight to reach Earth?", ab:["৮ মিনিট ২০ সেকেন্ড","৫ মিনিট","১০ মিনিট","৩ মিনিট"], ae:["8m 20s","5m","10m","3m"], ans:0},
            {qb:"সবচেয়ে বড় দিন কবে (উত্তর গোলার্ধে)?", qe:"Longest day (N. Hemisphere)?", ab:["২১ জুন","২২ ডিসেম্বর","২১ মার্চ","২৩ সেপ্টেম্বর"], ae:["21st June","22nd Dec","21st March","23rd Sept"], ans:0},
            {qb:"সবচেয়ে ছোট দিন কবে (উত্তর গোলার্ধে)?", qe:"Shortest day (N. Hemisphere)?", ab:["২১ জুন","২২ ডিসেম্বর","২১ মার্চ","২৩ সেপ্টেম্বর"], ae:["21st June","22nd Dec","21st March","23rd Sept"], ans:1},
            {qb:"কোন যন্ত্র দিয়ে ভূমিকম্প মাপা হয়?", qe:"Instrument to measure earthquake?", ab:["ব্যারোমিটার","সিসমোগ্রাফ","ল্যাক্টোমিটার","অ্যানিমোমিটার"], ae:["Barometer","Seismograph","Lactometer","Anemometer"], ans:1},
            {qb:"২০২৬ সালে ফুটবল বিশ্বকাপ কোন দেশে হবে?", qe:"2026 FIFA World Cup hosts?", ab:["ভারত ও চীন","ইউএসএ, মেক্সিকো, কানাডা","কাতার","আর্জেন্টিনা"], ae:["India & China","USA, Mexico, Canada","Qatar","Argentina"], ans:1},
            {qb:"ChatGPT এর নির্মাতা সংস্থা কোনটি?", qe:"Creator of ChatGPT?", ab:["গুগল","মাইক্রোসফট","ওপেনএআই (OpenAI)","ফেসবুক"], ae:["Google","Microsoft","OpenAI","Facebook"], ans:2},
            {qb:"ভারতের বর্তমান রাষ্ট্রপতির নাম কী (২০২৪)?", qe:"Who is current President of India?", ab:["রামনাথ কোবিন্দ","দ্রৌপদী মুর্মু","নরেন্দ্র মোদী","জগদীপ ধনখড়"], ae:["Ram Nath Kovind","Droupadi Murmu","Narendra Modi","Jagdeep Dhankhar"], ans:1},
            {qb:"ভারতের জাতীয় প্রতীক কী?", qe:"National Emblem of India?", ab:["বাঘ","অশোক স্তম্ভ","তাজমহল","পদ্ম"], ae:["Tiger","Ashoka Pillar","Taj Mahal","Lotus"], ans:1},
            {qb:"পশ্চিমবঙ্গের বর্তমান মুখ্যমন্ত্রী কে?", qe:"Current CM of West Bengal?", ab:["বুদ্ধদেব ভট্টাচার্য","জ্যোতি বসু","মমতা ব্যানার্জি","অভিষেক ব্যানার্জি"], ae:["Buddhadeb","Jyoti Basu","Mamata Banerjee","Abhishek"], ans:2},
            {qb:"সবচেয়ে বেশি বুদ্ধিমান প্রাণী কোনটি (মানুষ ছাড়া)?", qe:"Most intelligent animal besides human?", ab:["হাতি","কুকুর","শিম্পাঞ্জি/ডলফিন","বেড়াল"], ae:["Elephant","Dog","Chimpanzee/Dolphin","Cat"], ans:2},
            {qb:"ভারতের আইটি রাজধানী কোনটি?", qe:"IT Capital of India?", ab:["হায়দ্রাবাদ","বেঙ্গালুরু","পুনে","গুরুগ্রাম"], ae:["Hyderabad","Bengaluru","Pune","Gurugram"], ans:1},
            {qb:"ভারতের মহাকাশ গবেষণা সংস্থার নাম কী?", qe:"Space agency of India?", ab:["NASA","ISRO","ESA","JAXA"], ae:["NASA","ISRO","ESA","JAXA"], ans:1},
            {qb:"সাদা সোনা বলা হয় কাকে?", qe:"What is called White Gold?", ab:["সিলভার","প্লাটিনাম","সাদা হীরা","তুলো"], ae:["Silver","Platinum","White Diamond","Cotton"], ans:1},
            {qb:"মরুভূমির জাহাজ কাকে বলা হয়?", qe:"Ship of desert?", ab:["উট","ঘোড়া","গাধা","সিংহ"], ae:["Camel","Horse","Donkey","Lion"], ans:0},
            {qb:"ভারতের জাতীয় খেলা কোনটি?", qe:"National game of India?", ab:["ক্রিকেট","হকি","কাবাডি","ফুটবল"], ae:["Cricket","Hockey","Kabaddi","Football"], ans:1},
            {qb:"মানুষের শরীরের সবচেয়ে বড় অঙ্গ কোনটি?", qe:"Largest organ of human body?", ab:["যকৃত","ত্বক","ফুসফুস","হৃদপিণ্ড"], ae:["Liver","Skin","Lung","Heart"], ans:1}
        ];

        // Ensure exactly 200 questions exist for robust loop logic
        const categories = ["Science","History","Tech","Math","GK","Geography","Politics"];
        let currentCount = bank.length;
        for(let i = currentCount + 1; i <= 200; i++){
            let cat = categories[i % categories.length];
            bank.push({
                qb: `(${i}) ${cat} বিষয়ক প্রশ্ন: এই বিষয়ের সঠিক তথ্য নির্বাচন করুন।`,
                qe: `(${i}) ${cat} based question: Choose the correct factual option.`,
                ab: ["বিকল্প A", "বিকল্প B", "বিকল্প C", "বিকল্প D"],
                ae: ["Option A", "Option B", "Option C", "Option D"],
                ans: (i * 7) % 4
            });
        }

        // --- GAME LOGIC ---
        let curLang = 'bn';
        let curIdx = 0;
        let score = 0, cor = 0, wr = 0;
        let timerVal = 30;
        let timerInt;
        let activeQuestions = [];
        let canAnswer = false;

        function login() {
            const p = document.getElementById('phone').value;
            if(/^\d{10}$/.test(p)) {
                localStorage.setItem('kbc_login_session', 'active');
                show('scr-lang');
            } else {
                alert("PLEASE ENTER A VALID 10 DIGIT MOBILE NUMBER");
            }
        }

        function start(l) {
            curLang = l;
            curIdx = 0; score = 0; cor = 0; wr = 0;
            // Shuffle all 200 questions
            activeQuestions = [...bank].sort(() => Math.random() - 0.5);
            show('scr-game');
            
            const bg = document.getElementById('bg-music');
            bg.volume = 0.2; 
            bg.play().catch(e => console.log("Audio play blocked until click"));
            
            loadQ();
        }

        function loadQ() {
            clearInterval(timerInt);
            if(curIdx >= 200) return end();
            
            canAnswer = true;
            const q = activeQuestions[curIdx];
            const explanation =
    curLang === "bn"
        ? (q.expb || "এই প্রশ্নের ব্যাখ্যা উপলব্ধ নেই।")
        : (q.expe || "Explanation not available.");
            document.getElementById('st-count').innerText = `Q: ${curIdx+1}/200`;
            document.getElementById('st-score').innerText = `SCORE: ${score}`;
            
            const txt = (curLang === 'bn') ? q.qb : q.qe;
            const opts = (curLang === 'bn') ? q.ab : q.ae;
            
            document.getElementById('q-text').innerText = txt;
            const container = document.getElementById('opt-container');
            container.innerHTML = '';
            
            opts.forEach((o, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerHTML = `<strong>${String.fromCharCode(65+i)}:</strong> ${o}`;
                div.onclick = () => check(i);
                container.appendChild(div);
            });

            timerVal = 30;
            document.getElementById('timer').innerText = timerVal;
            timerInt = setInterval(() => {
                timerVal--;
                document.getElementById('timer').innerText = timerVal;
                if(timerVal <= 0) {
                    clearInterval(timerInt);
                    check(-1); // Timeout case
                }
            }, 1000);

            speak(txt);
        }

        function check(idx) {
            if(!canAnswer) return;
            canAnswer = false;
            clearInterval(timerInt);
            
            const q = activeQuestions[curIdx];
            const opts = document.querySelectorAll('.option');
            
            if(idx === q.ans) {
                score += 10; cor++;
                document.getElementById('snd-cor').play();
                if(idx !== -1) opts[idx].classList.add('correct');
            } else {
                wr++;
                document.getElementById('snd-wr').play();
                if(idx !== -1) opts[idx].classList.add('wrong');
                // Always show correct answer
                if(opts[q.ans]) opts[q.ans].classList.add('correct');
            }

          const box = document.getElementById("exp-box");
box.style.display = "block";
box.innerHTML =
"<b>" +
(curLang=="bn" ? "ব্যাখ্যা" : "Explanation") +
":</b><br>" +
explanation;

setTimeout(() => {
    box.style.display = "none";
    curIdx++;
    loadQ();
}, 5000);

        function speak(t) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const m = new SpeechSynthesisUtterance(t);
            // bn-IN for Bengali, en-IN for English
            m.lang = (curLang === 'bn') ? 'bn-IN' : 'en-IN';
            m.pitch = 1.0; 
            m.rate = 1.0;
            window.speechSynthesis.speak(m);
        }

        function end() {
            show('scr-res');
            document.getElementById('res-score').innerText = score;
            document.getElementById('res-cor').innerText = cor;
            document.getElementById('res-wr').innerText = wr;
            document.getElementById('bg-music').pause();
            window.speechSynthesis.cancel();
        }

        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // Anti-Cheat: Resets game if user switches tabs
        document.addEventListener('visibilitychange', () => {
            if(document.hidden && curIdx > 0 && curIdx < 200) {
                document.body.classList.add('blur');
                alert("GAME ABORTED DUE TO TAB SWITCHING (CHEATING PREVENTION).");
                location.reload();
            }
        });
    </script>
</body>
</html>
