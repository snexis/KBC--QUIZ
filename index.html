function load() {
    currentQ = questions[Math.floor(Math.random() * questions.length)];
    document.getElementById('q').innerText = currentQ.q;
    document.getElementById('btn50').style.display = "inline-block";
    let o = document.getElementById('opts');
    o.innerHTML = "";
    
    currentQ.a.forEach((txt, idx) => {
        let d = document.createElement('div');
        d.className = 'option';
        d.innerText = txt;
        d.onclick = () => check(d, idx);
        o.appendChild(d);
    });
}

function check(d, idx) {
    let buttons = document.querySelectorAll('.option');
    buttons.forEach(btn => btn.style.pointerEvents = 'none');
    
    if(idx === currentQ.c) {
        d.classList.add('correct');
        score += (round * 10);
    } else {
        d.classList.add('wrong');
        buttons[currentQ.c].classList.add('correct');
        score -= 5;
    }
    document.getElementById('s').innerText = score;
    if(score >= 50) round = 2;
    document.getElementById('round').innerText = "রাউন্ড: " + round;
    setTimeout(load, 2000);
}

function useFiftyFifty() {
    let buttons = document.querySelectorAll('.option');
    let removed = 0;
    for(let i = 0; i < buttons.length; i++) {
        if(i !== currentQ.c && removed < 2) {
            buttons[i].classList.add('hidden');
            removed++;
        }
    }
    document.getElementById('btn50').style.display = "none";
}

load();
</script>
