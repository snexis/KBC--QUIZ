<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBC Bengali - মহাকোটিপতি</title>
    <style>
        :root {
            --primary-dark: #020230;
            --gold: #ffd700;
            --white: #ffffff;
            --correct-green: #28a745;
            --wrong-red: #dc3545;
            --blue-glow: #3498db;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', 'Segoe UI', sans-serif; }

        body {
            background-color: var(--primary-dark);
            color: var(--white);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            transition: opacity 0.5s ease;
        }

        .active-screen { display: flex; }

        /* Welcome Screen */
        .kbc-logo { font-size: 80px; color: var(--gold); text-shadow: 0 0 20px var(--gold); font-weight: bold; }

        /* Game Board */
        .game-container {
            width: 90%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
        }

        /* Timer UI */
        .timer-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid var(--gold);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.5);
        }

        /* Question & Options */
        .question-box {
            background: linear-gradient(to right, #08085e, #1a1a7a);
            border: 2px solid var(--white);
            padding: 30px;
            border-radius: 50px;
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .option-btn {
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--white);
            color: white;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
        }

        .option-btn:disabled { cursor: not-allowed; }
        .option-btn.dimmed { opacity: 0.3; }

        /* Suspense Animation */
        @keyframes blink {
            0% { background: var(--blue-glow); }
            50% { background: var(--gold); color: black; }
            100% { background: var(--blue-glow); }
        }
        .blinking { animation: blink 0.5s infinite; }

        .correct { background: var(--correct-green) !important; border-color: var(--gold) !important; }
        .wrong { background: var(--wrong-red) !important; }

        /* Buttons */
        .btn-gold {
            background: linear-gradient(180deg, #ffd700, #b8860b);
            color: black;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* Money Ladder */
        .ladder { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; }
        .step { font-size: 14px; padding: 2px 10px; color: #888; }
        .step.active { color: var(--gold); font-weight: bold; background: rgba(255,215,0,0.1); }
        .step.safe { border-bottom: 1px solid #444; color: white; }

        /* Victory/Defeat Screens */
        .full-result {
            text-align: center;
            background: radial-gradient(circle, #1a1a7a, #020230);
            width: 100%;
            height: 100%;
        }
        .win-msg { color: var(--gold); font-size: 60px; text-shadow: 0 0 20px #fff; margin-bottom: 20px; }
        .lose-msg { color: #ccc; font-size: 40px; margin-bottom: 20px; }

        @media (max-width: 768px) {
            .game-container { grid-template-columns: 1fr; }
            .ladder { display: none; }
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="screen-welcome" class="screen active-screen">
        <div class="kbc-logo">KBC</div>
        <div style="font-size: 24px; color: var(--gold); margin-bottom: 30px;">কৌন বনেগা ক্রোড়পতি</div>
        <button class="btn-gold" onclick="initiateGame()">গেম শুরু করুন</button>
    </div>

    <!-- Gameplay Board -->
    <div id="screen-game" class="screen">
        <div class="timer-circle" id="timer-display">30</div>
        
        <div class="game-container">
            <div class="main-area">
                <div class="question-box" id="q-text">এখানে প্রশ্ন লোড হবে...</div>
                
                <div class="options-grid" id="options-box">
                    <!-- Buttons will be here -->
                </div>

                <div style="text-align: center; margin-top: 30px;">
                    <button id="btn-start-timer" class="btn-gold" onclick="startCountdown()">সময় শুরু করুন (Start Timer)</button>
                </div>
            </div>

            <div class="ladder" id="money-ladder"></div>
        </div>
    </div>

    <!-- Win/Lose Screens -->
    <div id="screen-result" class="screen full-result">
        <div id="result-content">
            <!-- Dynamic Content -->
        </div>
        <button class="btn-gold" onclick="resetEntireGame()">নতুন গেম খেলুন</button>
    </div>

    <script>
        // --- Questions Pool (Expanded) ---
        const questions = [
            { q: "ভারতের প্রথম নোবেল পুরস্কার জয়ী কে ছিলেন?", a: ["রবীন্দ্রনাথ ঠাকুর", "সি ভি রমন", "মাদার টেরেসা", "অমর্ত্য সেন"], c: 0 },
            { q: "পশ্চিমবঙ্গের রাজ্য পশু কোনটি?", a: ["রয়্যাল বেঙ্গল টাইগার", "মেছো বিড়াল", "হাতি", "গন্ডার"], c: 1 },
            { q: "সত্যজিৎ রায়ের প্রথম চলচ্চিত্র কোনটি?", a: ["অপরাজিত", "অপুর সংসার", "পথের পাঁচালী", "জলসাঘর"], c: 2 },
            { q: "কোন গ্রহকে 'লাল গ্রহ' বলা হয়?", a: ["শুক্র", "বৃহস্পতি", "মঙ্গল", "শনি"], c: 2 },
            { q: "কলকাতা কত সালে ভারতের রাজধানী থেকে সরে যায়?", a: ["১৯০৫", "১৯১১", "১৯৪৭", "১৯৫০"], c: 1 },
            { q: "সৌরজগতের বৃহত্তম গ্রহ কোনটি?", a: ["শনি", "ইউরেনাস", "বৃহস্পতি", "নেপচুন"], c: 2 },
            { q: "কোন বাঙালি বিজ্ঞানী জগদীশ চন্দ্র বসুর সাথে কাজ করেছিলেন?", a: ["প্রফুল্ল চন্দ্র রায়", "সত্যেন্দ্রনাথ বসু", "মেঘনাদ সাহা", "উপেন্দ্রনাথ ব্রহ্মচারী"], c: 1 },
            { q: "সূর্য থেকে পৃথিবীতে আলো আসতে কত সময় লাগে?", a: ["২ মিনিট", "৫ মিনিট", "৮ মিনিট ২০ সেকেন্ড", "১০ মিনিট"], c: 2 },
            { q: "কোন ভিটামিনের অভাবে স্কার্ভি রোগ হয়?", a: ["ভিটামিন এ", "ভিটামিন বি", "ভিটামিন সি", "ভিটামিন ডি"], c: 2 },
            { q: "ইডন গার্ডেন স্টেডিয়ামটি কোথায় অবস্থিত?", a: ["মুম্বাই", "দিল্লি", "কলকাতা", "চেন্নাই"], c: 2 },
            { q: "বিখ্যাত 'জয় হিন্দ' স্লোগান কে দিয়েছিলেন?", a: ["ভগত সিং", "সুভাষচন্দ্র বসু", "মহাত্মা গান্ধী", "জওহরলাল নেহরু"], c: 1 },
            { q: "তাজমহল কোন নদীর তীরে অবস্থিত?", a: ["গঙ্গা", "যমুনা", "সরস্বতী", "নর্মদা"], c: 1 },
            { q: "দাবা খেলার জন্ম কোন দেশে হয়েছিল?", a: ["চীন", "ভারত", "পারস্য", "মিশর"], c: 1 },
            { q: "পেনিসিলিন কে আবিষ্কার করেন?", a: ["আলেকজান্ডার ফ্লেমিং", "লুই পাস্তুর", "মেরি কুরি", "আইজাক নিউটন"], c: 0 },
            { q: "ভারতের দীর্ঘতম নদী কোনটি?", a: ["যমুনা", "ব্রহ্মপুত্র", "গঙ্গা", "গোদাবরী"], c: 2 }
            // ... more questions can be added here
        ];

        const moneyLadder = ["₹১", "₹২", "₹৫", "₹১০", "₹২০", "₹৪০", "₹৮০", "₹১৬০", "₹৩২০", "₹৬৪০", "₹১,২৫০", "₹২,৫০০", "₹৫,০০০", "₹১০,০০০", "₹২০,০০০", "₹৪০,০০০", "₹৮০,০০০", "₹১,৬০,০০০", "₹৩,২০,০০০", "₹৬,৪০,০০০", "₹১২,৫০,০০০", "₹২৫,০০,০০০", "₹৫০,০০,০০০", "₹১ কোটি", "₹২ কোটি", "₹৩ কোটি", "₹৪ কোটি", "₹৫ কোটি", "₹৬ কোটি", "₹৭ কোটি"];
        const safeZones = [4, 9, 14, 19, 24, 29];

        let currentIdx = 0;
        let shuffledQ = [];
        let timerValue = 30;
        let timerInterval = null;
        let isTimerActive = false;

        const sounds = {
            theme: new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'),
            lock: new Audio('https://actions.google.com/sounds/v1/science_fiction/glitch_low_power_sweep.ogg'),
            correct: new Audio('https://actions.google.com/sounds/v1/cartoon/clime.ogg'),
            wrong: new Audio('https://actions.google.com/sounds/v1/cartoon/boing.ogg'),
            ticking: new Audio('https://actions.google.com/sounds/v1/alarms/mechanical_clock_ticking.ogg')
        };

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initiateGame() {
            shuffledQ = shuffle([...questions]);
            currentIdx = 0;
            switchScreen('screen-game');
            sounds.theme.loop = true;
            sounds.theme.play();
            loadNextQuestion();
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(id).classList.add('active-screen');
        }

        function loadNextQuestion() {
            clearInterval(timerInterval);
            isTimerActive = false;
            timerValue = 30;
            document.getElementById('timer-display').innerText = timerValue;
            document.getElementById('btn-start-timer').style.display = 'inline-block';
            
            const q = shuffledQ[currentIdx];
            document.getElementById('q-text').innerText = `প্রশ্ন ${currentIdx + 1}: ${q.q}`;
            
            const box = document.getElementById('options-box');
            box.innerHTML = '';
            q.a.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span style="color:var(--gold)">${String.fromCharCode(65+i)}:</span> ${opt}`;
                btn.disabled = true; // Disabled until timer starts
                btn.onclick = () => handleAnswer(i, btn);
                box.appendChild(btn);
            });

            updateLadderUI();
        }

        function startCountdown() {
            if (isTimerActive) return;
            isTimerActive = true;
            document.getElementById('btn-start-timer').style.display = 'none';
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = false);
            
            sounds.ticking.loop = true;
            sounds.ticking.play();

            timerInterval = setInterval(() => {
                timerValue--;
                document.getElementById('timer-display').innerText = timerValue;
                if (timerValue <= 0) {
                    clearInterval(timerInterval);
                    endGame(false, "সময় শেষ হয়ে গেছে!");
                }
            }, 1000);
        }

        function handleAnswer(choice, btn) {
            clearInterval(timerInterval);
            sounds.ticking.pause();
            sounds.lock.play();

            // Suspend and Blinking Phase
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => {
                if (b !== btn) b.classList.add('dimmed');
                b.disabled = true;
            });
            btn.classList.add('blinking');

            setTimeout(() => {
                btn.classList.remove('blinking');
                const correct = shuffledQ[currentIdx].c;

                if (choice === correct) {
                    btn.classList.add('correct');
                    sounds.correct.play();
                    setTimeout(() => {
                        if (currentIdx === 29) {
                            endGame(true);
                        } else {
                            currentIdx++;
                            loadNextQuestion();
                        }
                    }, 2000);
                } else {
                    btn.classList.add('wrong');
                    allBtns[correct].classList.remove('dimmed');
                    allBtns[correct].classList.add('correct');
                    sounds.wrong.play();
                    setTimeout(() => endGame(false), 2000);
                }
            }, 3000); // 3 seconds suspense
        }

        function updateLadderUI() {
            const ladder = document.getElementById('money-ladder');
            ladder.innerHTML = '';
            [...moneyLadder].reverse().forEach((val, i) => {
                const actualIdx = 29 - i;
                const div = document.createElement('div');
                div.className = `step ${actualIdx === currentIdx ? 'active' : ''} ${safeZones.includes(actualIdx) ? 'safe' : ''}`;
                div.innerText = `${actualIdx + 1}. ${val}`;
                ladder.appendChild(div);
            });
        }

        function endGame(isWin, customMsg = "") {
            sounds.theme.pause();
            sounds.ticking.pause();
            switchScreen('screen-result');
            const content = document.getElementById('result-content');
            
            let prize = "₹০";
            if (isWin) {
                content.innerHTML = `<h1 class="win-msg">অসাধারণ! আপনি জিতেছেন!</h1><p style="font-size:30px">পুরস্কার: ₹৭ কোটি</p>`;
            } else {
                let lastSafe = -1;
                for (let sz of safeZones) { if (currentIdx > sz) lastSafe = sz; }
                prize = lastSafe >= 0 ? moneyLadder[lastSafe] : "₹০";
                content.innerHTML = `<h1 class="lose-msg">আফসোস! আপনি হেরে গেছেন।</h1>
                                    <p style="font-size:24px; margin-bottom:10px;">${customMsg}</p>
                                    <p style="font-size:20px; color:var(--gold)">আপনি জিতলেন: ${prize}</p>
                                    <p style="margin-top:20px; color:#888">আবার পরের বার আসবেন।</p>`;
            }
        }

        function resetEntireGame() {
            switchScreen('screen-welcome');
            sounds.theme.currentTime = 0;
            sounds.theme.play();
        }
    </script>
</body>
</html>
