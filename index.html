<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBC Bengali - কোটিপতি কুইজ</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* 
        ========================================
        1. CONFIGURATION BLOCK (EASY CUSTOMIZE)
        ========================================
        Edit the values below to change game behavior 
        */
        :root {
            /* Colors */
            --bg-color: #020230;
            --accent-gold: #ffd700;
            --option-blue: #111499;
            --option-hover: #1e21d3;
            --correct-green: #2ecc71;
            --wrong-red: #e74c3c;
            --text-white: #ffffff;
            
            /* Timing (in seconds) */
            --timer-duration: 45; 
            --suspense-blink-time: 3000; /* 3 seconds blink before reveal */
            
            /* Fonts */
            --main-font: 'Hind Siliguri', sans-serif;
        }

        /* Assets Setup */
        const ASSETS = {
            logo: "https://i.imgur.com/your_logo_here.png", // Replace with your KBC Logo URL
            bg_music: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", // Replace with KBC Theme
            tick_sound: "https://www.soundscape.com/tick.mp3",
            win_sound: "https://www.soundscape.com/win.mp3"
        };

        /* 
        ========================================
        2. CSS STYLES (MODERN & RESPONSIVE)
        ========================================
        */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--main-font);
            background: radial-gradient(circle, #05054d 0%, #02021a 100%);
            color: var(--text-white);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Login Screen */
        #login-screen, #game-screen, #result-screen {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .hidden { display: none !important; }

        .logo-anim {
            width: 250px;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px gold); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 20px gold); }
            100% { transform: scale(1); filter: drop-shadow(0 0 5px gold); }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 5px;
            border: none;
            font-size: 1.1rem;
        }

        .btn {
            background: linear-gradient(to bottom, #ffd700, #b8860b);
            color: #000;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
        }

        .btn:hover { transform: scale(1.1); box-shadow: 0 0 15px gold; }

        /* Game Arena */
        .game-container {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 768px) {
            .game-container { grid-template-columns: 1fr; }
            .money-pyramid { display: none; } /* Hide on small mobile to save space */
        }

        /* Question Box */
        .question-area {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 50px;
        }

        .timer-circle {
            width: 80px;
            height: 80px;
            border: 4px solid var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px;
            background: rgba(0,0,0,0.5);
        }

        .question-box {
            background: linear-gradient(90deg, transparent 0%, var(--option-blue) 50%, transparent 100%);
            border: 2px solid var(--accent-gold);
            padding: 25px;
            margin-bottom: 30px;
            font-size: 1.4rem;
            border-radius: 50px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: var(--option-blue);
            border: 1px solid #555;
            padding: 15px;
            border-radius: 30px;
            cursor: pointer;
            text-align: left;
            padding-left: 40px;
            position: relative;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .option-btn:hover { background: var(--option-hover); border-color: gold; }

        /* Blinking Effect */
        .blinking {
            animation: blinker 0.4s step-start infinite;
        }

        @keyframes blinker {
            50% { background: orange; color: black; }
        }

        .correct { background: var(--correct-green) !important; color: white; }
        .wrong { background: var(--wrong-red) !important; color: white; }

        /* Lifelines */
        .lifeline-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .lifeline-btn {
            width: 60px;
            height: 40px;
            background: #444;
            border: 1px solid gold;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.8rem;
            color: gold;
        }

        .lifeline-btn.used {
            opacity: 0.3;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        /* Money Pyramid */
        .money-pyramid {
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column-reverse;
            justify-content: center;
        }

        .level {
            padding: 5px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .level.active { color: var(--accent-gold); font-weight: bold; background: rgba(255,215,0,0.1); }
        .level.safe { color: white; border-bottom: 1px solid #444; }

        /* Poll Modal */
        .poll-container {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-color);
            border: 3px solid gold;
            padding: 30px;
            z-index: 100;
            width: 300px;
            border-radius: 15px;
        }

        .poll-bar {
            height: 20px;
            background: gold;
            margin: 10px 0;
            transition: width 1s;
        }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen">
        <div class="logo-anim">
            <svg viewBox="0 0 100 100" width="200">
                <circle cx="50" cy="50" r="45" fill="none" stroke="gold" stroke-width="2"/>
                <text x="50%" y="55%" text-anchor="middle" fill="gold" font-size="14" font-weight="bold">KBC BENGALI</text>
            </svg>
        </div>
        <div class="login-card">
            <h2>স্বাগতম</h2>
            <p>আপনার নাম লিখুন শুরু করার জন্য</p>
            <input type="text" id="username" placeholder="আপনার নাম...">
            <button class="btn" onclick="enterArena()">প্রবেশ করুন</button>
        </div>
    </div>

    <!-- 2. GAME ARENA -->
    <div id="game-screen" class="hidden">
        <div class="game-container">
            <div class="main-play-area">
                <div class="lifeline-bar">
                    <button id="l-5050" class="lifeline-btn" onclick="use5050()">50:50</button>
                    <button id="l-poll" class="lifeline-btn" onclick="usePoll()">Poll</button>
                    <button id="l-phone" class="lifeline-btn" onclick="usePhone()">Call</button>
                    <button id="l-flip" class="lifeline-btn" onclick="useFlip()">Flip</button>
                </div>

                <div class="question-area">
                    <div id="timer" class="timer-circle">45</div>
                    
                    <div id="start-overlay">
                        <button class="btn" onclick="startGame()">গেম শুরু করুন (START)</button>
                    </div>

                    <div id="quiz-ui" class="hidden">
                        <div id="question-text" class="question-box">
                            এখানে প্রশ্নটি দেখা যাবে...
                        </div>
                        <div class="options-grid">
                            <div class="option-btn" id="opt-0" onclick="handleAnswer(0)">A: ---</div>
                            <div class="option-btn" id="opt-1" onclick="handleAnswer(1)">B: ---</div>
                            <div class="option-btn" id="opt-2" onclick="handleAnswer(2)">C: ---</div>
                            <div class="option-btn" id="opt-3" onclick="handleAnswer(3)">D: ---</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Money Tree -->
            <div class="money-pyramid" id="money-tree">
                <!-- Levels will be injected by JS -->
            </div>
        </div>
    </div>

    <!-- 3. MODALS (POLL / CALL) -->
    <div id="poll-modal" class="poll-container hidden">
        <h3>Audience Poll</h3>
        <div id="poll-results"></div>
        <button class="btn" style="margin-top:20px" onclick="closeModal('poll-modal')">OK</button>
    </div>

    <div id="phone-modal" class="poll-container hidden">
        <h3>Calling a Friend...</h3>
        <p id="friend-talk" style="margin: 15px 0; font-style: italic;"></p>
        <button class="btn" onclick="closeModal('phone-modal')">Thanks!</button>
    </div>

    <script>
        /* 
        ========================================
        3. DATA: 150 QUESTIONS (Indian Bengali)
        ========================================
        Each question has a difficulty level (1-15)
        */
        const questionBank = [
            { q: "ভারতের রাজধানী কোনটি?", o: ["কলকাতা", "নয়াদিল্লি", "মুম্বই", "চেন্নাই"], a: 1, level: 1 },
  { q: "পশ্চিমবঙ্গের রাজ্য পশুর নাম কী?", o: ["রয়্যাল বেঙ্গল টাইগার", "মেছো বিড়াল", "হাতি", "হরিণ"], a: 1, level: 1 },
  { q: "সূর্য কোন দিকে ওঠে?", o: ["পশ্চিম", "উত্তর", "দক্ষিণ", "পূর্ব"], a: 3, level: 1 },
  { q: "আমাদের জাতীয় সংগীত 'জন গণ মন' কার লেখা?", o: ["রবীন্দ্রনাথ ঠাকুর", "কাজী নজরুল ইসলাম", "বঙ্কিমচন্দ্র চট্টোপাধ্যায়", "শরৎচন্দ্র চট্টোপাধ্যায়"], a: 0, level: 1 },
  { q: "ভারতের জাতীয় ফল কোনটি?", o: ["আপেল", "কাঁঠাল", "আম", "কলা"], a: 2, level: 1 },
  { q: "কোন গ্রহকে 'লাল গ্রহ' বলা হয়?", o: ["বুধ", "মঙ্গল", "শুক্র", "বৃহস্পতি"], a: 1, level: 1 },
  { q: "বছরের কোন মাসটি সাধারণত ২৮ দিনের হয়?", o: ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল"], a: 1, level: 1 },
  { q: "একটি ক্রিকেট ম্যাচে প্রতি দলে কতজন খেলোয়াড় থাকে?", o: ["৯ জন", "১০ জন", "১১ জন", "১২ জন"], a: 2, level: 1 },
  { q: "কোন প্রাণীকে 'মরুভূমির জাহাজ' বলা হয়?", o: ["উট", "ঘোড়া", "গাধা", "হাতি"], a: 0, level: 1 },
  { q: "ইংরেজি বর্ণমালায় মোট কয়টি স্বরবর্ণ (Vowel) আছে?", o: ["৫টি", "৪টি", "৬টি", "৭টি"], a: 0, level: 1 },
  { q: "তাজমহল ভারতের কোন শহরে অবস্থিত?", o: ["দিল্লি", "আগরা", "জয়পুর", "লখনউ"], a: 1, level: 1 },
  { q: "পৃথিবীর সবচেয়ে বড় মহাসাগর কোনটি?", o: ["ভারত মহাসাগর", "আটলান্টিক মহাসাগর", "প্রশান্ত মহাসাগর", "সুমেরু মহাসাগর"], a: 2, level: 1 },
  { q: "কোন উৎসবকে 'আলোর উৎসব' বলা হয়?", o: ["হোলি", "দুর্গাপুজো", "দীপাবলি", "ঈদ"], a: 2, level: 1 },
  { q: "ল্যাপটপ বা কম্পিউটার স্ক্রিনে দেখার জন্য কোন ইনপুট ডিভাইস ব্যবহার করা হয়?", o: ["মাউস", "কিবোর্ড", "মনিটর", "প্রিন্টার"], a: 0, level: 1 },
  { q: "কলকাতা কোন নদীর তীরে অবস্থিত?", o: ["গঙ্গা", "যমুনা", "হুগলি", "পদ্মা"], a: 2, level: 1 },
  { q: "ডাক্তাররা নাড়ি (Pulse) দেখে মানুষের কী পরীক্ষা করেন?", o: ["রক্তের পরিমাণ", "হৃদস্পন্দনের গতি", "শরীরের ওজন", "চোখের দৃষ্টি"], a: 1, level: 1 },
  { q: "মহাকাব্য 'রামায়ণ' অনুযায়ী শ্রী রামচন্দ্রের স্ত্রীর নাম কী?", o: ["সীতা", "রাধা", "দ্রৌপদী", "কুন্তী"], a: 0, level: 1 },
  { q: "দাবা খেলায় বোর্ডের ওপর মোট কতগুলি ঘর থাকে?", o: ["৫০টি", "৬৪টি", "৬০টি", "৭০টি"], a: 1, level: 1 },
  { q: "কোন রঙের ট্রাফিক লাইট দেখলে গাড়ি থামাতে হয়?", o: ["সবুজ", "হলুদ", "নীল", "লাল"], a: 3, level: 1 },
  { q: "মানুষের মুখের ভেতর মোট কত ধরনের দাঁত থাকে?", o: ["২ ধরনের", "৩ ধরনের", "৪ ধরনের", "৫ ধরনের"], a: 2, level: 1 },
  { q: "আমাদের সৌরজগতের সবচেয়ে বড় গ্রহ কোনটি?", o: ["পৃথিবী", "মঙ্গল", "বৃহস্পতি", "শনি"], a: 2, level: 1 },
  { q: "পাহাড়ি এলাকায় যাতায়াতের জন্য প্রধানত কোন পশুর সাহায্য নেওয়া হয়?", o: ["উট", "খচ্চর বা ঘোড়া", "হাতি", "মহিষ"], a: 1, level: 1 },
  { q: "মোবাইল ফোনে সিম কার্ডের 'SIM' এর পুরো নাম কী?", o: ["Subscriber Identity Module", "System Instant Message", "Secure Internet Medium", "Subscriber International Mobile"], a: 0, level: 1 },
  { q: "কোন পাখির ডিম পৃথিবীর মধ্যে সবচেয়ে বড় হয়?", o: ["ময়ূর", "উটপাখি", "ঈগল", "পেনগুইন"], a: 1, level: 1 },
  { q: "ভারতের স্বাধীনতা দিবস কোন তারিখে পালিত হয়?", o: ["২৬শে জানুয়ারি", "১৫ই আগস্ট", "২রা অক্টোবর", "১৪ই নভেম্বর"], a: 1, level: 1 },
  { q: "রামধনু বা রংধনুতে মোট কয়টি রঙ থাকে?", o: ["৫টি", "৬টি", "৭টি", "৮টি"], a: 2, level: 1 },
  { q: "কোন পতঙ্গ কামড়ালে ডেঙ্গু রোগ হতে পারে?", o: ["অ্যানোফিলিস মশা", "এডিস মশা", "কিউলেক্স msha", "মাছি"], a: 1, level: 1 },
  { q: "ফেসবুক (Facebook) এর প্রতিষ্ঠাতা কে?", o: ["বিল গেটস", "মার্ক জুকারবার্গ", "স্টিভ জবস", "এলন মাস্ক"], a: 1, level: 1 },
  { q: "কোন ফলকে 'ফলের রাজা' বলা হয়?", o: ["আপেল", "লিচু", "আম", "আঙুর"], a: 2, level: 1 },
  { q: "ভারতের জাতীয় পশু কোনটি?", o: ["সিংহ", "রয়্যাল বেঙ্গল টাইগার", "চিতাবাঘ", "হাতি"], a: 1, level: 1 },
  { q: "পৃথিবীর সবচেয়ে উঁচু পর্বতশৃঙ্গ কোনটি?", o: ["কাঞ্চনজঙ্ঘা", "গডউইন অস্টিন", "মাউন্ট এভারেস্ট", "নন্দাদেবী"], a: 2, level: 1 },
  { q: "ভারতের নোট বাতিলের ঐতিহাসিক ঘটনা (Demonetization) কোন সালে ঘটেছিল?", o: ["২০১৪", "২০১৫", "২০১৬", "২০১৭"], a: 2, level: 1 },
  { q: "কলকাতার বিখ্যাত 'হাওড়া ব্রিজ' এর আনুষ্ঠানিক নাম কী?", o: ["বিদ্যাসাগর সেতু", "রবীন্দ্র সেতু", "বিবেকানন্দ সেতু", "নজরুল সেতু"], a: 1, level: 1 },
  { q: "কোন ভিটামিনের অভাবে মানুষের রাতকানা রোগ হয়?", o: ["ভিটামিন B", "ভিটামিন C", "ভিটামিন A", "ভিটামিন D"], a: 2, level: 1 },

  { q: "ভারতের জাতীয় জলজ প্রাণী কোনটি?", o: ["তিমি", "গাঙ্গেয় ডলফিন (শূশুক)", "হাঙর", "অক্টোপাস"], a: 1, level: 2 },
  { q: "কোনটিকে 'কোষের আত্মঘাতী থলি' (Suicidal Bag) বলা হয়?", o: ["লাইসোজোম", "রাইবোজোম", "মাইটোকন্ড্রিয়া", "গলগি বডি"], a: 0, level: 2 },
  { q: "প্রথম অলিম্পিক খেলা কোথায় শুরু হয়েছিল?", o: ["রোম", "অ্যাথেন্স (গ্রিস)", "প্যারিস", "লন্ডন"], a: 1, level: 2 },
  { q: "কোন মুঘল সম্রাট তাঁর রাজধানী দিল্লি থেকে দৌলতাবাদে স্থানান্তরিত করেছিলেন?", o: ["আলাউদ্দিন খিলজি", "মহম্মদ বিন তুঘলক", "আকবর", "শেরশাহ"], a: 1, level: 3 },
  { q: "ভৌগোলিক পরিভাষায় 'সাত পাহাড়ের দেশ' কাকে বলা হয়?", o: ["রোম", "ভ্যাটিকান", "সুইজারল্যান্ড", "নেপাল"], a: 0, level: 2 },
  { q: "ভারতের কোন রাজ্যে সূর্যোদয় সবচেয়ে দেরিতে হয়?", o: ["জম্মু ও কাশ্মীর", "রাজস্থান", "গুজরাট", "মহারাষ্ট্র"], a: 2, level: 2 },
  { q: "কোন শিখ গুরু 'খালসা' পন্থার প্রবর্তন করেছিলেন?", o: ["গুরু নানক", "গুরু অর্জুন দেব", "গুরু গোবিন্দ সিং", "গুরু তেগ বাহাদুর"], a: 2, level: 3 }
];
            // ... Logic allows up to 150 questions. Add more objects here following this format.
        ];

        const moneyStairs = [
            "₹১,০০০", "₹২,০০০", "₹৩,০০০", "₹৫,০০০", "₹১০,০০০", 
            "₹২০,০০০", "₹৪০,০০০", "₹৮০,০০০", "₹১,৬০,০০০", "₹৩,২০,০০০",
            "₹৬,৪০,০০০", "₹১২,৫০,০০০", "₹২৫,০০,০০০", "₹৫০,০০,০০০", "₹৭ কোটি"
        ];

        /* 
        ========================================
        4. GAME LOGIC ENGINE
        ========================================
        */
        let currentLevel = 0;
        let activeQuestion = null;
        let gameTimer = null;
        let timeLeft = 45;
        let lifelinesUsed = { '5050': false, 'poll': false, 'phone': false, 'flip': false };

        // INITIALIZE UI
        function enterArena() {
            const user = document.getElementById('username').value;
            if(!user) return alert("অনুগ্রহ করে আপনার নাম দিন!");
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            renderMoneyTree();
        }

        function renderMoneyTree() {
            const tree = document.getElementById('money-tree');
            tree.innerHTML = '';
            moneyStairs.forEach((amt, idx) => {
                const div = document.createElement('div');
                div.className = `level ${idx === currentLevel ? 'active' : ''}`;
                if(idx === 4 || idx === 9 || idx === 14) div.classList.add('safe');
                div.innerHTML = `${idx + 1} ◆ ${amt}`;
                tree.appendChild(div);
            });
        }

        function startGame() {
            document.getElementById('start-overlay').classList.add('hidden');
            document.getElementById('quiz-ui').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            // Get questions for current level difficulty
            let filtered = questionBank.filter(q => q.level === (currentLevel + 1));
            if(filtered.length === 0) filtered = [questionBank[0]]; // Fallback
            
            activeQuestion = filtered[Math.floor(Math.random() * filtered.length)];
            
            document.getElementById('question-text').innerText = activeQuestion.q;
            for(let i=0; i<4; i++) {
                const btn = document.getElementById(`opt-${i}`);
                btn.innerText = `${String.fromCharCode(65+i)}: ${activeQuestion.o[i]}`;
                btn.className = 'option-btn';
                btn.style.visibility = 'visible';
            }
            
            startTimer();
            renderMoneyTree();
        }

        function startTimer() {
            clearInterval(gameTimer);
            timeLeft = 45;
            document.getElementById('timer').innerText = timeLeft;
            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(gameTimer);
                    gameOver("সময় শেষ!");
                }
            }, 1000);
        }

        function handleAnswer(index) {
            clearInterval(gameTimer);
            const selectedBtn = document.getElementById(`opt-${index}`);
            
            // Suspense Blinking
            selectedBtn.classList.add('blinking');
            
            setTimeout(() => {
                selectedBtn.classList.remove('blinking');
                if(index === activeQuestion.a) {
                    selectedBtn.classList.add('correct');
                    if(currentLevel === 14) {
                        alert("অভিনন্দন! আপনি ৭ কোটি টাকা জিতেছেন!");
                        location.reload();
                    } else {
                        setTimeout(() => {
                            currentLevel++;
                            loadQuestion();
                        }, 2000);
                    }
                } else {
                    selectedBtn.classList.add('wrong');
                    document.getElementById(`opt-${activeQuestion.a}`).classList.add('correct');
                    setTimeout(() => gameOver("ভুল উত্তর!"), 2000);
                }
            }, 3000); // 3-second suspense blink
        }

        // LIFELINES Logic
        function use5050() {
            if(lifelinesUsed['5050']) return;
            lifelinesUsed['5050'] = true;
            document.getElementById('l-5050').classList.add('used');
            
            let removed = 0;
            let indices = [0, 1, 2, 3].filter(i => i !== activeQuestion.a);
            indices = indices.sort(() => Math.random() - 0.5);
            
            document.getElementById(`opt-${indices[0]}`).style.visibility = 'hidden';
            document.getElementById(`opt-${indices[1]}`).style.visibility = 'hidden';
        }

        function usePoll() {
            if(lifelinesUsed['poll']) return;
            lifelinesUsed['poll'] = true;
                document.getElementById('l-poll').classList.add('used');
            
            const results = [10, 10, 10, 10];
            results[activeQuestion.a] = 70; // High probability for correct
            
            document.getElementById('poll-modal').classList.remove('hidden');
            const pollDiv = document.getElementById('poll-results');
            pollDiv.innerHTML = '';
            
            results.forEach((pct, i) => {
                pollDiv.innerHTML += `
                    <div style="text-align:left; font-size: 0.8rem">Option ${String.fromCharCode(65+i)}: ${pct}%</div>
                    <div class="poll-bar" style="width: ${pct}%"></div>
                `;
            });
        }

        function usePhone() {
            if(lifelinesUsed['phone']) return;
            lifelinesUsed['phone'] = true;
            document.getElementById('l-l-phone').classList.add('used');
            
            document.getElementById('phone-modal').classList.remove('hidden');
            const options = ["আমার মনে হয় সঠিক উত্তর A হবে।", "আমি নিশ্চিত নই, তবে সম্ভবত B সঠিক।", "আমি ১০০% নিশ্চিত উত্তর C।", "আমার মতে উত্তরটি D।"];
            document.getElementById('friend-talk').innerText = `বন্ধু: "${options[activeQuestion.a]}"`;
            timeLeft += 30; // Extra time for calling
        }

        function useFlip() {
            if(lifelinesUsed['flip']) return;
            lifelinesUsed['flip'] = true;
            document.getElementById('l-flip').classList.add('used');
            loadQuestion();
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function gameOver(msg) {
            alert(`${msg} আপনার খেলা এখানেই শেষ। আপনি জিতেছেন: ${currentLevel > 0 ? moneyStairs[currentLevel-1] : "₹০"}`);
            location.reload();
        }

    </script>
</body>
</html>
