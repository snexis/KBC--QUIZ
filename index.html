<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBC Bengali - 30 Round Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020230;
            --accent-gold: #ffd700;
            --option-blue: #111499;
            --correct-green: #2ecc71;
            --wrong-red: #e74c3c;
            --text-main: #ffffff;
            --milestone-purple: #8e44ad;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: radial-gradient(circle, #08085e 0%, #010114 100%);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .hidden { display: none !important; }

        /* --- UI COMPONENTS --- */
        #start-screen, #rules-screen, #game-screen {
            width: 100%; max-width: 1200px; height: 90vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }

        /* --- NEW: LIVE TENSION METER --- */
        .tension-container {
            position: absolute; top: 20px; left: 20px; text-align: left;
            background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid var(--accent-gold); border-radius: 8px;
        }
        .tension-bar { width: 100px; height: 10px; background: #333; margin-top: 5px; border-radius: 5px; overflow: hidden; }
        #tension-fill { width: 5%; height: 100%; background: linear-gradient(90deg, #2ecc71, #e74c3c); transition: 1s; }

        /* --- NEW: HOST DIALOGUE BOX --- */
        #host-box {
            width: 90%; background: rgba(0,0,0,0.8); border-left: 5px solid var(--accent-gold);
            padding: 15px; margin-top: 20px; font-style: italic; color: #ddd; font-size: 1.1rem;
            min-height: 60px; display: flex; align-items: center; justify-content: center;
        }

        .question-box {
            background: linear-gradient(90deg, rgba(0,0,0,0) 0%, var(--option-blue) 50%, rgba(0,0,0,0) 100%);
            border-top: 2px solid var(--accent-gold);
            border-bottom: 2px solid var(--accent-gold);
            padding: 30px; font-size: 1.7rem; width: 100%; margin-bottom: 20px;
            font-weight: bold; text-shadow: 2px 2px 4px #000;
        }

        .options-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 90%;
        }

        .option {
            background: rgba(17, 20, 153, 0.8); border: 1px solid rgba(255,215,0,0.4);
            padding: 15px 25px; border-radius: 40px; font-size: 1.3rem; text-align: left;
            cursor: pointer; transition: 0.2s; font-weight: bold; min-height: 60px;
            display: flex; align-items: center; text-shadow: 2px 2px 4px #000;
        }
        .option span { color: var(--accent-gold); margin-right: 12px; font-weight: 900; }
        .option:hover { border-color: #fff; background: #1e21d3; }

        .timer-circle {
            width: 85px; height: 85px; border: 5px solid var(--accent-gold);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; font-weight: 900; margin-bottom: 15px;
            background: rgba(0,0,0,0.8); box-shadow: 0 0 15px var(--accent-gold);
        }

        .ll-btn {
            position: relative; width: 75px; height: 45px;
            background: #111; border: 2px solid var(--accent-gold);
            border-radius: 50%; color: var(--accent-gold); cursor: pointer;
            font-weight: bold; transition: 0.3s;
        }
        .ll-btn.used { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }
        .ll-btn.used::after {
            content: ""; position: absolute; top: 50%; left: 10%; width: 80%; height: 3px;
            background: #ff0000; box-shadow: 0 0 8px red; transform: translateY(-50%) rotate(-30deg);
        }

        .money-pyramid {
            background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px;
            display: flex; flex-direction: column-reverse; height: 100%;
            overflow-y: auto; border-left: 2px solid var(--accent-gold);
        }
        .lvl { padding: 3px 10px; font-size: 0.85rem; color: #888; font-weight: bold; }
        .lvl.active { 
            color: #000 !important; background: var(--accent-gold) !important;
            border-radius: 5px; transform: scale(1.05); text-shadow: none;
        }
        /* Milestone Styling */
        .lvl.milestone { color: var(--accent-gold); border: 1px solid rgba(255,215,0,0.3); background: rgba(142, 68, 173, 0.2); }

        #game-over {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; text-align: center;
        }

        .btn-grand {
            background: linear-gradient(180deg, #ffd700, #b8860b);
            color: #000; padding: 15px 40px; border-radius: 50px;
            font-size: 1.4rem; border: none; cursor: pointer; font-weight: 900;
            box-shadow: 0 0 20px rgba(255,215,0,0.4);
        }

        .blinking { animation: blink-opt 0.3s infinite; }
        @keyframes blink-opt { 50% { background: orange; color: black; } }
        .correct { background: var(--correct-green) !important; }
        .wrong { background: var(--wrong-red) !important; }
    </style>
</head>
<body>

    <audio id="bgm" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
    <audio id="snd-tick" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
    <audio id="snd-wrong" src="https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3"></audio>
    <audio id="snd-correct" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

    <div id="start-screen">
        <h1 style="color:gold; font-size:3rem; margin-bottom:30px">KBC BENGALI</h1>
        <button class="btn-grand" onclick="showRules()">খেলার জন্য এখানে ক্লিক করুন</button>
    </div>

    <div id="rules-screen" class="hidden">
        <div style="background:rgba(255,255,255,0.1); padding:40px; border-radius:20px; border:1px solid gold">
            <h2 style="color:gold; margin-bottom:20px">খেলার নিয়ম</h2>
            <p style="font-size:1.3rem; line-height:1.8">
                ১. মোট ৩০টি প্রশ্নের সঠিক উত্তর দিতে হবে।<br>
                ২. প্রতি প্রশ্নে ২৫ সেকেন্ড সময় পাবেন।<br>
                ৩. ভুল উত্তর দিলে <b>সেফ জোন (Safe Zone)</b> অনুযায়ী টাকা পাবেন।<br>
                ৪. ৫, ১৫ এবং ২৫ নম্বর প্রশ্ন হলো আমাদের মাইলস্টোন।
            </p>
            <button class="btn-grand" style="margin-top:30px" onclick="startGame()">PLAY NOW</button>
        </div>
    </div>

    <div id="game-screen" class="hidden">
        <!-- LIVE TENSION METER -->
        <div class="tension-container">
            <div style="font-size: 0.8rem; font-weight: bold; color: gold;">LIVE TENSION</div>
            <div class="tension-bar"><div id="tension-fill"></div></div>
        </div>

        <div style="display:grid; grid-template-columns: 3fr 1fr; gap:20px; width:100%; height:80vh">
            <div class="play-area">
                <div style="display:flex; gap:10px; justify-content:center; margin-bottom:15px">
                    <button id="ll-5050" class="ll-btn" onclick="useLifeline('5050')">50:50</button>
                    <button id="ll-poll" class="ll-btn" onclick="useLifeline('poll')">POLL</button>
                    <button id="ll-call" class="ll-btn" onclick="useLifeline('call')">CALL</button>
                    <button id="ll-flip" class="ll-btn" onclick="useLifeline('flip')">FLIP</button>
                </div>
                <div class="timer-circle" id="timer">25</div>
                <div class="question-box" id="q-text"></div>
                <div class="options-grid">
                    <div class="option" id="opt-0" onclick="checkAnswer(0)"></div>
                    <div class="option" id="opt-1" onclick="checkAnswer(1)"></div>
                    <div class="option" id="opt-2" onclick="checkAnswer(2)"></div>
                    <div class="option" id="opt-3" onclick="checkAnswer(3)"></div>
                </div>
                <!-- DYNAMIC HOST DIALOGUE -->
                <div id="host-box">স্বাগতম! খেলা শুরু করা যাক...</div>
            </div>
            <div class="money-pyramid" id="money-tree"></div>
        </div>
    </div>

    <div id="game-over" class="hidden">
        <h1 id="over-msg" style="color:white; font-size:3rem; margin-bottom:10px">GAME OVER</h1>
        <h2 id="final-prize" style="color:gold; font-size:2rem; margin-bottom:30px"></h2>
        <button class="btn-grand" onclick="location.reload()">RESTART</button>
    </div>

    <script>
        /* [CORE DATA PRESERVED] */
        const QUESTION_BANK = [
            { q: "ভারতের রাজধানী কোনটি?", o: ["কলকাতা", "নয়াদিল্লি", "মুম্বই", "চেন্নাই"], a: 1, level: 1 },
            { q: "পশ্চিমবঙ্গের রাজ্য পশুর নাম কী?", o: ["রয়্যাল বেঙ্গল টাইগার", "মেছো বিড়াল", "হাতি", "হরিণ"], a: 1, level: 1 },
            { q: "সূর্য কোন দিকে ওঠে?", o: ["পশ্চিম", "উত্তর", "দক্ষিণ", "পূর্ব"], a: 3, level: 1 },
            { q: "আমাদের জাতীয় সংগীত 'জন গণ মন' কার লেখা?", o: ["রবীন্দ্রনাথ ঠাকুর", "কাজী নজরুল ইসলাম", "বঙ্কিমচন্দ্র চট্টোপাধ্যায়", "শরৎচন্দ্র চট্টোপাধ্যায়"], a: 0, level: 1 },
            { q: "ভারতের জাতীয় ফল কোনটি?", o: ["আপেল", "কাঁঠাল", "আম", "কলা"], a: 2, level: 1 },
            { q: "কোন গ্রহকে 'লাল গ্রহ' বলা হয়?", o: ["বুধ", "মঙ্গল", "শুক্র", "বৃহস্পতি"], a: 1, level: 1 },
            { q: "বছরের কোন মাসটি সাধারণত ২৮ দিনের হয়?", o: ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল"], a: 1, level: 1 },
            { q: "একটি ক্রিকেট ম্যাচে প্রতি দলে কতজন খেলোয়াড় থাকে?", o: ["৯ জন", "১০ জন", "১১ জন", "১২ জন"], a: 2, level: 1 },
            { q: "কোন প্রাণীকে 'মরুভূমির জাহাজ' বলা হয়?", o: ["উট", "ঘোড়া", "গাধা", "হাতি"], a: 0, level: 1 },
            { q: "ইংরেজি বর্ণমালায় মোট কয়টি স্বরবর্ণ (Vowel) আছে?", o: ["৫টি", "৪টি", "৬টি", "৭টি"], a: 0, level: 1 },
            { q: "তাজমহল ভারতের কোন শহরে অবস্থিত?", o: ["দিল্লি", "আগরা", "জয়পুর", "লখনউ"], a: 1, level: 1 },
            { q: "পৃথিবীর সবচেয়ে বড় মহাসাগর কোনটি?", o: ["ভারত মহাসাগর", "আটলান্টিক মহাসাগর", "প্রশান্ত মহাসাগর", "সুমেরu মহাসাগর"], a: 2, level: 1 },
            { q: "কোন উৎসবকে 'আলোর উৎসব' বলা হয়?", o: ["হোলি", "দুর্গাপুজো", "দীপাবলি", "ঈদ"], a: 2, level: 1 },
            { q: "ল্যাপটপ বা কম্পিউটার স্ক্রিনে দেখার জন্য কোন ইনপুট ডিভাইস ব্যবহার করা হয়?", o: ["মাউস", "কিবোর্ড", "মনিটর", "প্রিন্টার"], a: 0, level: 1 },
            { q: "কলকাতা কোন নদীর তীরে অবস্থিত?", o: ["গঙ্গা", "যমুনা", "হুগলি", "পদ্মা"], a: 2, level: 1 },
            { q: "ডাক্তাররা নাড়ি (Pulse) দেখে মানুষের কী পরীক্ষা করেন?", o: ["রক্তের পরিমাণ", "হৃদস্পন্দনের গতি", "শরীরের ওজন", "চোখের দৃষ্টি"], a: 1, level: 1 },
            { q: "মহাকাব্য 'রামায়ণ' অনুযায়ী শ্রী রামচন্দ্রের স্ত্রীর নাম কী?", o: ["সীতা", "রাধা", "দ্রৌপদী", "কুন্তী"], a: 0, level: 1 },
            { q: "দাবা খেলায় বোর্ডের ওপর মোট কতগুলি ঘর থাকে?", o: ["৫০টি", "৬৪টি", "৬০টি", "৭০টি"], a: 1, level: 1 },
            { q: "কোন রঙের ট্রাফিক লাইট দেখলে গাড়ি থামাতে হয়?", o: ["সবুজ", "হলুদ", "নীল", "লাল"], a: 3, level: 1 },
            { q: "মানুষের মুখের ভেতর মোট কত ধরনের দাঁত থাকে?", o: ["২ ধরনের", "৩ ধরনের", "৪ ধরনের", "৫ ধরনের"], a: 2, level: 1 },
            { q: "আমাদের সৌরজগতের সবচেয়ে বড় গ্রহ কোনটি?", o: ["পৃথিবী", "মঙ্গল", "বৃহস্পতি", "শনি"], a: 2, level: 1 },
            { q: "পাহাড়ি এলাকায় যাতায়াতের জন্য প্রধানত কোন পশুর সাহায্য নেওয়া হয়?", o: ["উট", "খচ্চর বা ঘোড়া", "হাতি", "মহিষ"], a: 1, level: 1 },
            { q: "মোবাইল ফোনে সিম কার্ডের 'SIM' এর পুরো নাম কী?", o: ["Subscriber Identity Module", "System Instant Message", "Secure Internet Medium", "Subscriber International Mobile"], a: 0, level: 1 },
            { q: "কোন পাখির ডিম পৃথিবীর মধ্যে সবচেয়ে বড় হয়?", o: ["ময়ূর", "উটপাখি", "ঈগল", "পেনগুইন"], a: 1, level: 1 },
            { q: "ভারতের স্বাধীনতা দিবস কোন তারিখে পালিত হয়?", o: ["২৬শে জানুয়ারি", "১৫ই আগস্ট", "২রা অক্টোবর", "১৪ই নভেম্বর"], a: 1, level: 1 },
            { q: "রামধনু বা রংধনুতে মোট কয়টি রঙ থাকে?", o: ["৫টি", "৬টি", "৭টি", "৮টি"], a: 2, level: 1 },
            { q: "কোন পতঙ্গ কামড়ালে ডেঙ্গু রোগ হতে পারে?", o: ["অ্যানোফিলিস মশা", "এডিস মশা", "কিউলেক্স msha", "মাছি"], a: 1, level: 1 },
            { q: "ফেসবুক (Facebook) এর প্রতিষ্ঠাতা কে?", o: ["বিল গেটস", "মার্ক জুকারবার্গ", "স্টিভ জবস", "এলন মাস্ক"], a: 1, level: 1 },
            { q: "কোন ফলকে 'ফলের রাজা' বলা হয়?", o: ["আপেল", "লিচু", "আম", "আঙুর"], a: 2, level: 1 },
            { q: "ভারতের জাতীয় পশু কোনটি?", o: ["সিংহ", "রয়্যাল বেঙ্গল টাইগার", "চিতাবাঘ", "হাতি"], a: 1, level: 1 },
            { q: "পৃথিবীর সবচেয়ে উঁচু পর্বতশৃঙ্গ কোনটি?", o: ["কাঞ্চনজঙ্ঘা", "গডউইন অস্টিন", "মাউন্ট এভারেস্ট", "নন্দাদেবী"], a: 2, level: 1 },
            { q: "ভারতের নোট বাতিলের ঐতিহাসিক ঘটনা (Demonetization) কোন সালে ঘটেছিল?", o: ["২০১৪", "২০১৫", "২০১৬", "২০১৭"], a: 2, level: 1 },
            { q: "কলকাতার বিখ্যাত 'হাওড়া ব্রিজ' এর আনুষ্ঠানিক নাম কী?", o: ["বিদ্যাসাগর সেতু", "রবীন্দ্র সেতু", "বিবেকানন্দ সেতু", "নজরুল সেতু"], a: 1, level: 1 },
            { q: "কোন ভিটামিনের অভাবে মানুষের রাতকানা রোগ হয়?", o: ["ভিটামিন B", "ভিটামিন C", "ভিটামিন A", "ভিটামিন D"], a: 2, level: 1 },
            { q: "স্বাধীন ভারতের প্রথম প্রধানমন্ত্রী কে ছিলেন?", o: ["মহাত্মা গান্ধী", "জওহরলাল নেহরু", "ড. রাজেন্দ্র প্রসাদ", "সর্দার বল্লভভাই প্যাটেল"], a: 1, level: 1 },

        const PRIZE_LADDER = Array.from({length: 30}, (_, i) => `₹${(i + 1) * 10000}`);
        PRIZE_LADDER[29] = "₹৭ কোটি";
        
        // --- SAFE ZONES INDICES ---
        const SAFE_ZONES = [4, 14, 24]; // Questions 5, 15, 25

        const QUESTION_TIME = 25;
        let sessionQuestions = [];
        let curRound = 0;
        let timerVal = QUESTION_TIME;
        let timerInterval = null;
        let lifelinesUsed = { '5050': false, 'poll': false, 'call': false, 'flip': false };

        function shuffleBank(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function showRules() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('rules-screen').classList.remove('hidden');
        }

        function updateHostMessage(msg) {
            document.getElementById('host-box').innerText = msg;
        }

        function updateTension() {
            const fill = document.getElementById('tension-fill');
            const percentage = Math.min((curRound + 1) * 3.3, 100);
            fill.style.width = percentage + "%";
        }

        function startGame() {
            const fullShuffled = shuffleBank([...QUESTION_BANK]);
            sessionQuestions = fullShuffled.slice(0, 30);
            
            document.getElementById('rules-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('bgm').play();
            
            renderTree();
            nextQuestion();
        }

        function renderTree() {
            const tree = document.getElementById('money-tree');
            tree.innerHTML = '';
            PRIZE_LADDER.forEach((amt, i) => {
                const div = document.createElement('div');
                // Added milestone logic to UI
                let classList = `lvl ${i === curRound ? 'active' : ''}`;
                if (SAFE_ZONES.includes(i)) classList += ' milestone';
                
                div.className = classList;
                div.innerText = `${i + 1} ⬥ ${amt}`;
                tree.appendChild(div);
            });
            const activeLvl = tree.querySelector('.active');
            if(activeLvl) activeLvl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function nextQuestion() {
            if (curRound >= 30) {
                triggerGameOver("বিজয়ী!", "আপনি ৭ কোটি টাকা জিতেছেন!");
                return;
            }
            
            updateTension();
            const qData = sessionQuestions[curRound];
            document.getElementById('q-text').innerText = qData.q;
            
            // Presenter dialogue update
            if (curRound === 0) updateHostMessage("প্রথম প্রশ্নের জন্য তৈরি হন...");
            else if (SAFE_ZONES.includes(curRound)) updateHostMessage("এটি একটি গুরুত্বপূর্ণ মাইলস্টোন প্রশ্ন!");
            else updateHostMessage("প্রশ্নটি ভালো করে ভেবে দেখুন...");

            for (let i = 0; i < 4; i++) {
                const opt = document.getElementById(`opt-${i}`);
                opt.innerHTML = `<span>${String.fromCharCode(65+i)}:</span> ${qData.o[i]}`;
                opt.className = 'option';
                opt.style.visibility = 'visible';
            }
            
            renderTree();
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerVal = QUESTION_TIME;
            document.getElementById('timer').innerText = timerVal;
            
            timerInterval = setInterval(() => {
                timerVal--;
                document.getElementById('timer').innerText = timerVal;
                document.getElementById('snd-tick').play();
                
                if (timerVal < 10) {
                    updateHostMessage("সময় হাত থেকে পেরিয়ে যাচ্ছে, দ্রুত উত্তর দিন!");
                }
                
                if (timerVal <= 0) {
                    clearInterval(timerInterval);
                    triggerGameOver("সময় শেষ!", "আপনি সময়মতো উত্তর দিতে পারেননি।");
                }
            }, 1000);
        }

        /* [MODIFIED: checkAnswer to include Host logic and Suspend] */
        function checkAnswer(idx) {
            clearInterval(timerInterval);
            const qData = sessionQuestions[curRound];
            const btn = document.getElementById(`opt-${idx}`);
            
            updateHostMessage("আপনি কি নিশ্চিত? লক করছি আপনার উত্তর...");
            btn.classList.add('blinking');
            
            setTimeout(() => {
                btn.classList.remove('blinking');
                if (idx === qData.a) {
                    btn.classList.add('correct');
                    document.getElementById('snd-correct').play();
                    updateHostMessage("অসাধারণ! একদম সঠিক উত্তর!");
                    setTimeout(() => {
                        curRound++;
                        nextQuestion();
                    }, 1500);
                } else {
                    btn.classList.add('wrong');
                    document.getElementById(`opt-${qData.a}`).classList.add('correct');
                    document.getElementById('snd-wrong').play();
                    updateHostMessage("উফ! ভুল উত্তর। খেলা এখানেই শেষ।");
                    setTimeout(() => triggerGameOver("ভুল উত্তর!", "খেলা এখানেই শেষ।"), 2000);
                }
            }, 2500); 
        }

        /* [MODIFIED: triggerGameOver with Safe Zone Logic] */
        function triggerGameOver(title, sub) {
            clearInterval(timerInterval);
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('game-over').classList.remove('hidden');
            document.getElementById('over-msg').innerText = title;

            // Logic: Determine Safe Zone amount
            let finalPrizeValue = "₹০";
            if (curRound >= 25) {
                finalPrizeValue = PRIZE_LADDER[24]; // Safe at Q25
            } else if (curRound >= 15) {
                finalPrizeValue = PRIZE_LADDER[14]; // Safe at Q15
            } else if (curRound >= 5) {
                finalPrizeValue = PRIZE_LADDER[4];  // Safe at Q5
            }
            
            // Special Case: If they won everything
            if (curRound === 30) finalPrizeValue = PRIZE_LADDER[29];

            document.getElementById('final-prize').innerText = `${sub}\nআপনার নিশ্চিত জয়: ${finalPrizeValue}`;
        }

        function useLifeline(type) {
            if (lifelinesUsed[type]) return;
            lifelinesUsed[type] = true;
            document.getElementById(`ll-${type}`).classList.add('used');
            
            const qData = sessionQuestions[curRound];
            
            if (type === '5050') {
                updateHostMessage("৫০:৫০ ব্যবহার করা হলো। দুটি ভুল উত্তর সরিয়ে দিচ্ছি...");
                let indices = [0,1,2,3].filter(i => i !== qData.a).sort(() => Math.random() - 0.5);
                document.getElementById(`opt-${indices[0]}`).style.visibility = 'hidden';
                document.getElementById(`opt-${indices[1]}`).style.visibility = 'hidden';
            } else if (type === 'flip') {
                updateHostMessage("প্রশ্নটি বদলে দেওয়া হচ্ছে...");
                const newQ = QUESTION_BANK[Math.floor(Math.random() * QUESTION_BANK.length)];
                sessionQuestions[curRound] = newQ;
                nextQuestion();
            } else {
                updateHostMessage("বিশেষজ্ঞ বন্ধুদের ওপর ভরসা রাখা যাক...");
                alert("বিশেষজ্ঞের মতে সঠিক উত্তর হতে পারে: " + String.fromCharCode(65 + qData.a));
            }
        }
    </script>
