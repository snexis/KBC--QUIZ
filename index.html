        /** AUDIO ENGINE (Web Audio API - No external files needed) **/
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let suspenseOsc = null;
        let tickingInterval = null;

        function playTone(freq, type, duration, vol = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function startSuspenseMusic() {
            if (suspenseOsc) return;
            suspenseOsc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            suspenseOsc.type = 'sawtooth';
            suspenseOsc.frequency.setValueAtTime(55, audioCtx.currentTime); // Low G
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            const lfo = audioCtx.createOscillator();
            lfo.frequency.setValueAtTime(0.5, audioCtx.currentTime);
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.setValueAtTime(10, audioCtx.currentTime);
            lfo.connect(lfoGain);
            lfoGain.connect(suspenseOsc.frequency);
            suspenseOsc.connect(gain);
            gain.connect(audioCtx.destination);
            lfo.start();
            suspenseOsc.start();
        }

        function stopSuspenseMusic() {
            if (suspenseOsc) {
                suspenseOsc.stop();
                suspenseOsc = null;
            }
        }

            moneyLadder.forEach((m, i) => {
                const div = document.createElement('div');
                div.className = `p-1 px-4 rounded ${i === currentLevel ? 'ladder-active' : 'text-gray-400'}`;
                div.innerHTML = `<span class="mr-4">${i+1}</span> ${m}`;
                ladderD.appendChild(div);
            });
            document.getElementById('mobile-prize').innerText = currentLevel > 0 ? moneyLadder[currentLevel-1] : "₹ ০";
        }

        function loadQuestion() {
            canClick = true;
            const qData = activeQuestions[currentLevel];
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('current-q-num').innerText = currentLevel + 1;
            
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';
            
            ['a', 'b', 'c', 'd'].forEach((letter, i) => {
                const btn = document.createElement('button');
                btn.id = `opt-${i}`;
                btn.className = 'kbc-button p-4 rounded-lg border-2 border-blue-500 text-left flex items-center hover:bg-blue-800 transition';
                btn.innerHTML = `<span class="text-yellow-500 font-bold mr-4">${letter.toUpperCase()}:</span> <span>${qData[letter]}</span>`;
                btn.onclick = () => selectAnswer(i);
                optionsGrid.appendChild(btn);
            });

            resetTimer();
        }

        function resetTimer() {
            clearInterval(tickingInterval);
            timer = 60;
            updateTimerUI();
            timerRunning = true;
            tickingInterval = setInterval(() => {
                if(timer > 0) {
                    timer--;
                    updateTimerUI();
                    if(timer <= 7) playTone(880, 'sine', 0.1, 0.2); // Urgent beep
                    else playTone(440, 'sine', 0.05, 0.05); // Normal tick
                } else {
                    gameOver("সময় শেষ!");
                }
            }, 1000);
        }

        function updateTimerUI() {
            const bar = document.getElementById('timer-bar');
            const text = document.getElementById('timer-text');
            text.innerText = timer;
            const offset = 251 - (251 * timer / 60);
            bar.style.strokeDashoffset = offset;
            bar.style.stroke = timer <= 7 ? '#ef4444' : '#eab308';
        }

        function selectAnswer(index) {
            if(!canClick) return;
            canClick = false;
            timerRunning = false;
            clearInterval(tickingInterval);

            const btn = document.getElementById(`opt-${index}`);
            btn.classList.add('selected-glow');
            playTone(330, 'square', 0.5, 0.1);

            setTimeout(() => {
                const correct = activeQuestions[currentLevel].ans;
                btn.classList.remove('selected-glow');

                if(index === correct) {
                    btn.classList.add('correct-flash');
                    playTone(880, 'triangle', 0.3, 0.2);
                    setTimeout(() => {
                        if(currentLevel === 18) {
                            victory();
                        } else {
                            currentLevel++;
                            renderLadder();
                            loadQuestion();
                        }
                    }, 2000);
                } else {
                    btn.classList.add('wrong-flash');
                    document.getElementById(`opt-${correct}`).classList.add('correct-flash');
                    playTone(110, 'sawtooth', 0.8, 0.3);
                    setTimeout(() => gameOver("ভুল উত্তর!"), 2000);
                }
            }, 3000);
        }

        function gameOver(status) {
            stopSuspenseMusic();
            playTone(50, 'sawtooth', 1.5, 0.5);
            document.getElementById('game-screen').style.setProperty('display', 'none', 'important');
            document.getElementById('result-screen').style.setProperty('display', 'flex', 'important');
            
            let safePrize = "₹ ০";
            if(currentLevel >= 10) safePrize = "₹ ৩,২০,০০০";
            else if(currentLevel >= 5) safePrize = "₹ ১০,০০০";

            document.getElementById('result-status').innerText = status;
            document.getElementById('final-prize').innerText = safePrize;
            document.getElementById('correct-answer-was').innerText = "সঠিক উত্তর: " + getAnswerText();
            document.getElementById('fact-text').innerText = activeQuestions[currentLevel].fact;
        }

        function victory() {
            stopSuspenseMusic();
            document.getElementById('game-screen').style.setProperty('display', 'none', 'important');
            document.getElementById('result-screen').style.setProperty('display', 'flex', 'important');
            document.getElementById('result-status').innerText = "অভিনন্দন! আপনি জয়ী!";
            document.getElementById('result-status').classList.replace('text-red-500', 'text-yellow-500');
            document.getElementById('final-prize').innerText = "₹ ৭ কোটি";
        }

        function getAnswerText() {
            const q = activeQuestions[currentLevel];
            const letters = ['a', 'b', 'c', 'd'];
            return q[letters[q.ans]];
        }

        /** LIFELINES **/
        function use5050() {
            if(!lifelines.fifty || !canClick) return;
            lifelines.fifty = false;
            document.getElementById('life-50').style.opacity = '0.2';
            const correct = activeQuestions[currentLevel].ans;
            let hidden = 0;
            [0,1,2,3].forEach(i => {
                if(i !== correct && hidden < 2) {
                    document.getElementById(`opt-${i}`).style.visibility = 'hidden';
                    hidden++;
                }
            });
        }

        function usePoll() {
            if(!lifelines.poll || !canClick) return;
            lifelines.poll = false;
            document.getElementById('life-poll').style.opacity = '0.2';
            const correct = activeQuestions[currentLevel].ans;
            const bars = document.getElementById('poll-bars');
            bars.innerHTML = '';
            
            let vals = [10, 10, 10, 10];
            vals[correct] = 70;
            
            ['A','B','C','D'].forEach((l, i) => {
                bars.innerHTML += `
                    <div class="flex items-center gap-4">
                        <span class="w-4 font-bold">${l}</span>
                        <div class="flex-1 bg-gray-700 h-4 rounded-full overflow-hidden">
                            <div class="bg-yellow-500 h-full" style="width: ${vals[i]}%"></div>
                        </div>
                        <span class="text-xs">${vals[i]}%</span>
                    </div>
                `;
            });
            document.getElementById('poll-modal').classList.remove('hidden');
        }

        function closePoll() { document.getElementById('poll-modal').classList.add('hidden'); }

        function usePhone() {
            if(!lifelines.phone || !canClick) return;
            lifelines.phone = false;
            document.getElementById('life-phone').style.opacity = '0.2';
            const ans = ['A','B','C','D'][activeQuestions[currentLevel].ans];
            alert(`আপনার বন্ধু বলছে: "আমার মনে হয় সঠিক উত্তরটি হলো ${ans}!"`);
        }

        function quitGame() {
            const prize = currentLevel > 0 ? moneyLadder[currentLevel-1] : "₹ ০";
            gameOver("আপনি খেলা ছেড়ে দিয়েছেন");
            document.getElementById('final-prize').innerText = prize;
        }

        function resetGame() {
            currentLevel = 0;
            lifelines = { fifty: true, poll: true, phone: true };
            document.getElementById('life-50').style.opacity = '1';
            document.getElementById('life-poll').style.opacity = '1';
            document.getElementById('life-phone').style.opacity = '1';
            document.getElementById('result-screen').style.setProperty('display', 'none', 'important');
            document.getElementById('welcome-screen').style.setProperty('display', 'block', 'important');
        }
    </script>
</body>
</html>
