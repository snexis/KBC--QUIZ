<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KBC Bengali - Ultimate Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --space-black: #050515;
            --neon-blue: #00d2ff;
            --gold: #ffd700;
            --correct-green: #2ecc71;
            --wrong-red: #e74c3c;
            --text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
        }

        /* --- BASIC RESET & PREVENT SELECTION --- */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; 
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: #1a1a2e;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- CINEMATIC BLACKOUT EFFECT --- */
        body.game-active {
            background: radial-gradient(circle, #0a0a2e 0%, var(--space-black) 100%) !important;
        }

        .hidden { display: none !important; }

        /* --- SPOTLIGHT UI --- */
        .glass-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 25px;
            padding: 40px;
            backdrop-filter: blur(15px);
            width: 95%;
            max-width: 1000px;
            text-align: center;
        }

        .spotlight-q {
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            background: rgba(0, 0, 0, 0.7);
            padding: 25px;
            font-size: 1.6rem;
            margin-bottom: 25px;
            border-radius: 15px;
            font-weight: 700;
            text-shadow: var(--text-shadow);
        }

        .option {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-blue);
            padding: 15px 20px;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
            margin: 10px 0;
            display: flex;
            align-items: center;
        }
        .option:hover { border-color: white; box-shadow: 0 0 15px var(--neon-blue); }
        .option span { color: var(--gold); font-weight: 900; margin-right: 15px; font-size: 1.4rem; }

        /* --- TIMER ANIMATIONS --- */
        .timer-circle {
            width: 70px; height: 70px; border-radius: 50%;
            border: 4px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; font-weight: 900;
            margin: 0 auto 20px;
            background: #000;
        }

        .timer-urgent {
            color: var(--wrong-red);
            border-color: var(--wrong-red);
            animation: shake 0.1s infinite, flashRed 0.5s infinite alternate;
        }

        @keyframes shake { 0% {transform: translate(1px, 1px);} 50% {transform: translate(-1px, -1px);} 100% {transform: translate(1px, -1px);} }
        @keyframes flashRed { from { box-shadow: 0 0 5px var(--wrong-red); } to { box-shadow: 0 0 25px var(--wrong-red); } }

        /* --- WALLET FORM --- */
        .wallet-input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: rgba(255,255,255,0.1); border: 1px solid var(--gold);
            color: white; border-radius: 8px; font-size: 1rem;
        }
        .btn-claim {
            background: linear-gradient(180deg, var(--gold), #b8860b);
            color: black; font-weight: 700; border: none; padding: 15px 30px;
            border-radius: 50px; cursor: pointer; width: 100%; margin-top: 20px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- SCREEN 1: LOGIN -->
    <div id="screen-login" class="glass-container">
        <h1 style="color:var(--gold); font-size: 2.5rem; margin-bottom: 10px;">KBC BENGALI</h1>
        <p>আপনার মোবাইল নম্বর এবং মাস্টার কোড লিখুন</p>
        <div style="max-width: 350px; margin: 25px auto;">
            <input type="text" id="user-mobile" class="wallet-input" placeholder="মোবাইল নম্বর (১০ সংখ্যা)" maxlength="10">
            <input type="text" id="user-master" class="wallet-input" placeholder="মাস্টার কোড (ঐচ্ছিক)">
            <button class="btn-claim" onclick="handleLogin()">শুরু করুন</button>
        </div>
    </div>

    <!-- SCREEN 2: GAME AREA -->
    <div id="screen-game" class="hidden" style="width: 100%; text-align: center;">
        <div id="timer-box" class="timer-circle">25</div>
        <div class="glass-container" style="margin: 0 auto;">
            <div id="q-text" class="spotlight-q">Loading...</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="option" onclick="submitAnswer(0)"><span>A</span> <div id="opt-0"></div></div>
                <div class="option" onclick="submitAnswer(1)"><span>B</span> <div id="opt-1"></div></div>
                <div class="option" onclick="submitAnswer(2)"><span>C</span> <div id="opt-2"></div></div>
                <div class="option" onclick="submitAnswer(3)"><span>D</span> <div id="opt-3"></div></div>
            </div>
            <div id="milestone-msg" style="margin-top: 20px; color: var(--gold); font-weight: 600;">রাউন্ড: ১ | লক্ষ্য: ৳১০০০</div>
        </div>
    </div>

    <!-- SCREEN 3: WALLET -->
    <div id="screen-wallet" class="glass-container hidden">
        <h2 id="final-status" style="color:var(--gold);">খেলা শেষ!</h2>
        <p style="font-size: 1.4rem; margin: 15px 0;">আপনার মোট আয়: <span id="earned-amt" style="color:var(--correct-green);">৳০</span></p>
        <div style="max-width: 400px; margin: 0 auto; text-align: left;">
            <label>টাকা পাওয়ার মাধ্যম:</label>
            <select id="pay-method" class="wallet-input">
                <option value="UPI">UPI (GPay/PhonePe)</option>
                <option value="BANK">Bank Account</option>
            </select>
            <input type="text" id="pay-details" class="wallet-input" placeholder="UPI ID বা অ্যাকাউন্ট নম্বর দিন">
            <button class="btn-claim" onclick="processWithdrawal()">টাকা উত্তোলনের আবেদন করুন</button>
        </div>
    </div>

    <script>
        /* --- CONFIGURATION & SECURITY PARAMS --- */
        const ENTRY_FEE = 10;
        const SECRET_MASTER_CODE = "TEST2026";
        const MILESTONE_ROUND = 5; // Safe Zone
        const PRIZE_LIST = [1000, 2000, 3000, 5000, 10000, 20000, 40000, 80000, 160000, 320000, 640000, 1250000, 2500000, 5000000, 10000000, 70000000];

        /* --- QUESTION DATABASE (PLACEHOLDER) --- */
        const questionBank = [
            /* KEEP MY EXACT 200 QUESTIONS HERE UNCHANGED */
            /* Ensure each object has { q: "", o: ["","","",""], a: index, level: 1/2/3 } */
              { q: "ভারতের রাজধানী কোনটি?", o: ["কলকাতা", "নয়াদিল্লি", "মুম্বই", "চেন্নাই"], a: 1, level: 1 },
            { q: "পশ্চিমবঙ্গের রাজ্য পশুর নাম কী?", o: ["রয়্যাল বেঙ্গল টাইগার", "মেছো বিড়াল", "হাতি", "হরিণ"], a: 1, level: 1 },
            { q: "সূর্য কোন দিকে ওঠে?", o: ["পশ্চিম", "উত্তর", "দক্ষিণ", "পূর্ব"], a: 3, level: 1 },
            { q: "আমাদের জাতীয় সংগীত 'জন গণ মন' কার লেখা?", o: ["রবীন্দ্রনাথ ঠাকুর", "কাজী নজরুল ইসলাম", "বঙ্কিমচন্দ্র চট্টোপাধ্যায়", "শরৎচন্দ্র চট্টোপাধ্যায়"], a: 0, level: 1 },
            { q: "ভারতের জাতীয় ফল কোনটি?", o: ["আপেল", "কাঁঠাল", "আম", "কলা"], a: 2, level: 1 },
            { q: "কোন গ্রহকে 'লাল গ্রহ' বলা হয়?", o: ["বুধ", "মঙ্গল", "শুক্র", "বৃহস্পতি"], a: 1, level: 1 },
            { q: "বছরের কোন মাসটি সাধারণত ২৮ দিনের হয়?", o: ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল"], a: 1, level: 1 },
            { q: "একটি ক্রিকেট ম্যাচে প্রতি দলে কতজন খেলোয়াড় থাকে?", o: ["৯ জন", "১০ জন", "১১ জন", "১২ জন"], a: 2, level: 1 },
            { q: "কোন প্রাণীকে 'মরুভূমির জাহাজ' বলা হয়?", o: ["উট", "ঘোড়া", "গাধা", "হাতি"], a: 0, level: 1 },
            { q: "ইংরেজি বর্ণমালায় মোট কয়টি স্বরবর্ণ (Vowel) আছে?", o: ["৫টি", "৪টি", "৬টি", "৭টি"], a: 0, level: 1 },
            { q: "তাজমহল ভারতের কোন শহরে অবস্থিত?", o: ["দিল্লি", "আগরা", "জয়পুর", "লখনউ"], a: 1, level: 1 },
            { q: "পৃথিবীর সবচেয়ে বড় মহাসাগর কোনটি?", o: ["ভারত মহাসাগর", "আটলান্টিক মহাসাগর", "প্রশান্ত মহাসাগর", "সুমেরu মহাসাগর"], a: 2, level: 1 },
            { q: "কোন উৎসবকে 'আলোর উৎসব' বলা হয়?", o: ["হোলি", "দুর্গাপুজো", "দীপাবলি", "ঈদ"], a: 2, level: 1 },
            { q: "ল্যাপটপ বা কম্পিউটার স্ক্রিনে দেখার জন্য কোন ইনপুট ডিভাইস ব্যবহার করা হয়?", o: ["মাউস", "কিবোর্ড", "মনিটর", "প্রিন্টার"], a: 0, level: 1 },
            { q: "কলকাতা কোন নদীর তীরে অবস্থিত?", o: ["গঙ্গা", "যমুনা", "হুগলি", "পদ্মা"], a: 2, level: 1 },
            { q: "ডাক্তাররা নাড়ি (Pulse) দেখে মানুষের কী পরীক্ষা করেন?", o: ["রক্তের পরিমাণ", "হৃদস্পন্দনের গতি", "শরীরের ওজন", "চোখের দৃষ্টি"], a: 1, level: 1 },
            { q: "মহাকাব্য 'রামায়ণ' অনুযায়ী শ্রী রামচন্দ্রের স্ত্রীর নাম কী?", o: ["সীতা", "রাধা", "দ্রৌপদী", "কুন্তী"], a: 0, level: 1 },
            { q: "দাবা খেলায় বোর্ডের ওপর মোট কতগুলি ঘর থাকে?", o: ["৫০টি", "৬৪টি", "৬০টি", "৭০টি"], a: 1, level: 1 },
            { q: "কোন রঙের ট্রাফিক লাইট দেখলে গাড়ি থামাতে হয়?", o: ["সবুজ", "হলুদ", "নীল", "লাল"], a: 3, level: 1 },
            { q: "মানুষের মুখের ভেতর মোট কত ধরনের দাঁত থাকে?", o: ["২ ধরনের", "৩ ধরনের", "৪ ধরনের", "৫ ধরনের"], a: 2, level: 1 },
            { q: "আমাদের সৌরজগতের সবচেয়ে বড় গ্রহ কোনটি?", o: ["পৃথিবী", "মঙ্গল", "বৃহস্পতি", "শনি"], a: 2, level: 1 },
            { q: "পাহাড়ি এলাকায় যাতায়াতের জন্য প্রধানত কোন পশুর সাহায্য নেওয়া হয়?", o: ["উট", "খচ্চর বা ঘোড়া", "হাতি", "মহিষ"], a: 1, level: 1 },
            { q: "মোবাইল ফোনে সিম কার্ডের 'SIM' এর পুরো নাম কী?", o: ["Subscriber Identity Module", "System Instant Message", "Secure Internet Medium", "Subscriber International Mobile"], a: 0, level: 1 },
            { q: "কোন পাখির ডিম পৃথিবীর মধ্যে সবচেয়ে বড় হয়?", o: ["ময়ূর", "উটপাখি", "ঈগল", "পেনগুইন"], a: 1, level: 1 },
            { q: "ভারতের স্বাধীনতা দিবস কোন তারিখে পালিত হয়?", o: ["২৬শে জানুয়ারি", "১৫ই আগস্ট", "২রা অক্টোবর", "১৪ই নভেম্বর"], a: 1, level: 1 },
            { q: "রামধনু বা রংধনুতে মোট কয়টি রঙ থাকে?", o: ["৫টি", "৬টি", "৭টি", "৮টি"], a: 2, level: 1 },
            { q: "কোন পতঙ্গ কামড়ালে ডেঙ্গু রোগ হতে পারে?", o: ["অ্যানোফিলিস মশা", "এডিস মশা", "কিউলেক্স msha", "মাছি"], a: 1, level: 1 },
            { q: "ফেসবুক (Facebook) এর প্রতিষ্ঠাতা কে?", o: ["বিল গেটস", "মার্ক জুকারবার্গ", "স্টিভ জবস", "এলন মাস্ক"], a: 1, level: 1 },
            { q: "কোন ফলকে 'ফলের রাজা' বলা হয়?", o: ["আপেল", "লিচু", "আম", "আঙুর"], a: 2, level: 1 },
            { q: "ভারতের জাতীয় পশু কোনটি?", o: ["সিংহ", "রয়্যাল বেঙ্গল টাইগার", "চিতাবাঘ", "হাতি"], a: 1, level: 1 },
            { q: "পৃথিবীর সবচেয়ে উঁচু পর্বতশৃঙ্গ কোনটি?", o: ["কাঞ্চনজঙ্ঘা", "গডউইন অস্টিন", "মাউন্ট এভারেস্ট", "নন্দাদেবী"], a: 2, level: 1 },
            { q: "ভারতের নোট বাতিলের ঐতিহাসিক ঘটনা (Demonetization) কোন সালে ঘটেছিল?", o: ["২০১৪", "২০১৫", "২০১৬", "২০১৭"], a: 2, level: 1 },
            { q: "কলকাতার বিখ্যাত 'হাওড়া ব্রিজ' এর আনুষ্ঠানিক নাম কী?", o: ["বিদ্যাসাগর সেতু", "রবীন্দ্র সেতু", "বিবেকানন্দ সেতু", "নজরুল সেতু"], a: 1, level: 1 },
            { q: "কোন ভিটামিনের অভাবে মানুষের রাতকানা রোগ হয়?", o: ["ভিটামিন B", "ভিটামিন C", "ভিটামিন A", "ভিটামিন D"], a: 2, level: 1 },
            { q: "স্বাধীন ভারতের প্রথম প্রধানমন্ত্রী কে ছিলেন?", o: ["মহাত্মা গান্ধী", "জওহরলাল নেহরু", "ড. রাজেন্দ্র প্রসাদ", "সর্দার বল্লভভাই প্যাটেল"], a: 1, level: 1 },
            { q: "টেলিফোন কে আবিষ্কার করেছিলেন?", o: ["টমাস আলভা এডিসন", "আলেকজান্ডার গ্রাহাম বেল", "আইজ্যাক নিউটন", "মারকনি"], a: 1, level: 1 },
            { q: "ভারতের কোন রাজ্যে সূর্য প্রথম উদিত হয়?", o: ["আসাম", "অরুণাচল প্রদেশ", "মেঘালয়", "নাগাল্যান্ড"], a: 1, level: 1 },
            { q: "লন্ডন শহরটি কোন নদীর তীরে অবস্থিত?", o: ["টেমস", "নীল নদ", "আমাজন", "ডানিউব"], a: 0, level: 2 },
            { q: "কোন বাঙালি বিজ্ঞানী জগদীশচন্দ্র বসুর সাথে কাজ করেছিলেন এবং সত্যেন বোস নামে পরিচিত?", o: ["সত্যেন্দ্রনাথ বসু", "প্রফুল্লচন্দ্র রায়", "মেঘনাদ সাহা", "উপেন্দ্রনাথ ব্রহ্মচারী"], a: 0, level: 2 },

            { q: "মহাত্মা গান্ধীকে প্রথম কে 'জাতির জনক' বা Father of the Nation বলে সম্বোর্ডন করেন?", o: ["রবীন্দ্রনাথ ঠাকুর", "সুভাষচন্দ্র বসু", "জওহরলাল নেহরু", "গোপালকৃষ্ণ গোখলে"], a: 1, level: 3 },
            { q: "বাংলা সাহিত্যের প্রথম আধুনিক উপন্যাস 'দুর্গেশনন্দিনী' কার লেখা?", o: ["বঙ্কিমচন্দ্র চট্টোপাধ্যায়", "রবীন্দ্রনাথ ঠাকুর", "শরৎচন্দ্র চট্টোপাধ্যায়", "ঈশ্বরচন্দ্র বিদ্যাসাগর"], a: 0, level: 2 },
            { q: "কোন নদীকে 'দক্ষিণ ভারতের গঙ্গা' বলা হয়?", o: ["কৃষ্ণা", "কাবেড়ী", "গোদাভরী", "নর্মদা"], a: 2, level: 3 },
            { q: "কোষের শক্তিঘর (Powerhouse of the Cell) কাকে বলা হয়?", o: ["নিউক্লিয়াস", "লাইসোজোম", "মাইটোকন্ড্রিয়া", "রাইবোজোম"], a: 2, level: 2 },
            { q: "ভারতের প্রথম রঙিন চলচ্চিত্র (Color Movie) কোনটি ছিল?", o: ["আলম আরা", "রাজা হরিশচন্দ্র", "কিসান কন্যা", "শোলে"], a: 2, level: 3 },
            { q: "বিশ্বের বৃহত্তম মরুভূমি কোনটি?", o: ["গোবি মরুভূমি", "সাহারা মরুভূমি", "থর মরুভূমি", "কালাহারি মরুভূমি"], a: 1, level: 2 },
            { q: "দিল্লির শেষ সুলতান কে ছিলেন?", o: ["বাহলোল লোদি", "সিকান্দার লোদি", "ইব্রাহিম লোদি", "বাবর"], a: 2, level: 3 },
            { q: "শব্দের গতিবেগ সবচেয়ে বেশি কোন মাধ্যমে হয়?", o: ["বায়ু", "জল", "কঠিন মাধ্যম (যেমন লোহা)", "শূন্যস্থান"], a: 2, level: 2 },
            { q: "ভারতের সংবিধানে মৌলিক অধিকারের ধারণা কোন দেশ থেকে নেওয়া হয়েছে?", o: ["যুক্তরাজ্য", "আমেরিকা (USA)", "সোভিয়েত ইউনিয়ন", "কানাডা"], a: 1, level: 3 },
            { q: "ভিটামিন C এর রাসায়নিক নাম কী?", o: ["রেটিনল", "অ্যাসকরবিক অ্যাসিড", "ক্যালসিফেরল", "টোকোফেরল"], a: 1, level: 2 },
            { q: "কোন গভর্নর জেনারেল ভারতে ইংরেজি শিক্ষাকে সরকারি মাধ্যম হিসেবে চালু করেন?", o: ["লর্ড ডালহৌসি", "লর্ড উইলিয়াম বেন্টিঙ্ক", "লর্ড কার্জন", "লর্ড ক্যানিং"], a: 1, level: 3 },
            { q: "আলোকবর্ষ (Light Year) দিয়ে কী মাপা হয়?", o: ["সময়", "দূরত্ব", "আলোর তীব্রতা", "গতিবেগ"], a: 1, level: 2 },
            { q: "বিশ্ব বাণিজ্য সংস্থা (WTO) এর সদর দপ্তর কোথায় অবস্থিত?", o: ["নিউ ইয়র্ক", "জেনেভা", "প্যারিস", "লন্ডন"], a: 1, level: 3 },
            { q: "ভারতের পঞ্চায়েতি রাজ ব্যবস্থার জনক কাকে বলা হয়?", o: ["বলবন্ত রাই মেহতা", "মহাত্মা গান্ধী", "জওহরলাল নেহরু", "অশোক মেহতা"], a: 0, level: 3 },
            { q: "সূর্যের আলো পৃথিবীতে পৌঁছাতে কত সময় লাগে?", o: ["প্রায় ৮ মিনিট ২০ সেকেন্ড", "প্রায় ৫ মিনিট", "প্রায় ১০ মিনিট", "প্রায় ২ মিনিট"], a: 0, level: 2 }
        ];

        /* --- GAME STATE --- */
        let currentRound = 0;
        let timerVal = 25;
        let timerInterval;
        let sessionQuestions = [];
        let lockedPrize = 0;

        /* --- ANTI-CHEAT & AI PROTECTION --- */
        // 1. Block F12, Ctrl+Shift+I, Ctrl+U
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };

        // 2. Page Visibility API (Detection for Tab Switching/ChatGPT usage)
        document.addEventListener("visibilitychange", function() {
            if (document.hidden && currentRound > 0) {
                terminateGame("নিরাপত্তা সতর্কতা: ট্যাব পরিবর্তন করার ফলে গেমটি বন্ধ করা হয়েছে।");
            }
        });

        /* --- CORE LOGIC --- */
        function handleLogin() {
            const mobile = document.getElementById('user-mobile').value;
            const master = document.getElementById('user-master').value;

            if (master === SECRET_MASTER_CODE) {
                startSequence(); return;
            }

            if (!/^\d{10}$/.test(mobile)) {
                alert("দয়া করে সঠিক ১০ সংখ্যার নম্বর দিন।"); return;
            }

            // Daily Lock Check
            const lastPlay = localStorage.getItem('kbc_last_play_' + mobile);
            const today = new Date().toDateString();
            if (lastPlay === today) {
                alert("দুঃখিত! আপনি দিনে মাত্র একবারই খেলতে পারবেন।"); return;
            }

            localStorage.setItem('kbc_last_play_' + mobile, today);
            startSequence();
        }

        function startSequence() {
            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            document.body.classList.add('game-active');

            // Difficulty Logic: Separate Pool
            const easy = questionBank.filter(q => q.level <= 2);
            const hard = questionBank.filter(q => q.level === 3);

            // Create 30 Question Session
            sessionQuestions = [...shuffle(easy).slice(0, 5), ...shuffle(hard).slice(0, 25)];
            loadQuestion();
        }

        function loadQuestion() {
            const q = sessionQuestions[currentRound];
            document.getElementById('q-text').innerText = q.q;
            for (let i = 0; i < 4; i++) {
                document.getElementById('opt-' + i).innerText = q.o[i];
            }

            // Adaptive Timer
            timerVal = (currentRound < 5) ? 25 : 15;
            document.getElementById('timer-box').innerText = timerVal;
            document.getElementById('timer-box').classList.remove('timer-urgent');

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timerVal--;
                document.getElementById('timer-box').innerText = timerVal;
                
                if (timerVal < 7) document.getElementById('timer-box').classList.add('timer-urgent');
                
                if (timerVal <= 0) {
                    clearInterval(timerInterval);
                    terminateGame("সময় শেষ হয়ে গেছে!");
                }
            }, 1000);

            document.getElementById('milestone-msg').innerText = `রাউন্ড: ${currentRound + 1} | লক্ষ্য: ৳${PRIZE_LIST[currentRound] || 'কোটিপতি'}`;
        }

        function submitAnswer(idx) {
            clearInterval(timerInterval);
            const correctIdx = sessionQuestions[currentRound].a;

            if (idx === correctIdx) {
                // Milestone Check (Safe Zone at Round 5)
                if (currentRound === 4) {
                    lockedPrize = PRIZE_LIST[4];
                    alert("অভিনন্দন! আপনি প্রথম মাইলস্টোন অতিক্রম করেছেন। আপনার ৳" + lockedPrize + " নিশ্চিত।");
                }
                
                currentRound++;
                if (currentRound >= 30) {
                    showWallet(PRIZE_LIST[29], "আপনি আজ কোটিপতি!");
                } else {
                    loadQuestion();
                }
            } else {
                terminateGame("ভুল উত্তর!");
            }
        }

        function terminateGame(msg) {
            clearInterval(timerInterval);
            alert(msg);
            showWallet(lockedPrize, "গেম ওভার!");
        }

        function showWallet(amt, status) {
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-wallet').classList.remove('hidden');
            document.getElementById('final-status').innerText = status;
            document.getElementById('earned-amt').innerText = "৳" + amt;
        }

        function processWithdrawal() {
            const details = document.getElementById('pay-details').value;
            if (details.length < 5) {
                alert("দয়া করে সঠিক পেমেন্ট তথ্য দিন।"); return;
            }
            alert("আপনার আবেদনটি সফল হয়েছে! আগামী ২৪ ঘণ্টার মধ্যে টাকা আপনার অ্যাকাউন্টে পৌঁছে যাবে।");
            location.reload();
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }
    </script>
