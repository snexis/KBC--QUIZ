<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>কে হবে কোটিপতি - KBC Bengali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: radial-gradient(circle, #1a1a40 0%, #050510 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            touch-action: manipulation;
        }
        .kbc-button {
            background: linear-gradient(to bottom, #2b2b6b, #12123a);
            border: 2px solid #cd9d23;
            transition: all 0.3s ease;
        }
        .kbc-button:hover {
            background: #cd9d23;
            color: #000;
        }
        .option-selected { background: #eab308 !important; color: black; animation: pulse 0.5s infinite; }
        .option-correct { background: #22c55e !important; color: white; }
        .option-wrong { background: #ef4444 !important; color: white; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .money-active { background: #cd9d23; color: black; font-weight: bold; border-radius: 4px; }
        .safe-zone { color: #facc15; }

        #game-screen, #result-screen { display: none; }
        
        /* Hide scrollbars */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col items-center justify-center">

    <!-- WELCOME SCREEN -->
    <div id="welcome-screen" class="flex flex-col items-center text-center p-6 w-full max-w-lg">
        <div class="w-48 h-48 bg-blue-900 rounded-full border-4 border-yellow-500 mb-8 flex items-center justify-center shadow-2xl">
            <h1 class="text-4xl font-bold text-yellow-500">KBC</h1>
        </div>
        <h2 class="text-3xl font-bold mb-4 italic">নমস্কার, আমি অমিতাভ বচ্চন বলছি...</h2>
        <p class="mb-8 text-gray-300">ভারতের সবচেয়ে জনপ্রিয় কুইজ শো-তে আপনাকে স্বাগতম।</p>
        <button onclick="startGame()" class="kbc-button px-10 py-4 rounded-full text-xl font-bold shadow-lg">গেম শুরু করুন</button>
    </div>

    <!-- MAIN GAME SCREEN -->
    <div id="game-screen" class="flex-col w-full h-full p-4 relative">
        <!-- Header: Mobile Prize & Timer -->
        <div class="flex justify-between items-center mb-4 lg:mb-8">
            <div class="bg-blue-900 border-2 border-yellow-500 px-4 py-1 rounded-lg">
                <span class="text-xs text-yellow-500 block uppercase">বর্তমান জয়ের রাশি</span>
                <span id="current-prize-display" class="text-xl font-bold">₹ 0</span>
            </div>
            
            <div id="timer-container" class="relative flex items-center justify-center w-16 h-16 rounded-full border-4 border-blue-500 bg-black">
                <span id="timer-text" class="text-2xl font-bold">30</span>
            </div>

            <div class="flex gap-2">
                <button id="btn-5050" onclick="use5050()" class="w-10 h-10 rounded-full border border-yellow-500 text-[10px] font-bold hover:bg-yellow-500 hover:text-black">50:50</button>
                <button id="btn-poll" onclick="usePoll()" class="w-10 h-10 rounded-full border border-yellow-500 text-[10px] font-bold hover:bg-yellow-500 hover:text-black">POLL</button>
                <button id="btn-phone" onclick="usePhone()" class="w-10 h-10 rounded-full border border-yellow-500 text-[10px] font-bold hover:bg-yellow-500 hover:text-black">📞</button>
            </div>
        </div>

        <div class="flex flex-row flex-grow overflow-hidden">
            <!-- Left Side: Question & Options -->
            <div class="flex-grow flex flex-col justify-center items-center px-2 lg:px-20">
                
                <div id="start-timer-overlay" class="absolute inset-0 z-20 flex items-center justify-center bg-black bg-opacity-80">
                    <button onclick="activateTimer()" class="bg-yellow-500 text-black px-8 py-4 rounded-lg font-black text-xl animate-bounce">সময় শুরু করুন (Start Timer)</button>
                </div>

                <div class="w-full bg-blue-900 border-t-2 border-b-2 border-yellow-500 py-6 px-4 mb-8 text-center relative">
                    <p id="question-text" class="text-xl lg:text-2xl font-semibold leading-relaxed">লোড হচ্ছে...</p>
                </div>

                <div id="options-container" class="grid grid-cols-1 lg:grid-cols-2 gap-4 w-full max-w-4xl">
                    <!-- Options injected here -->
                </div>
            </div>

            <!-- Right Side: Desktop Money Ladder -->
            <div class="hidden lg:flex flex-col-reverse justify-between bg-black bg-opacity-40 p-4 border-l border-blue-800 w-64 text-sm">
                <div id="money-ladder">
                    <!-- Ladder injected here -->
                </div>
            </div>
        </div>

        <div class="mt-auto flex justify-between p-4">
            <button onclick="confirmQuit()" class="text-red-400 font-bold underline">কুইট করুন (Quit)</button>
            <p class="text-gray-400 text-xs">লেভেল: <span id="level-counter">1</span>/30</p>
        </div>
    </div>

    <!-- RESULT / GAME OVER SCREEN -->
    <div id="result-screen" class="flex-col items-center justify-center text-center p-6 w-full h-full bg-black bg-opacity-95 z-50">
        <h2 id="result-title" class="text-5xl font-bold text-red-500 mb-4">ভুল উত্তর!</h2>
        <p id="result-msg" class="text-2xl mb-8">আপনি জিতেছেন: <span id="final-prize" class="text-yellow-500 font-bold">₹ 0</span></p>
        <button onclick="resetGame()" class="kbc-button px-12 py-4 rounded-full text-2xl font-bold">আবার খেলুন (Start New Game)</button>
    </div>

    <!-- MODALS FOR LIFELINES -->
    <div id="poll-modal" class="hidden fixed inset-0 bg-black bg-opacity-90 z-[60] flex flex-col items-center justify-center p-6">
        <h3 class="text-2xl font-bold mb-6 text-yellow-500">অডিয়েন্স পোল (Audience Poll)</h3>
        <div id="poll-bars" class="w-full max-w-md space-y-4"></div>
        <button onclick="closeModal('poll-modal')" class="mt-8 bg-white text-black px-6 py-2 rounded">বন্ধ করুন</button>
    </div>

    <div id="phone-modal" class="hidden fixed inset-0 bg-black bg-opacity-90 z-[60] flex flex-col items-center justify-center p-6">
        <div class="bg-blue-900 border-2 border-yellow-500 p-8 rounded-xl max-w-sm text-center">
            <p class="text-xl italic mb-4">"আমার মনে হয় সঠিক উত্তরটি হলো..."</p>
            <p id="expert-opinion" class="text-3xl font-bold text-yellow-500"></p>
            <button onclick="closeModal('phone-modal')" class="mt-8 bg-white text-black px-6 py-2 rounded">ধন্যবাদ</button>
        </div>
    </div>

    <script>
        // --- AUDIO CONFIG (User Triggered) ---
        const bgMusic = new Audio('https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3'); // Placeholder
        const tickSound = new Audio('https://www.soundjay.com/buttons/sounds/button-20.mp3');
        const wrongSound = new Audio('https://www.soundjay.com/buttons/sounds/button-10.mp3');
        const correctSound = new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3');
        
        bgMusic.loop = true;
        bgMusic.volume = 0.3;

        // --- QUESTION BANK ---
        const masterQuestionBank = [
            { q: "ভারতের জাতীয় পশু কোনটি?", o: ["হাতি", "সিংহ", "বাঘ", "গণ্ডার"], a: 2 },
            { q: "কলকাতা কোন নদীর তীরে অবস্থিত?", o: ["গঙ্গা", "যমুনা", "হুগলী", "পদ্মা"], a: 2 },
            { q: "সূর্য কি?", o: ["গ্রহ", "নক্ষত্র", "উপগ্রহ", "ধূমকেতু"], a: 1 },
            { q: "নোবেল পুরস্কার বিজয়ী প্রথম ভারতীয় কে?", o: ["সিভি রমণ", "মাদার তেরেসা", "রবীন্দ্রনাথ ঠাকুর", "অমর্ত্য সেন"], a: 2 },
            { q: "কোন গ্রহে প্রাণ আছে বলে বিজ্ঞানীরা ধারণা করেন?", o: ["শুক্র", "মঙ্গল", "শনি", "বৃহস্পতি"], a: 1 },
            { q: "ভারতের সংবিধানের জনক কাকে বলা হয়?", o: ["নেহেরু", "গান্ধীজি", "বি.আর. আম্বেদকর", "সরদার প্যাটেল"], a: 2 },
            { q: "পশ্চিমবঙ্গের রাজ্য পাখির নাম কি?", o: ["দোয়েল", "শ্বেতকণ্ঠ মাছরাঙা", "ময়ূর", "কাক"], a: 1 },
            { q: "চেস বা দাবার জন্ম কোন দেশে?", o: ["চীন", "ভারত", "পারস্য", "মিশর"], a: 1 },
            { q: "পৃথিবীর বৃহত্তম মহাদেশ কোনটি?", o: ["আফ্রিকা", "ইউরোপ", "এশিয়া", "উত্তর আমেরিকা"], a: 2 },
            { q: "শুন্য (Zero) আবিষ্কার করেন কোন দেশের গণিতবিদরা?", o: ["গ্রীস", "ভারত", "আরব", "রোম"], a: 1 },
            // ... Add up to 200 here ...
            { q: "শান্তিনিকেতন কে প্রতিষ্ঠা করেন?", o: ["বিদ্যাসাগর", "রবীন্দ্রনাথ ঠাকুর", "রাজা রামমোহন রায়", "দেবেন্দ্রনাথ ঠাকুর"], a: 3 },
            { q: "হাজার দুয়ারী প্যালেস কোথায় অবস্থিত?", o: ["কলকাতা", "মুর্শিদাবাদ", "মালদা", "বাঁকুড়া"], a: 1 },
            { q: "প্রথম বাংলা সবাক চলচ্চিত্র কোনটি?", o: ["জামাই ষষ্ঠী", "আলম আরা", "পথের পাঁচালী", "বিল্বমঙ্গল"], a: 0 },
            { q: "মাউন্ট এভারেস্ট কোন দেশে অবস্থিত?", o: ["ভারত", "চীন", "নেপাল", "ভুটান"], a: 2 },
            { q: "ভিটামিন-C এর অভাবে কোন রোগ হয়?", o: ["রাতকানা", "স্কার্ভি", "রিকেট", "অ্যানিমিয়া"], a: 1 }
        ];

        const prizeMoney = [
            "₹ 1,000", "₹ 2,000", "₹ 3,000", "₹ 5,000", "₹ 10,000",
            "₹ 20,000", "₹ 40,000", "₹ 80,000", "₹ 1,60,000", "₹ 3,20,000",
            "₹ 6,40,000", "₹ 12,50,000", "₹ 25,00,000", "₹ 50,00,000", "₹ 1 Crore",
            "₹ 7 Crore" // Scaled down for logic, but can expand to 30 levels
        ];

        // Ensure 30 prize levels (fill if bank is smaller)
        while(prizeMoney.length < 30) prizeMoney.push("₹ 7 Crore+");

        // --- GAME STATE ---
        let currentLevel = 0;
        let sessionQuestions = [];
        let timerInterval;
        let timeLeft = 30;
        let lifelines = { "5050": true, "poll": true, "phone": true };

        // --- CORE FUNCTIONS ---

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function showScreen(id) {
            document.getElementById('welcome-screen').style.setProperty('display', 'none', 'important');
            document.getElementById('game-screen').style.setProperty('display', 'none', 'important');
            document.getElementById('result-screen').style.setProperty('display', 'none', 'important');
            document.getElementById(id).style.setProperty('display', 'flex', 'important');
        }

        function startGame() {
            bgMusic.play().catch(e => console.log("Audio waiting for interaction"));
            sessionQuestions = shuffle([...masterQuestionBank]).slice(0, 30);
            currentLevel = 0;
            lifelines = { "5050": true, "poll": true, "phone": true };
            updateLifelineUI();
            showScreen('game-screen');
            loadQuestion();
        }

        function loadQuestion() {
            const qData = sessionQuestions[currentLevel];
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('level-counter').innerText = currentLevel + 1;
            document.getElementById('current-prize-display').innerText = currentLevel === 0 ? "₹ 0" : prizeMoney[currentLevel - 1];
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            qData.o.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'kbc-button p-4 rounded-lg text-left font-semibold flex items-center';
                btn.innerHTML = `<span class="text-yellow-500 mr-3">${String.fromCharCode(65 + index)}:</span> ${opt}`;
                btn.onclick = () => selectAnswer(index);
                container.appendChild(btn);
            });

            renderMoneyLadder();
            document.getElementById('start-timer-overlay').style.display = 'flex';
            resetTimerUI();
        }

        function activateTimer() {
            document.getElementById('start-timer-overlay').style.display = 'none';
            timeLeft = 30;
            tickSound.play();
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-text').innerText = timeLeft;
                
                if(timeLeft <= 7) {
                    document.getElementById('timer-container').classList.add('border-red-600', 'animate-pulse');
                }

                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    gameOver("সময় শেষ!");
                }
            }, 1000);
        }

        function resetTimerUI() {
            clearInterval(timerInterval);
            timeLeft = 30;
            document.getElementById('timer-text').innerText = timeLeft;
            document.getElementById('timer-container').classList.remove('border-red-600', 'animate-pulse');
        }

        function selectAnswer(index) {
            clearInterval(timerInterval);
            const btns = document.getElementById('options-container').children;
            const correctIndex = sessionQuestions[currentLevel].a;

            // Lock UI
            for(let b of btns) b.onclick = null;
            btns[index].classList.add('option-selected');

            // Suspense Delay
            setTimeout(() => {
                btns[index].classList.remove('option-selected');
                if(index === correctIndex) {
                    btns[index].classList.add('option-correct');
                    correctSound.play();
                    setTimeout(() => {
                        if(currentLevel === 29) {
                            victory();
                        } else {
                            currentLevel++;
                            loadQuestion();
                        }
                    }, 2000);
                } else {
                    btns[index].classList.add('option-wrong');
                    btns[correctIndex].classList.add('option-correct');
                    wrongSound.play();
                    setTimeout(() => gameOver("ভুল উত্তর!"), 2000);
                }
            }, 2000);
        }

        function gameOver(reason) {
            clearInterval(timerInterval);
            tickSound.pause();
            
            let winAmount = "₹ 0";
            if(currentLevel >= 20) winAmount = prizeMoney[19]; // Safe zone 3
            else if(currentLevel >= 10) winAmount = prizeMoney[9]; // Safe zone 2
            else if(currentLevel >= 5) winAmount = prizeMoney[4]; // Safe zone 1

            document.getElementById('result-title').innerText = reason;
            document.getElementById('final-prize').innerText = winAmount;
            showScreen('result-screen');
        }

        function victory() {
            document.getElementById('result-title').innerText = "অসাধারণ! আপনি কোটিপতি!";
            document.getElementById('result-title').classList.replace('text-red-500', 'text-yellow-500');
            document.getElementById('final-prize').innerText = prizeMoney[29];
            showScreen('result-screen');
        }

        function confirmQuit() {
            if(confirm("আপনি কি নিশ্চিতভাবে গেমটি কুইট করতে চান?")) {
                let winAmount = currentLevel === 0 ? "₹ 0" : prizeMoney[currentLevel - 1];
                document.getElementById('result-title').innerText = "আপনি কুইট করেছেন";
                document.getElementById('final-prize').innerText = winAmount;
                showScreen('result-screen');
            }
        }

        function resetGame() {
            location.reload(); // Simplest way to reset all states and pool cleanly
        }

        // --- LIFELINES ---

        function use5050() {
            if(!lifelines["5050"]) return;
            lifelines["5050"] = false;
            const qData = sessionQuestions[currentLevel];
            const btns = document.getElementById('options-container').children;
            let removed = 0;
            let indices = [0, 1, 2, 3].filter(i => i !== qData.a);
            shuffle(indices);
            
            indices.slice(0, 2).forEach(idx => {
                btns[idx].style.visibility = 'hidden';
            });
            updateLifelineUI();
        }

        function usePoll() {
            if(!lifelines["poll"]) return;
            lifelines["poll"] = false;
            const qData = sessionQuestions[currentLevel];
            const container = document.getElementById('poll-bars');
            container.innerHTML = '';
            
            let shares = [10, 10, 10, 10];
            shares[qData.a] = 60; // Bias towards correct
            
            shares.forEach((val, i) => {
                container.innerHTML += `
                    <div class="w-full">
                        <div class="flex justify-between text-xs mb-1"><span>${String.fromCharCode(65+i)}</span><span>${val}%</span></div>
                        <div class="w-full bg-gray-700 h-4 rounded-full overflow-hidden">
                            <div class="bg-yellow-500 h-full" style="width: ${val}%"></div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('poll-modal').classList.remove('hidden');
            updateLifelineUI();
        }

        function usePhone() {
            if(!lifelines["phone"]) return;
            lifelines["phone"] = false;
            const qData = sessionQuestions[currentLevel];
            const labels = ["A", "B", "C", "D"];
            document.getElementById('expert-opinion').innerText = labels[qData.a];
            document.getElementById('phone-modal').classList.remove('hidden');
            updateLifelineUI();
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function updateLifelineUI() {
            if(!lifelines["5050"]) document.getElementById('btn-5050').classList.add('opacity-30', 'pointer-events-none');
            if(!lifelines["poll"]) document.getElementById('btn-poll').classList.add('opacity-30', 'pointer-events-none');
            if(!lifelines["phone"]) document.getElementById('btn-phone').classList.add('opacity-30', 'pointer-events-none');
        }

        function renderMoneyLadder() {
            const ladder = document.getElementById('money-ladder');
            ladder.innerHTML = '';
            // Only show up to 16 for standard display, or more if needed
            [...prizeMoney].slice(0, 16).forEach((m, i) => {
                const isSafe = (i+1 === 5 || i+1 === 10 || i+1 === 15);
                const isActive = (currentLevel === i);
                ladder.innerHTML += `
                    <div class="flex justify-between px-2 py-1 ${isActive ? 'money-active' : ''} ${isSafe ? 'safe-zone' : ''}">
                        <span>${i+1}</span>
                        <span>${m}</span>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
