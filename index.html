            --primary-dark: #020230;
            --secondary-blue: #08085e;
            --gold: #ffd700;
            --white: #ffffff;
            --correct-green: #28a745;
            --wrong-red: #dc3545;
            --accent-purple: #4b0082;

        }

        body {
            background-color: var(--primary-dark);
            color: var(--white);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Screens */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle, var(--secondary-blue) 0%, var(--primary-dark) 100%);
            padding: 20px;
        }

        .active-screen {
            display: flex;
        }

        /* Welcome Screen */
        .logo-container h1 {
            font-size: 80px;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            margin-bottom: 20px;
            letter-spacing: 10px;
        }

        .btn-start, .btn-action {
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(to bottom, #ffd700, #b8860b);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            color: #000;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-start:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px var(--gold);
        }

        /* Game Board */
        .game-layout {
            display: grid;
            grid-template-columns: 3fr 1fr;
            width: 95%;
            max-width: 1200px;
            height: 90vh;
            gap: 20px;
        }

        .quiz-area {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .question-box {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--gold);
            padding: 30px;
            border-radius: 15px;
            font-size: 24px;
            margin-top: 50px;
            position: relative;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .option-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--white);
            color: white;
            padding: 15px;
            text-align: left;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .option-btn:hover {
            background: var(--accent-purple);
            border-color: var(--gold);
        }

        .option-btn.selected { background: orange; color: black; }
        .option-btn.correct { background: var(--correct-green) !important; }
        .option-btn.wrong { background: var(--wrong-red) !important; }

        /* Lifelines */
        .lifelines {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .lifeline-btn {
            background: #444;
            color: white;
            border: 1px solid var(--gold);
            padding: 10px 15px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
        }

        .lifeline-btn.used {
            text-decoration: line-through;
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Money Ladder */
        .money-ladder {
            background: rgba(0, 0, 0, 0.4);
            border-left: 2px solid var(--gold);
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
        }

        .money-step {
            padding: 5px 10px;
            font-size: 14px;
            color: #aaa;
        }

        .money-step.active {
            color: var(--gold);
            font-weight: bold;
            background: rgba(255, 215, 0, 0.2);
        }

        .money-step.safe { color: var(--white); border-bottom: 1px solid #555; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .game-layout { grid-template-columns: 1fr; }
            .money-ladder { display: none; }
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>

            theme: new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'), // Placeholder for Theme

            wrong: new Audio('https://actions.google.com/sounds/v1/cartoon/boing.ogg')
        };

        function playSound(name, loop = false) {
            try {
                sounds[name].currentTime = 0;
                sounds[name].loop = loop;
                sounds[name].play();
            } catch (e) { console.log("Audio play blocked"); }
        }

        function stopAllSounds() {
            Object.values(sounds).forEach(s => { s.pause(); s.currentTime = 0; });
        }

        // --- Fisher-Yates Shuffle ---
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- Core Functions ---
        function startGame() {
            stopAllSounds();
            document.getElementById('screen-welcome').classList.remove('active-screen');
            document.getElementById('screen-game').classList.add('active-screen');
            
            shuffledQuestions = shuffle([...masterQuestions]);
            currentLevel = 0;
            lifelines = { fifty: true, audience: true };
            
            updateLadderUI();
            loadQuestion();
            playSound('suspense', true);
        }

        function loadQuestion() {
            canAnswer = true;
            const qData = shuffledQuestions[currentLevel];
            document.getElementById('question-text').innerText = `?????? ${currentLevel + 1}: ${qData.q}`;
            document.getElementById('status-msg').innerText = "";
            
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            
            qData.a.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span style="color: var(--gold)">${String.fromCharCode(65 + index)}:</span> ${opt}`;
                btn.onclick = () => selectOption(index, btn);
                container.appendChild(btn);
            });

            updateLadderUI();
        }

        function selectOption(index, btn) {
            if (!canAnswer) return;
            canAnswer = false;

            btn.classList.add('selected');
            document.getElementById('status-msg').innerText = "????????? ????, ?? ??? ????";
            playSound('lock');

            setTimeout(() => {
                const correctIndex = shuffledQuestions[currentLevel].correct;
                if (index === correctIndex) {
                    btn.classList.remove('selected');
                    btn.classList.add('correct');
                    playSound('correct');
                    document.getElementById('status-msg').innerText = "??????! ???? ????!";
                    
                    setTimeout(() => {
                        if (currentLevel < moneyLadderValues.length - 1) {
                            currentLevel++;
                            loadQuestion();
                        } else {
                            gameOver(true);
                        }
                    }, 2000);
                } else {
                    btn.classList.remove('selected');
                    btn.classList.add('wrong');
                    document.querySelectorAll('.option-btn')[correctIndex].classList.add('correct');
                    playSound('wrong');
                    document.getElementById('status-msg').innerText = "??? ?????! ???? ?????? ????";
                    
                    setTimeout(() => gameOver(false), 2000);
                }
            }, 2000);
        }

        function updateLadderUI() {
            const ladder = document.getElementById('money-ladder');
            ladder.innerHTML = "";
            moneyLadderValues.forEach((val, i) => {
                const div = document.createElement('div');
                div.className = `money-step ${i === currentLevel ? 'active' : ''} ${safeZones.includes(i) ? 'safe' : ''}`;
                div.innerText = `${i + 1}. ${val}`;
                ladder.appendChild(div);
            });
            ladder.scrollTop = 0; 
        }

        function useFiftyFifty() {
            if (!canAnswer || !lifelines.fifty) return;
            lifelines.fifty = false;
            document.getElementById('life-50').classList.add('used');
            
            const correctIndex = shuffledQuestions[currentLevel].correct;
            let removed = 0;
            const btns = document.querySelectorAll('.option-btn');
            
            let indices = [0, 1, 2, 3].filter(i => i !== correctIndex);
            shuffle(indices);
            
            indices.slice(0, 2).forEach(i => {

            });
        }

            stopAllSounds();
            document.getElementById('screen-game').classList.remove('active-screen');
            document.getElementById('screen-end').classList.add('active-screen');

            let prize = "??";

                prize = "?? ????";

                for (let sz of safeZones) {
                    if (currentLevel > sz) lastSafeIndex = sz;
                }
                prize = lastSafeIndex >= 0 ? moneyLadderValues[lastSafeIndex] : "??";
