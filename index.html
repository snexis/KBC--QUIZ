let score = 0;
let currentRound = 0;
let currentQIndex = 0;

function loadQuestion(){
    let q = rounds[currentRound][currentQIndex];
    document.getElementById("q").innerText = q.q;
    document.getElementById("status").innerText = "Round " + (currentRound + 1) + " | Question " + (currentQIndex + 1) + "/18";

    let opts = document.getElementById("opts");
    opts.innerHTML = "";

    q.a.forEach((opt, index) => {
        let div = document.createElement("div");
        div.className = "option";
        div.innerText = opt;
        div.onclick = () => checkAnswer(div, index);
        opts.appendChild(div);
    });

    document.getElementById("btn50").style.display = "inline-block";
}

function checkAnswer(el, index){
    let q = rounds[currentRound][currentQIndex];
    let all = document.querySelectorAll(".option");
    all.forEach(btn => btn.style.pointerEvents = "none");

    if(index === q.c){
        el.classList.add("correct");
        score += 10;
    } else {
        el.classList.add("wrong");
        all[q.c].classList.add("correct");
    }
    document.getElementById("score").innerText = score;

    setTimeout(() => {
        currentQIndex++;
        if(currentQIndex >= 18){
            currentRound++;
            currentQIndex = 0;
            if(currentRound < rounds.length) alert("রাউন্ড " + currentRound + " শেষ! পরবর্তী রাউন্ডের জন্য প্রস্তুত হন।");
        }
        if(currentRound >= rounds.length){
            alert("খেলা শেষ! মোট স্কোর: " + score);
        } else {
            loadQuestion();
        }
    }, 2000);
}

function useFiftyFifty(){
    let q = rounds[currentRound][currentQIndex];
    let all = document.querySelectorAll(".option");
    let removed = 0;
    for(let i = 0; i < all.length; i++){
        if(i !== q.c && removed < 2){
            all[i].classList.add("hidden");
            removed++;
        }
    }
    document.getElementById("btn50").style.display = "none";
}

loadQuestion();
