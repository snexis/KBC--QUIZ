<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KBC বাংলা ২০২৬ - মহাকুইজ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: radial-gradient(circle, #1a1a40 0%, #050510 100%);
            color: white;
            overflow: hidden;
            touch-action: manipulation;
        }
        .kbc-button {
            background: linear-gradient(to bottom, #2b3a8c 0%, #111a4d 100%);
            border: 2px solid #4e65ff;
            transition: all 0.2s ease;
        }
        .kbc-button:active { transform: scale(0.98); }
        .selected-glow {
            animation: blink 0.4s infinite;
            background: #eab308 !important;
            color: black !important;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .correct-flash { background: #22c55e !important; border-color: #facc15 !important; animation: none; }
        .wrong-flash { background: #ef4444 !important; }
        
        .live-indicator {
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .ladder-item { font-size: 0.8rem; padding: 2px 10px; border-radius: 4px; }
        .active-level { background: #facc15; color: #000; font-weight: bold; transform: scale(1.05); }
    </style>
</head>
<body class="h-screen w-full flex flex-col items-center justify-center p-4">

    <!-- LOGIN / WELCOME SCREEN -->
    <div id="welcome-screen" class="z-50 text-center space-y-6 max-w-md w-full">
        <div class="relative inline-block mb-4">
            <div class="w-32 h-32 md:w-44 md:h-44 rounded-full border-[6px] border-yellow-500 flex items-center justify-center bg-blue-900 shadow-[0_0_50px_rgba(78,101,255,0.5)]">
                <span class="text-5xl md:text-7xl font-bold text-white">₹</span>
            </div>
            <div class="absolute -top-2 -right-4 bg-red-600 px-3 py-1 rounded-full text-[10px] font-bold flex items-center gap-2 live-indicator">
                <div class="w-2 h-2 bg-white rounded-full"></div> LIVE ২০২৬
            </div>
        </div>
        
        <h1 class="text-3xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 to-white">কে হবে কোটিপতি?</h1>
        
        <div class="glass-panel p-6 rounded-2xl space-y-4">
            <input type="text" id="user-name" placeholder="আপনার নাম লিখুন" class="w-full bg-blue-950/50 border border-blue-400 p-3 rounded-lg text-center outline-none focus:ring-2 ring-yellow-500">
            <input type="tel" id="user-mobile" placeholder="মোবাইল নম্বর (ঐচ্ছিক)" class="w-full bg-blue-950/50 border border-blue-400 p-3 rounded-lg text-center outline-none">
            <button onclick="initGame()" class="kbc-button w-full py-4 rounded-full text-xl font-bold border-b-4 border-yellow-600 shadow-xl hover:brightness-110 active:translate-y-1">
                গেম শুরু করুন
            </button>
        </div>
        <p class="text-[10px] text-gray-500 uppercase tracking-widest">KBC Digital Bengali Edition 2026</p>
    </div>

    <!-- MAIN GAME SCREEN -->
    <div id="game-screen" class="hidden w-full h-full max-w-6xl mx-auto flex flex-col md:flex-row gap-6 relative">
        
        <!-- Sidebar Ladder (Desktop) -->
        <div class="hidden md:flex w-64 flex-col-reverse justify-start gap-1 bg-blue-950/40 p-4 rounded-xl border border-blue-800">
            <div id="desktop-ladder" class="space-y-1">
                <!-- Ladder JS injection -->
            </div>
        </div>

        <div class="flex-1 flex flex-col justify-between py-4">
            <!-- Top Bar: Timer & Lifelines -->
            <div class="flex justify-between items-center mb-6">
                <div class="relative w-20 h-20 flex items-center justify-center">
                    <svg class="absolute inset-0 w-full h-full -rotate-90">
                        <circle cx="50%" cy="50%" r="35" stroke="#1e293b" stroke-width="6" fill="transparent" />
                        <circle id="timer-bar" cx="50%" cy="50%" r="35" stroke="#eab308" stroke-width="6" fill="transparent" stroke-dasharray="220" stroke-dashoffset="0" class="transition-all duration-1000 linear" />
                    </svg>
                    <span id="timer-text" class="text-2xl font-bold">৬০</span>
                </div>

                <div class="flex gap-3">
                    <button id="life-50" onclick="use5050()" class="w-12 h-12 md:w-14 md:h-14 rounded-full glass-panel border-2 border-blue-400 flex items-center justify-center text-xs font-bold hover:bg-blue-600">50:50</button>
                    <button id="life-poll" onclick="usePoll()" class="w-12 h-12 md:w-14 md:h-14 rounded-full glass-panel border-2 border-blue-400 flex items-center justify-center text-xs font-bold hover:bg-blue-600">POLL</button>
                    <button id="life-phone" onclick="usePhone()" class="w-12 h-12 md:w-14 md:h-14 rounded-full glass-panel border-2 border-blue-400 flex items-center justify-center text-xl hover:bg-blue-600">📞</button>
                </div>
            </div>

            <!-- Question Area -->
            <div class="space-y-6">
                <div class="kbc-button p-6 md:p-8 rounded-2xl border-2 border-blue-400 relative text-center min-h-[120px] flex items-center justify-center">
                    <div class="absolute -top-4 left-1/2 -translate-x-1/2 bg-blue-700 px-4 py-1 rounded-full border border-blue-400 text-xs font-bold">
                        প্রশ্ন <span id="current-q-num">১</span> • <span id="current-prize-tag">₹ ১,০০০</span>
                    </div>
                    <h2 id="question-text" class="text-xl md:text-2xl font-semibold">প্রশ্ন লোড হচ্ছে...</h2>
                </div>

                <!-- Options Grid -->
                <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Options JS injection -->
                </div>
            </div>

            <div class="mt-4 text-center">
                <button onclick="quitGame()" class="text-xs text-red-400 opacity-50 hover:opacity-100 uppercase tracking-widest">Quit Game</button>
            </div>
        </div>
    </div>

    <!-- AUDIENCE POLL MODAL -->
    <div id="poll-modal" class="hidden fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-3xl w-full max-w-sm border-2 border-yellow-500 text-center">
            <h3 class="text-2xl font-bold mb-6">অডিয়েন্স পোল রেজাল্ট</h3>
            <div id="poll-bars" class="space-y-6">
                <!-- Bars via JS -->
            </div>
            <button onclick="closePoll()" class="mt-8 px-8 py-2 bg-yellow-500 text-black font-bold rounded-lg">ঠিক আছে</button>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="hidden fixed inset-0 bg-black/95 z-[200] flex flex-col items-center justify-center p-6 text-center">
        <h2 id="result-status" class="text-4xl font-bold text-red-500 mb-2">গেম ওভার!</h2>
        <div class="my-8">
            <p class="text-gray-400">আপনি জিতেছেন</p>
            <p id="final-prize" class="text-6xl font-black text-yellow-500 drop-shadow-[0_0_20px_rgba(234,179,8,0.4)]">₹ ০</p>
        </div>
        <div class="glass-panel p-6 rounded-xl max-w-md mb-8">
            <p id="correct-ans-display" class="text-green-400 font-bold mb-2"></p>
            <p id="fact-text" class="text-sm text-gray-300 italic"></p>
        </div>
        <button onclick="location.reload()" class="kbc-button py-4 px-12 rounded-full text-xl font-bold border-b-4 border-yellow-600">আবার খেলুন</button>
    </div>

    <script>
        /** AUDIO ENGINE (Web Audio API) **/
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let suspenseNode = null;
        let tickingInterval = null;

        function playSound(freq, type, duration, vol) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function startSuspense() {
            if (suspenseNode) return;
            suspenseNode = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            suspenseNode.type = 'triangle';
            suspenseNode.frequency.setValueAtTime(60, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            suspenseNode.connect(gain); gain.connect(audioCtx.destination);
            suspenseNode.start();
        }

        function stopSuspense() {
            if (suspenseNode) { suspenseNode.stop(); suspenseNode = null; }
        }

        /** DATA & STATE **/
        const prizeMoney = ["₹ ১,০০০", "₹ ২,০০০", "₹ ৩,০০০", "₹ ৫,০০০", "₹ ১০,০০০", "₹ ২০,০০০", "₹ ৪০,০০০", "₹ ৮০,০০০", "₹ ১,৬০,০০০", "₹ ৩,২০,০০০", "₹ ৬,৪০,০০০", "₹ ১২,৫০,০০০", "₹ ২৫,০০,০০০", "₹ ৫০,০০,০০০", "₹ ১ কোটি", "₹ ২ কোটি", "₹ ৩ কোটি", "₹ ৫ কোটি", "₹ ৭ কোটি"];
        
        // Sample Questions (Total 200+ input logic ready)
        const questions = [
            { q: "ভারতের প্রথম সূর্য মিশনের নাম কী?", a: "Aditya-L1", b: "Surya-X", c: "Bhaskara-1", d: "Solar-India", ans: 0, f: "Aditya-L1 ভারত থেকে ২রা সেপ্টেম্বর ২০২৩-এ উৎক্ষেপণ করা হয়।" },
            { q: "২০২৬ সালে ফিফা ফুটবল বিশ্বকাপ কোন দেশে অনুষ্ঠিত হবে?", a: "ব্রাজিল", b: "আর্জেন্টিনা", c: "আমেরিকা, মেক্সিকো ও কানাডা", d: "ভারত ও চীন", ans: 2, f: "এটি হবে ৪৮টি দলের প্রথম বিশ্বকাপ।" },
            { q: "রবীন্দ্রনাথ ঠাকুর কত সালে নোবেল পুরস্কার পান?", a: "১৯০১", b: "১৯১১", c: "১৯১৩", d: "১৯২১", ans: 2, f: "তিনি গীতাঞ্জলি কাব্যগ্রন্থের জন্য সাহিত্যে নোবেল পান।" },
            { q: "কোন ভিটামিনের অভাবে স্কার্ভি রোগ হয়?", a: "ভিটামিন A", b: "ভিটামিন B", c: "ভিটামিন C", d: "ভিটামিন D", ans: 2, f: "ভিটামিন C এর প্রধান উৎস লেবু জাতীয় ফল।" },
            { q: "আইপিএল ২০২৪-এর চ্যাম্পিয়ন দল কোনটি?", a: "কেকেআর (KKR)", b: "এসআরএইচ (SRH)", c: "সিএসকে (CSK)", d: "এমআই (MI)", ans: 0, f: "কলকাতা নাইট রাইডার্স ৩য় বার ট্রফি জেতে।" },
            { q: "কোন গ্রহকে 'লাল গ্রহ' বলা হয়?", a: "শুক্র", b: "মঙ্গল", c: "বৃহস্পতি", d: "শনি", ans: 1, f: "আয়রন অক্সাইডের উপস্থিতির কারণে এটি লাল দেখায়।" },
            { q: "সূর্য থেকে পৃথিবীতে আলো আসতে কত সময় লাগে?", a: "৫ মিনিট", b: "৬ মিনিট ২০ সেকেন্ড", c: "৮ মিনিট ২০ সেকেন্ড", d: "১০ মিনিট", ans: 2, f: "আলোর গতিবেগ ৩ লক্ষ কিমি/সেকেন্ড।" },
            { q: "জাপানের মুদ্রার নাম কী?", a: "ইউয়ান", b: "ইয়েন", c: "লিরা", d: "ডলার", ans: 1, f: "ইয়েন বিশ্বের অন্যতম গুরুত্বপূর্ণ মুদ্রা।" },
            { q: "বিখ্যাত চলচ্চিত্র 'পথের পাঁচালী'র পরিচালক কে?", a: "ঋত্বিক ঘটক", b: "সত্যজিৎ রায়", c: "মৃণাল সেন", d: "তপন সিনহা", ans: 1, f: "এটি ১৯৫৫ সালে মুক্তি পায়।" },
            { q: "সৌরজগতের বৃহত্তম গ্রহ কোনটি?", a: "পৃথিবী", b: "মঙ্গল", c: "বৃহস্পতি", d: "শনি", ans: 2, f: "বৃহস্পতি পৃথিবী থেকে ১১ গুণ বড়।" }
        ];

        let currentLevel = 0;
        let timer = 60;
        let lifelines = { fifty: true, poll: true, phone: true };
        let activeQuestion = null;
        let isLocked = false;

        /** CORE FUNCTIONS **/
        function initGame() {
            const name = document.getElementById('user-name').value;
            if(!name) { alert("অনুগ্রহ করে আপনার নাম লিখুন"); return; }
            
            audioCtx.resume();
            startSuspense();
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            renderLadder();
            loadNextQuestion();
        }

        function renderLadder() {
            const container = document.getElementById('desktop-ladder');
            container.innerHTML = '';
            [...prizeMoney].reverse().forEach((amt, i) => {
                const idx = 18 - i;
                const div = document.createElement('div');
                div.className = `ladder-item ${idx === currentLevel ? 'active-level' : 'text-blue-300'}`;
                div.innerHTML = `<span class="opacity-50 mr-4">${idx+1}</span> ${amt}`;
                container.appendChild(div);
            });
        }

        function loadNextQuestion() {
            isLocked = false;
            activeQuestion = questions[currentLevel] || questions[Math.floor(Math.random()*questions.length)];
            document.getElementById('question-text').innerText = activeQuestion.q;
            document.getElementById('current-q-num').innerText = currentLevel + 1;
            document.getElementById('current-prize-tag').innerText = prizeMoney[currentLevel];
            
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            ['a','b','c','d'].forEach((key, i) => {
                const btn = document.createElement('button');
                btn.id = `opt-${i}`;
                btn.className = 'kbc-button p-4 rounded-xl border border-blue-500/50 text-left flex items-center hover:bg-blue-800';
                btn.innerHTML = `<span class="text-yellow-500 font-bold mr-3">${key.toUpperCase()}:</span> ${activeQuestion[key]}`;
                btn.onclick = () => selectOption(i);
                grid.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            timer = 60;
            clearInterval(tickingInterval);
            updateTimerUI();
            tickingInterval = setInterval(() => {
                timer--;
                updateTimerUI();
                if(timer <= 0) { clearInterval(tickingInterval); endGame("সময় শেষ!"); }
                // Sound logic
                if(timer <= 7) playSound(800, 'sine', 0.1, 0.15);
                else playSound(400, 'sine', 0.05, 0.05);
            }, 1000);
        }

        function updateTimerUI() {
            const bar = document.getElementById('timer-bar');
            document.getElementById('timer-text').innerText = timer;
            bar.style.strokeDashoffset = 220 - (220 * timer / 60);
            bar.style.stroke = timer <= 10 ? '#ef4444' : '#eab308';
        }

        function selectOption(idx) {
            if(isLocked) return;
            isLocked = true;
            clearInterval(tickingInterval);
            playSound(300, 'square', 0.5, 0.1); // Lock sound
            
            const btn = document.getElementById(`opt-${idx}`);
            btn.classList.add('selected-glow');

            setTimeout(() => {
                btn.classList.remove('selected-glow');
                if(idx === activeQuestion.ans) {
                    btn.classList.add('correct-flash');
                    playSound(1000, 'sine', 0.4, 0.2); // Win sound
                    setTimeout(() => {
                        if(currentLevel === 18) endGame("বিজয়ী!", true);
                        else { currentLevel++; renderLadder(); loadNextQuestion(); }
                    }, 2000);
                } else {
                    btn.classList.add('wrong-flash');
                    document.getElementById(`opt-${activeQuestion.ans}`).classList.add('correct-flash');
                    playSound(150, 'sawtooth', 1, 0.3); // Lose sound
                    setTimeout(() => endGame("ভুল উত্তর!"), 2000);
                }
            }, 2500);
        }

        /** LIFELINES **/
        function use5050() {
            if(!lifelines.fifty || isLocked) return;
            lifelines.fifty = false;
            document.getElementById('life-50').style.opacity = '0.2';
            let removed = 0;
            [0,1,2,3].forEach(i => {
                if(i !== activeQuestion.ans && removed < 2) {
                    document.getElementById(`opt-${i}`).style.visibility = 'hidden';
                    removed++;
                }
            });
        }

        function usePoll() {
            if(!lifelines.poll || isLocked) return;
            lifelines.poll = false;
            document.getElementById('life-poll').style.opacity = '0.2';
            const bars = document.getElementById('poll-bars');
            bars.innerHTML = '';
            
            let data = [10, 10, 10, 10];
            data[activeQuestion.ans] = 65; 
            data[(activeQuestion.ans + 1) % 4] = 15;

            ['A','B','C','D'].forEach((l, i) => {
                bars.innerHTML += `
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-bold"><span>Option ${l}</span><span>${data[i]}%</span></div>
                        <div class="w-full bg-blue-900 h-4 rounded-full overflow-hidden border border-blue-700">
                            <div class="bg-gradient-to-r from-yellow-600 to-yellow-300 h-full transition-all duration-1000" style="width:${data[i]}%"></div>
                        </div>
                    </div>`;
            });
            document.getElementById('poll-modal').classList.remove('hidden');
        }

        function closePoll() { document.getElementById('poll-modal').classList.add('hidden'); }

        function usePhone() {
            if(!lifelines.phone || isLocked) return;
            lifelines.phone = false;
            document.getElementById('life-phone').style.opacity = '0.2';
            const hint = ['A','B','C','D'][activeQuestion.ans];
            alert(`আপনার বিশেষজ্ঞ বন্ধু বলছে: "আমার মনে হয় সঠিক উত্তরটি হলো ${hint}!"`);
        }

        function quitGame() {
            endGame("আপনি খেলাটি ছেড়ে দিয়েছেন");
        }

        function endGame(msg, isWin = false) {
            stopSuspense();
            clearInterval(tickingInterval);
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            let winAmt = "₹ ০";
            if(isWin) winAmt = prizeMoney[18];
            else if(currentLevel >= 10) winAmt = prizeMoney[9];
            else if(currentLevel >= 5) winAmt = prizeMoney[4];
            else if(currentLevel > 0) winAmt = prizeMoney[currentLevel-1];

            document.getElementById('result-status').innerText = msg;
            document.getElementById('final-prize').innerText = winAmt;
            document.getElementById('correct-ans-display').innerText = "সঠিক উত্তর: " + activeQuestion[['a','b','c','d'][activeQuestion.ans]];
            document.getElementById('fact-text').innerText = activeQuestion.f;
        }
    </script>
</body>
</html>
