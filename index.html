<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBC Quiz - Bengali</title>
    <style>
        :root {
            --bg-color: #020230;
            --gold: #ffd700;
            --blue-btn: #1a237e;
            --correct: #28a745;
            --wrong: #dc3545;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 95%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
            border: 4px solid var(--gold);
            padding: 20px;
            border-radius: 15px;
            background: radial-gradient(circle, #0c0c4d 0%, #020230 100%);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        /* Quiz Section */
        .quiz-section {
            text-align: center;
            position: relative;
        }

        .lifelines {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .lifeline-btn {
            background: var(--blue-btn);
            border: 2px solid var(--gold);
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 50px;
            font-weight: bold;
        }

        .lifeline-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .timer-circle {
            width: 70px;
            height: 70px;
            border: 4px solid var(--gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            margin: 0 auto 20px;
            background: rgba(0,0,0,0.5);
        }

        .question-box {
            border: 2px solid var(--gold);
            padding: 20px;
            margin-bottom: 20px;
            background: rgba(26, 35, 126, 0.7);
            border-radius: 10px;
            font-size: 22px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: var(--blue-btn);
            border: 1px solid var(--gold);
            color: white;
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            text-align: left;
        }

        .option-btn:hover {
            background: #283593;
        }

        /* Sidebar - Money Tree */
        .money-tree {
            border-left: 2px solid var(--gold);
            padding-left: 20px;
            display: flex;
            flex-direction: column-reverse;
            justify-content: center;
        }

        .money-step {
            padding: 5px 10px;
            margin: 2px 0;
            font-size: 16px;
            color: #aaa;
        }

        .money-step.active {
            color: var(--gold);
            font-weight: bold;
            background: rgba(255, 215, 0, 0.2);
            border-radius: 5px;
        }

        .money-step.reached {
            color: white;
        }

        /* Modals and Overlays */
        #result-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .restart-btn {
            background: var(--gold);
            color: black;
            padding: 15px 30px;
            border: none;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 5px;
        }

        /* Audience Poll Modal */
        #poll-modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #1a237e;
            border: 2px solid var(--gold);
            padding: 20px;
            width: 300px;
            z-index: 10;
        }

        .poll-bar-container {
            margin: 10px 0;
        }

        .poll-bar {
            height: 20px;
            background: var(--gold);
            transition: width 1s;
        }

        @media (max-width: 768px) {
            #game-container { grid-template-columns: 1fr; }
            .money-tree { display: none; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Main Quiz Area -->
        <div class="quiz-section">
            <div class="lifelines">
                <button class="lifeline-btn" id="fifty-fifty" onclick="useFiftyFifty()">50-50</button>
                <button class="lifeline-btn" id="audience-poll" onclick="useAudiencePoll()">Audience Poll</button>
            </div>

            <div class="timer-circle" id="timer">30</div>

            <div class="question-box" id="question">প্রশ্ন এখানে দেখাবে...</div>

            <div class="options-grid" id="options-container">
                <!-- Options will be loaded here -->
            </div>

            <!-- Audience Poll View -->
            <div id="poll-modal">
                <h3>Audience Poll Result</h3>
                <div id="poll-results"></div>
                <button onclick="document.getElementById('poll-modal').style.display='none'" style="margin-top: 10px;">Close</button>
            </div>
        </div>

        <!-- Sidebar Money Ladder -->
        <div class="money-tree" id="money-ladder">
            <!-- Steps will be loaded here -->
        </div>
    </div>

    <!-- Final Result Screen -->
    <div id="result-screen">
        <h1 id="win-message">আপনি জিতেছেন!</h1>
        <h2 id="total-money">₹০</h2>
        <button class="restart-btn" onclick="location.reload()">আবার শুরু করুন</button>
    </div>

    <script>
        const questions = [
            { q: "ভারতের রাজধানী কোনটি?", a: ["কলকাতা", "মুম্বাই", "নয়াদিল্লি", "চেন্নাই"], correct: 2 },
            { q: "পশ্চিমবঙ্গের রাজ্য পশু কোনটি?", a: ["রয়্যাল বেঙ্গল টাইগার", "মেছো বিড়াল", "হাতি", "গন্ডার"], correct: 1 },
            { q: "কোন গ্রহকে লাল গ্রহ বলা হয়?", a: ["শুক্র", "মঙ্গল", "বৃহস্পতি", "শনি"], correct: 1 },
            { q: "বিশ্বের বৃহত্তম মহাসাগর কোনটি?", a: ["আটলান্টিক", "ভারত", "প্রশান্ত", "সুমেরু"], correct: 2 },
            { q: "বাংলা সাহিত্যের 'ভোরের পাখি' কাকে বলা হয়?", a: ["রবীন্দ্রনাথ ঠাকুর", "বিহারীলাল চক্রবর্তী", "কাজী নজরুল ইসলাম", "জীবনানন্দ দাশ"], correct: 1 },
            { q: "অলিম্পিকে স্বর্ণপদক জয়ী প্রথম ভারতীয় জ্যাভলিন থ্রোয়ার কে?", a: ["অভিনব বিন্দ্রা", "পিভি সিন্ধু", "নীরজ চোপড়া", "সুশীল কুমার"], correct: 2 },
            { q: "কোন শহরকে 'পিঙ্ক সিটি' বলা হয়?", a: ["যোধপুর", "উদয়পুর", "জয়পুর", "আজমের"], correct: 2 }
        ];

        const moneyLadderValues = ["₹১,০০০", "₹৫,০০০", "₹১০,০০০", "₹৫০,০০০", "₹১,৬০,০০০", "₹১২,৫০,০০০", "₹৭ কোটি"];
        
        let currentLevel = 0;
        let timeLeft = 30;
        let timerInterval;

        // Initialize Money Tree
        const ladderDiv = document.getElementById('money-ladder');
        moneyLadderValues.forEach((val, index) => {
            const div = document.createElement('div');
            div.className = 'money-step';
            div.id = `step-${index}`;
            div.innerText = `${index + 1}. ${val}`;
            ladderDiv.appendChild(div);
        });

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            document.getElementById('timer').innerText = timeLeft;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame("সময় শেষ! আপনি হেরে গেছেন।");
                }
            }, 1000);
        }

        function loadQuestion() {
            if (currentLevel >= questions.length) {
                endGame("অভিনন্দন! আপনি ৭ কোটি টাকা জিতেছেন!", true);
                return;
            }

            startTimer();
            const qData = questions[currentLevel];
            document.getElementById('question').innerText = qData.q;
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            // Money Tree update
            document.querySelectorAll('.money-step').forEach(s => s.classList.remove('active'));
            document.getElementById(`step-${currentLevel}`).classList.add('active');

            qData.a.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `${String.fromCharCode(65 + index)}: ${opt}`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btn) {
            clearInterval(timerInterval);
            const correctIndex = questions[currentLevel].correct;
            const allBtns = document.querySelectorAll('.option-btn');

            if (selectedIndex === correctIndex) {
                btn.style.backgroundColor = "var(--correct)";
                setTimeout(() => {
                    currentLevel++;
                    loadQuestion();
                }, 1500);
            } else {
                btn.style.backgroundColor = "var(--wrong)";
                allBtns[correctIndex].style.backgroundColor = "var(--correct)";
                setTimeout(() => {
                    endGame(`ভুল উত্তর! আপনি ${currentLevel > 0 ? moneyLadderValues[currentLevel-1] : '০ টাকা'} জিতেছেন।`);
                }, 1500);
            }
        }

        // Lifeline: 50-50
        function useFiftyFifty() {
            const correctIndex = questions[currentLevel].correct;
            const allBtns = document.querySelectorAll('.option-btn');
            let removed = 0;
            
            allBtns.forEach((btn, idx) => {
                if (idx !== correctIndex && removed < 2) {
                    btn.style.visibility = "hidden";
                    removed++;
                }
            });
            document.getElementById('fifty-fifty').disabled = true;
        }

        // Lifeline: Audience Poll
        function useAudiencePoll() {
            const correctIndex = questions[currentLevel].correct;
            const pollModal = document.getElementById('poll-modal');
            const pollResults = document.getElementById('poll-results');
            pollResults.innerHTML = '';
            pollModal.style.display = 'block';

            let shares = [10, 10, 10, 10];
            shares[correctIndex] = 70; // High probability for correct answer

            shares.forEach((val, idx) => {
                const label = String.fromCharCode(65 + idx);
                pollResults.innerHTML += `
                    <div class="poll-bar-container">
                        ${label}: <div class="poll-bar" style="width: ${val}%"></div> ${val}%
                    </div>
                `;
            });
            document.getElementById('audience-poll').disabled = true;
        }

        function endGame(msg, isWin = false) {
            document.getElementById('result-screen').style.display = 'flex';
            document.getElementById('win-message').innerText = msg;
            document.getElementById('total-money').innerText = isWin ? "₹৭ কোটি" : "গেম ওভার";
        }

        // Start the game
        loadQuestion();
    </script>
</body>
</html>
