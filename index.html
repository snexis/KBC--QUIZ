<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KBC Bengali Pro - Responsive Edition</title>
    
    <!-- Clean Bengali Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --kbc-bg: #020230;
            --kbc-gold: #ffd700;
            --kbc-blue: #111499;
            --kbc-neon: #00d2ff;
            --text-main: #ffffff;
            --correct: #2ecc71;
            --wrong: #e74c3c;
        }

        /* --- GLOBAL RESPONSIVE RESET --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Hind Siliguri', 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--kbc-bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: radial-gradient(circle, #08085e 0%, #010114 100%);
        }

        .hidden { display: none !important; }

        /* --- MOBILE-FIRST LAYOUT --- */
        .app-container {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
        }

        /* --- LOGIN & SUMMARY SCREENS --- */
        .overlay-screen {
            background: rgba(0,0,0,0.9);
            position: absolute;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .kbc-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid var(--kbc-gold);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .input-field {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid var(--kbc-gold);
            background: #000;
            color: #fff;
            font-size: 1rem;
        }

        /* --- GAMEPLAY HUD --- */
        .game-main {
            display: flex;
            flex: 1;
            gap: 15px;
            overflow: hidden;
        }

        /* Question Area */
        .play-zone {
            flex: 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .q-box {
            width: 100%;
            background: linear-gradient(90deg, transparent, var(--kbc-blue), transparent);
            border-top: 2px solid var(--kbc-gold);
            border-bottom: 2px solid var(--kbc-gold);
            padding: 20px;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px #000;
        }

        .options-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
        }

        .opt-btn {
            background: rgba(17, 20, 153, 0.8);
            border: 1px solid var(--kbc-neon);
            padding: 15px 20px;
            border-radius: 40px;
            cursor: pointer;
            text-align: left;
            font-size: 1.1rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
        }

        .opt-btn:hover { border-color: #fff; background: #1e21d3; }
        .opt-btn span { color: var(--kbc-gold); margin-right: 10px; font-weight: 900; }

        /* Prize Tree (Sidebar) */
        .prize-ladder {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border-left: 1px solid var(--kbc-gold);
            display: flex;
            flex-direction: column-reverse;
            overflow-y: auto;
            padding: 10px;
        }

        .lvl { padding: 5px 10px; font-size: 0.8rem; border-radius: 4px; margin: 1px 0; color: #aaa; }
        .lvl.active { background: var(--kbc-gold); color: #000; font-weight: 900; transform: scale(1.05); }
        .lvl.milestone { color: var(--kbc-gold); border-bottom: 1px solid rgba(255,215,0,0.2); }

        /* --- BUTTONS --- */
        .btn-action {
            background: linear-gradient(180deg, var(--kbc-gold), #b8860b);
            color: #000;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            margin: 5px;
        }

        .btn-quit {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(231, 76, 60, 0.3);
            border: 1px solid var(--wrong);
            color: #fff;
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Animation */
        .blinking { animation: blink 0.3s 4; }
        @keyframes blink { 50% { background: orange; } }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .game-main { flex-direction: column; }
            .prize-ladder { flex: none; height: 80px; flex-direction: row; border-left: none; border-top: 1px solid var(--kbc-gold); }
            .q-box { font-size: 1.1rem; }
            .opt-btn { padding: 10px 15px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- QUIT BUTTON -->
        <button id="quit-btn" class="btn-quit hidden" onclick="quitGame()">Exit গেম</button>

        <!-- SOUNDS -->
        <audio id="snd-bgm" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
        <audio id="snd-tick" src="https://assets.mixkit.co/active_storages/sfx/2571/2571-preview.mp3"></audio>
        <audio id="snd-correct" src="https://assets.mixkit.co/active_storages/sfx/2019/2019-preview.mp3"></audio>
        <audio id="snd-wrong" src="https://assets.mixkit.co/active_storages/sfx/2572/2572-preview.mp3"></audio>

        <!-- SCREEN: LOGIN -->
        <div id="screen-login" class="overlay-screen">
            <div class="kbc-card">
                <h2 style="color:var(--kbc-gold); margin-bottom:15px;">স্বাগতম KBC তে</h2>
                <input type="tel" id="mobile-input" class="input-field" placeholder="মোবাইল নম্বর">
                <input type="text" id="master-input" class="input-field" placeholder="মাস্টার কোড (ঐচ্ছিক)">
                <button class="btn-action" onclick="initLogin()">গেম শুরু করুন</button>
            </div>
        </div>

        <!-- SCREEN: GAMEPLAY -->
        <div id="screen-game" class="game-main hidden">
            <div class="play-zone">
                <div id="timer-display" style="font-size: 2rem; color: var(--kbc-gold); font-weight: 900; margin-bottom: 10px;">25</div>
                <div id="q-text" class="q-box">Loading Question...</div>
                <div class="options-grid">
                    <div class="opt-btn" onclick="checkAnswer(0)"><span>A</span> <div id="opt-0"></div></div>
                    <div class="opt-btn" onclick="checkAnswer(1)"><span>B</span> <div id="opt-1"></div></div>
                    <div class="opt-btn" onclick="checkAnswer(2)"><span>C</span> <div id="opt-2"></div></div>
                    <div class="opt-btn" onclick="checkAnswer(3)"><span>D</span> <div id="opt-3"></div></div>
                </div>
            </div>
            <div id="prize-tree" class="prize-ladder">
                <!-- Levels generated via JS -->
            </div>
        </div>

        <!-- SCREEN: SUMMARY -->
        <div id="screen-summary" class="overlay-screen hidden">
            <div class="kbc-card">
                <h2 id="sum-title" style="color:#fff;">গেম ওভার!</h2>
                <h1 id="sum-prize" style="color:var(--kbc-gold); margin:20px 0;">৳০</h1>
                
                <div id="wallet-form" class="hidden">
                    <input type="text" id="upi-id" class="input-field" placeholder="UPI ID বা ব্যাংক ডিটেইলস">
                    <button class="btn-action" onclick="alert('আবেদনটি সফল হয়েছে!')">সাবমিট করুন</button>
                </div>

                <button id="withdraw-btn" class="btn-action hidden" onclick="toggleWallet()">টাকা তুলুন (Withdraw)</button>
                <button class="btn-action" onclick="quitGame()">গেম থেকে বের হন (Exit)</button>
            </div>
        </div>
    </div>

    <script>
        const SECRET_MASTER_CODE = "TEST2026";
        const SAFE_ZONE_ROUND = 5;
        const PRIZE_LADDER = ["৳১,০০০", "৳২,০০০", "৳৩,০০০", "৳৫,০০০", "৳১০,০০০", "৳২০,০০০", "৳৪০,০০০", "৳৮০,০০০", "৳১.৬০ লক্ষ", "৳৩.২০ লক্ষ", "৳৬.৪০ লক্ষ", "৳১২.৫০ লক্ষ", "৳২৫ লক্ষ", "৳৫০ লক্ষ", "৳১ কোটি", "৳৭ কোটি"]; 
        // [Note: Adjust prize count to match your round count]

        let currentRound = 0;
        let timer = 25;
        let timerId;
        let sessionQuestions = [];

        // --- AUTH & TESTER LOGIC ---
        window.onload = () => {
            const testerData = JSON.parse(localStorage.getItem('kbc_tester_session'));
            if (testerData && (Date.now() - testerData.time < 86400000)) {
                startGame();
            }
        };

        function initLogin() {
            const mobile = document.getElementById('mobile-input').value;
            const master = document.getElementById('master-input').value;

            if (master === SECRET_MASTER_CODE) {
                localStorage.setItem('kbc_tester_session', JSON.stringify({time: Date.now(), user: mobile}));
                startGame();
            } else if (mobile.length >= 10) {
                startGame();
            } else {
                alert("সঠিক তথ্য দিন");
            }
        }

        // --- GAMEPLAY CORE ---
        function startGame() {
            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            document.getElementById('quit-btn').classList.remove('hidden');
            document.getElementById('snd-bgm').play();
            
            buildPrizeTree();
            // [LOGIC: Load sessionQuestions from your DB here]
            loadQuestion();
        }

        function buildPrizeTree() {
            const tree = document.getElementById('prize-tree');
            tree.innerHTML = '';
            PRIZE_LADDER.forEach((amt, i) => {
                const div = document.createElement('div');
                div.className = `lvl ${i === (SAFE_ZONE_ROUND-1) ? 'milestone' : ''}`;
                div.id = `lvl-${i}`;
                div.innerHTML = `${i+1} ⬥ ${amt}`;
                tree.appendChild(div);
            });
        }

        function loadQuestion() {
            // Placeholder Question Logic
            const qData = { q: "ভারতের বর্তমান রাজধানী কোনটি?", o: ["কলকাতা", "দিল্লি", "মুম্বই", "চেন্নাই"], a: 1 };
{ q: "পশ্চিমবঙ্গের রাজ্য পশুর নাম কী?", o: ["রয়্যাল বেঙ্গল টাইগার", "মেছো বিড়াল", "হাতি", "হরিণ"], a: 1, level: 1 },
            { q: "সূর্য কোন দিকে ওঠে?", o: ["পশ্চিম", "উত্তর", "দক্ষিণ", "পূর্ব"], a: 3, level: 1 },
            { q: "আমাদের জাতীয় সংগীত 'জন গণ মন' কার লেখা?", o: ["রবীন্দ্রনাথ ঠাকুর", "কাজী নজরুল ইসলাম", "বঙ্কিমচন্দ্র চট্টোপাধ্যায়", "শরৎচন্দ্র চট্টোপাধ্যায়"], a: 0, level: 1 },
            { q: "ভারতের জাতীয় ফল কোনটি?", o: ["আপেল", "কাঁঠাল", "আম", "কলা"], a: 2, level: 1 },
            { q: "কোন গ্রহকে 'লাল গ্রহ' বলা হয়?", o: ["বুধ", "মঙ্গল", "শুক্র", "বৃহস্পতি"], a: 1, level: 1 },
            { q: "বছরের কোন মাসটি সাধারণত ২৮ দিনের হয়?", o: ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল"], a: 1, level: 1 },
            { q: "একটি ক্রিকেট ম্যাচে প্রতি দলে কতজন খেলোয়াড় থাকে?", o: ["৯ জন", "১০ জন", "১১ জন", "১২ জন"], a: 2, level: 1 },
            { q: "কোন প্রাণীকে 'মরুভূমির জাহাজ' বলা হয়?", o: ["উট", "ঘোড়া", "গাধা", "হাতি"], a: 0, level: 1 },
            { q: "ইংরেজি বর্ণমালায় মোট কয়টি স্বরবর্ণ (Vowel) আছে?", o: ["৫টি", "৪টি", "৬টি", "৭টি"], a: 0, level: 1 },
            { q: "তাজমহল ভারতের কোন শহরে অবস্থিত?", o: ["দিল্লি", "আগরা", "জয়পুর", "লখনউ"], a: 1, level: 1 },
            { q: "পৃথিবীর সবচেয়ে বড় মহাসাগর কোনটি?", o: ["ভারত মহাসাগর", "আটলান্টিক মহাসাগর", "প্রশান্ত মহাসাগর", "সুমেরu মহাসাগর"], a: 2, level: 1 },
            { q: "কোন উৎসবকে 'আলোর উৎসব' বলা হয়?", o: ["হোলি", "দুর্গাপুজো", "দীপাবলি", "ঈদ"], a: 2, level: 1 },
            { q: "ল্যাপটপ বা কম্পিউটার স্ক্রিনে দেখার জন্য কোন ইনপুট ডিভাইস ব্যবহার করা হয়?", o: ["মাউস", "কিবোর্ড", "মনিটর", "প্রিন্টার"], a: 0, level: 1 },
            { q: "কলকাতা কোন নদীর তীরে অবস্থিত?", o: ["গঙ্গা", "যমুনা", "হুগলি", "পদ্মা"], a: 2, level: 1 },
            { q: "ডাক্তাররা নাড়ি (Pulse) দেখে মানুষের কী পরীক্ষা করেন?", o: ["রক্তের পরিমাণ", "হৃদস্পন্দনের গতি", "শরীরের ওজন", "চোখের দৃষ্টি"], a: 1, level: 1 },
            { q: "মহাকাব্য 'রামায়ণ' অনুযায়ী শ্রী রামচন্দ্রের স্ত্রীর নাম কী?", o: ["সীতা", "রাধা", "দ্রৌপদী", "কুন্তী"], a: 0, level: 1 },
            { q: "দাবা খেলায় বোর্ডের ওপর মোট কতগুলি ঘর থাকে?", o: ["৫০টি", "৬৪টি", "৬০টি", "৭০টি"], a: 1, level: 1 },
            { q: "কোন রঙের ট্রাফিক লাইট দেখলে গাড়ি থামাতে হয়?", o: ["সবুজ", "হলুদ", "নীল", "লাল"], a: 3, level: 1 },
            { q: "মানুষের মুখের ভেতর মোট কত ধরনের দাঁত থাকে?", o: ["২ ধরনের", "৩ ধরনের", "৪ ধরনের", "৫ ধরনের"], a: 2, level: 1 },
            { q: "আমাদের সৌরজগতের সবচেয়ে বড় গ্রহ কোনটি?", o: ["পৃথিবী", "মঙ্গল", "বৃহস্পতি", "শনি"], a: 2, level: 1 },
            { q: "পাহাড়ি এলাকায় যাতায়াতের জন্য প্রধানত কোন পশুর সাহায্য নেওয়া হয়?", o: ["উট", "খচ্চর বা ঘোড়া", "হাতি", "মহিষ"], a: 1, level: 1 },
            { q: "মোবাইল ফোনে সিম কার্ডের 'SIM' এর পুরো নাম কী?", o: ["Subscriber Identity Module", "System Instant Message", "Secure Internet Medium", "Subscriber International Mobile"], a: 0, level: 1 },
            { q: "কোন পাখির ডিম পৃথিবীর মধ্যে সবচেয়ে বড় হয়?", o: ["ময়ূর", "উটপাখি", "ঈগল", "পেনগুইন"], a: 1, level: 1 },
            { q: "ভারতের স্বাধীনতা দিবস কোন তারিখে পালিত হয়?", o: ["২৬শে জানুয়ারি", "১৫ই আগস্ট", "২রা অক্টোবর", "১৪ই নভেম্বর"], a: 1, level: 1 },
            { q: "রামধনু বা রংধনুতে মোট কয়টি রঙ থাকে?", o: ["৫টি", "৬টি", "৭টি", "৮টি"], a: 2, level: 1 },
            { q: "কোন পতঙ্গ কামড়ালে ডেঙ্গু রোগ হতে পারে?", o: ["অ্যানোফিলিস মশা", "এডিস মশা", "কিউলেক্স msha", "মাছি"], a: 1, level: 1 },
            { q: "ফেসবুক (Facebook) এর প্রতিষ্ঠাতা কে?", o: ["বিল গেটস", "মার্ক জুকারবার্গ", "স্টিভ জবস", "এলন মাস্ক"], a: 1, level: 1 },
            { q: "কোন ফলকে 'ফলের রাজা' বলা হয়?", o: ["আপেল", "লিচু", "আম", "আঙুর"], a: 2, level: 1 },
            { q: "ভারতের জাতীয় পশু কোনটি?", o: ["সিংহ", "রয়্যাল বেঙ্গল টাইগার", "চিতাবাঘ", "হাতি"], a: 1, level: 1 },
            { q: "পৃথিবীর সবচেয়ে উঁচু পর্বতশৃঙ্গ কোনটি?", o: ["কাঞ্চনজঙ্ঘা", "গডউইন অস্টিন", "মাউন্ট এভারেস্ট", "নন্দাদেবী"], a: 2, level: 1 },

        function startTimer() {
            timer = 25;
            document.getElementById('timer-display').innerText = timer;
            clearInterval(timerId);
            timerId = setInterval(() => {
                timer--;
                document.getElementById('timer-display').innerText = timer;
                document.getElementById('snd-tick').play();
                if (timer <= 0) endGame(false);
            }, 1000);
        }

        function checkAnswer(idx) {
            clearInterval(timerId);
            const correctAns = 1; // Dummy check
            const btns = document.querySelectorAll('.opt-btn');
            
            btns[idx].classList.add('blinking');
            
            setTimeout(() => {
                btns[idx].classList.remove('blinking');
                if (idx === correctAns) {
                    document.getElementById('snd-correct').play();
                    currentRound++;
                    if (currentRound >= PRIZE_LADDER.length) endGame(true);
                    else loadQuestion();
                } else {
                    document.getElementById('snd-wrong').play();
                    endGame(false);
                }
            }, 2000);
        }

        function endGame(isWin) {
            clearInterval(timerId);
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-summary').classList.remove('hidden');
            document.getElementById('quit-btn').classList.add('hidden');
            
            const prizeAmt = currentRound > 0 ? PRIZE_LADDER[currentRound-1] : "৳০";
            document.getElementById('sum-prize').innerText = prizeAmt;
            document.getElementById('sum-title').innerText = isWin ? "অভিনন্দন! আপনি বিজয়ী!" : "গেম ওভার!";

            // Show Withdraw button only if safe zone passed
            if (currentRound >= SAFE_ZONE_ROUND) {
                document.getElementById('withdraw-btn').classList.remove('hidden');
            }
        }

        function toggleWallet() {
            document.getElementById('wallet-form').classList.toggle('hidden');
        }

        function quitGame() {
            location.reload(); // Simple secure reset
