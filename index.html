<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBC Premium 2026</title>
    <style>
        /* CSS অংশ যা আপনি আগে দিয়েছেন তা হুবহু থাকবে */
        :root {
            --bg-gradient: radial-gradient(circle, #0f0c20 0%, #06040a 100%);
            --kbc-gold: #ffd700;
            --kbc-purple: #2b1055;
            --kbc-blue: #1a0033;
            --text-white: #ffffff;
            --success-green: #28a745;
            --error-red: #dc3545;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-white);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            display: none;
            width: 100%;
            max-width: 900px;
            padding: 30px;
            background: rgba(26, 0, 51, 0.85);
            border: 2px solid var(--kbc-gold);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        .active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        input, select {
            width: 80%;
            padding: 12px;
            margin: 12px 0;
            border: 2px solid var(--kbc-gold);
            background: #000;
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
        }

        .kbc-btn {
            background: linear-gradient(135deg, var(--kbc-purple), #4a154b);
            color: var(--kbc-gold);
            border: 2px solid var(--kbc-gold);
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-top: 15px;
        }

        .kbc-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--kbc-gold);
            background: var(--kbc-gold);
            color: #000;
        }

        .lifeline-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
        }
        .life-btn {
            background: #111;
            border: 2px solid #555;
            color: #fff;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .life-btn.used {
            text-decoration: line-through;
            opacity: 0.4;
            cursor: not-allowed;
            border-color: var(--error-red);
        }

        .question-box {
            background: linear-gradient(to right, #1f003d, #3d0066, #1f003d);
            border: 2px solid var(--kbc-gold);
            padding: 20px;
            border-radius: 10px;
            font-size: 22px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .option-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1.5px solid #00d2ff;
            color: #fff;
            padding: 15px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            text-align: left;
            padding-left: 30px;
            transition: 0.2s;
        }
        .option-btn:hover {
            background: linear-gradient(to right, #00d2ff, #0066cc);
            border-color: #fff;
        }

        .lock-notice {
            color: var(--error-red);
            font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <!-- স্ক্রিন ১: লগইন -->
    <div id="login-page" class="page active">
        <h2 style="color: var(--kbc-gold); margin-bottom: 20px;">KBC PREMIUM LOGIN</h2>
        <input type="text" id="phone-input" placeholder="মোবাইল নম্বর লিখুন (১০ ডিজিট)" maxlength="10">
        <input type="text" id="promo-input" placeholder="প্রোমো কোড দিন">
        <br>
        <button class="kbc-btn" onclick="handleLogin()">গেমের ভেতরে প্রবেশ করুন</button>
    </div>

    <!-- স্ক্রিন ২: ল্যাঙ্গুয়েজ -->
    <div id="lang-page" class="page">
        <h2 style="color: var(--kbc-gold); margin-bottom: 25px;">Select Your Language / ভাষা নির্বাচন করুন</h2>
        <select id="lang-select">
            <option value="bn">বাংলা (Bengali)</option>
            <option value="en">English (ইংরেজি)</option>
        </select>
        <br>
        <button class="kbc-btn" onclick="startActualGame()">খেলা শুরু করুন</button>
    </div>

    <!-- স্ক্রিন ৩: গেমপ্লে -->
    <div id="game-page" class="page">
        <div class="lifeline-container">
            <button id="life-50" class="life-btn" onclick="trigger5050()">50:50</button>
            <button id="life-phone" class="life-btn" onclick="triggerPhone()">Phone a Friend</button>
            <button id="life-audience" class="life-btn" onclick="triggerAudience()">Audience Poll</button>
            <button id="life-flip" class="life-btn" onclick="triggerFlip()">Flip Question</button>
        </div>

        <div style="display: flex; justify-content: space-between; margin-bottom: 15px; color: var(--kbc-gold);">
            <span id="player-tag">প্লেয়ার: </span>
            <span id="level-tag" style="font-weight: bold;">প্রশ্ন নম্বর: ১</span>
        </div>

        <div class="question-box" id="q-text">এখানে প্রশ্ন লোড হবে...</div>
        <div class="options-grid">
            <button class="option-btn" id="opt-0" onclick="checkAnswer(0)">A. </button>
            <button class="option-btn" id="opt-1" onclick="checkAnswer(1)">B. </button>
            <button class="option-btn" id="opt-2" onclick="checkAnswer(2)">C. </button>
            <button class="option-btn" id="opt-3" onclick="checkAnswer(3)">D. </button>
        </div>
        <button class="kbc-btn" style="margin-top: 30px; background: #330000; font-size: 14px;" onclick="exitGame()">গেম থেকে কুইট করুন (Exit)</button>
    </div>

    <!-- স্ক্রিন ৪: পে-পেজ -->
    <div id="pay-page" class="page">
        <h2 style="color: var(--error-red);">গেম ওভার!</h2>
        <p class="lock-notice" id="lock-reason"></p>
        <button class="kbc-btn" onclick="resetToLogin()">মেনু পেজে ফিরুন</button>
    </div>

    <!-- অডিও ফাইল লোডার (আপনি এখানে আপনার ফাইলের লিঙ্ক দিবেন) -->
    <audio id="audio-bgm" loop src="audio/kbc_bgm.mp3"></audio>
    <audio id="audio-correct" src="audio/correct.mp3"></audio>
    <audio id="audio-wrong" src="audio/wrong.mp3"></audio>
    <audio id="audio-lock" src="audio/lock.mp3"></audio>

    <script src="questions.js"></script>
    <script>
        // --- সাউন্ড কন্ট্রোল লজিক ---
        const audio = {
            bgm: document.getElementById('audio-bgm'),
            correct: document.getElementById('audio-correct'),
            wrong: document.getElementById('audio-wrong'),
            lock: document.getElementById('audio-lock')
        };

        function playSound(type) {
            try {
                if(type === 'bgm') {
                    audio.bgm.currentTime = 0;
                    audio.bgm.play();
                } else {
                    audio[type].currentTime = 0;
                    audio[type].play();
                }
            } catch(e) { console.log("Audio Error:", e); }
        }

        function stopBGM() {
            audio.bgm.pause();
        }

        // --- গ্লোবাল ভেরিয়েবলস ---
        let currentLanguage = 'bn';
        let currentLevel = 1;
        let selectedQuestions = [];
        let activeQuestionObj = null;
        let currentUserPhone = "";

        const CONFIG = {
            VALID_PROMO: "kbc2026",
            REQUIRE_PAYMENT: false,
            TOTAL_QUESTIONS_TO_PLAY: 15
        };

        // সিকিউরিটি
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73)) {
                e.preventDefault();
            }
        });

        // লগইন লজিক
        function handleLogin() {
            const phone = document.getElementById('phone-input').value.trim();
            const promo = document.getElementById('promo-input').value.trim();

            if (phone.length !== 10 || isNaN(phone)) {
                alert("সঠিক ১০ ডিজিটের মোবাইল নম্বর দিন।");
                return;
            }

            if (promo !== CONFIG.VALID_PROMO) {
                alert("ভুল প্রমো কোড!");
                return;
            }

            currentUserPhone = phone;
            switchPage('login-page', 'lang-page');
        }

        // গেম শুরু
        function startActualGame() {
            currentLanguage = document.getElementById('lang-select').value;
            prepareQuestionBank();
            currentLevel = 1;
            switchPage('lang-page', 'game-page');
            document.getElementById('player-tag').innerText = `প্লেয়ার: ${currentUserPhone}`;
            playSound('bgm');
            loadQuestion();
        }

        function prepareQuestionBank() {
            // masterQuestionBank variable questions.js থেকে আসছে
            let rawBank = [...masterQuestionBank];
            for (let i = rawBank.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [rawBank[i], rawBank[j]] = [rawBank[j], rawBank[i]];
            }
            selectedQuestions = rawBank.slice(0, CONFIG.TOTAL_QUESTIONS_TO_PLAY);
        }

        function loadQuestion() {
            const options = [0, 1, 2, 3];
            options.forEach(i => {
                let opt = document.getElementById(`opt-${i}`);
                opt.style.display = "block";
                opt.style.background = "rgba(0, 0, 0, 0.6)";
            });

            activeQuestionObj = selectedQuestions[currentLevel - 1];
            const data = activeQuestionObj[currentLanguage];
            
            document.getElementById('level-tag').innerText = currentLanguage === 'bn' ? `প্রশ্ন: ${currentLevel}/15` : `Q: ${currentLevel}/15`;
            document.getElementById('q-text').innerText = data.q;
            
            for (let i = 0; i < 4; i++) {
                document.getElementById(`opt-${i}`).innerText = `${String.fromCharCode(65 + i)}. ${data.o[i]}`;
            }
        }

        function checkAnswer(selectedIndex) {
            playSound('lock');
            const correctAnswer = activeQuestionObj.a;

            // অল্প সময় পজ দিয়ে উত্তর জানানো (KBC স্টাইল লক অ্যানিমেশন ফিল)
            setTimeout(() => {
                if (selectedIndex === correctAnswer) {
                    playSound('correct');
                    if (currentLevel < CONFIG.TOTAL_QUESTIONS_TO_PLAY) {
                        currentLevel++;
                        setTimeout(loadQuestion, 2000);
                    } else {
                        alert("আপনি সব উত্তর সঠিক দিয়েছেন!");
                        exitGame();
                    }
                } else {
                    playSound('wrong');
                    stopBGM();
                    showPayPage("ভুল উত্তর দিয়েছেন। খেলা শেষ।");
                }
            }, 1000);
        }

        // লাইফলাইনস
        function trigger5050() {
            document.getElementById('life-50').classList.add('used');
            document.getElementById('life-50').disabled = true;
            const correct = activeQuestionObj.a;
            let count = 0;
            for (let i = 0; i < 4; i++) {
                if (i !== correct && count < 2) {
                    document.getElementById(`opt-${i}`).style.display = "none";
                    count++;
                }
            }
        }

        function triggerPhone() {
            document.getElementById('life-phone').classList.add('used');
            document.getElementById('life-phone').disabled = true;
            const ans = activeQuestionObj.a;
            alert("আপনার বন্ধু বলছে সঠিক উত্তর সম্ভবত: " + String.fromCharCode(65 + ans));
        }

        function triggerAudience() {
            document.getElementById('life-audience').classList.add('used');
            document.getElementById('life-audience').disabled = true;
            alert("অডিয়েন্সের অধিকাংশ ভোট " + String.fromCharCode(65 + activeQuestionObj.a) + " এর দিকে।");
        }

        function triggerFlip() {
            document.getElementById('life-flip').classList.add('used');
            document.getElementById('life-flip').disabled = true;
            activeQuestionObj = masterQuestionBank[Math.floor(Math.random() * masterQuestionBank.length)];
            loadQuestion();
        }

        // ইউটিলিটি
        function switchPage(fromId, toId) {
            document.getElementById(fromId).classList.remove('active');
            document.getElementById(toId).classList.add('active');
        }

        function showPayPage(reason) {
            document.getElementById('lock-reason').innerText = reason;
            switchPage('game-page', 'pay-page');
        }

        function exitGame() {
            stopBGM();
            resetToLogin();
        }

        function resetToLogin() {
            const lifelines = ['life-50', 'life-phone', 'life-audience', 'life-flip'];
            lifelines.forEach(id => {
                let btn = document.getElementById(id);
                btn.classList.remove('used');
                btn.disabled = false;
            });
            switchPage('pay-page', 'login-page');
            switchPage('lang-page', 'login-page');
            switchPage('game-page', 'login-page');
        }
    </script>
</body>
</html>
