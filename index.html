let score = 0, time = 3600;

function load() {
    let q = questions[Math.floor(Math.random() * questions.length)];
    document.getElementById('q').innerText = q.q;
    let o = document.getElementById('opts');
    o.innerHTML = "";
    q.a.forEach((txt, idx) => {
        let d = document.createElement('div');
        d.className = 'option';
        d.innerText = txt;
        d.onclick = () => {
            if(idx === q.c) score += 10;
            document.getElementById('s').innerText = score;
            load();
        };
        o.appendChild(d);
    });
}

setInterval(() => {
    time--;
    document.getElementById('timer').innerText = "সময়: " + Math.floor(time/60) + ":" + (time%60);
}, 1000);

load();
