<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBC Bengali - মহাকোটিপতি</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #020230; color: white; overflow: hidden; }
        .kbc-gradient { background: radial-gradient(circle, #1a1a7a 0%, #020230 100%); }
        
        /* Options Styling */
        .option-btn { background: rgba(0, 0, 0, 0.6); border: 1px solid #ffffff55; transition: 0.3s; cursor: pointer; }
        .option-btn:hover:not(:disabled) { border-color: #ffd700; background: #2a004a; transform: scale(1.02); }
        .option-btn:disabled { cursor: not-allowed; }
        .dimmed { opacity: 0.3; }

        /* Animations */
        @keyframes blink { 0%, 100% { background: #3498db; } 50% { background: #ffd700; color: #000; } }
        .blink-animation { animation: blink 0.5s infinite; }
        
        @keyframes pulse-red { 0%, 100% { transform: scale(1); color: #ff0000; border-color: #ff0000; } 50% { transform: scale(1.1); color: #ff6666; border-color: #ff6666; } }
        .timer-critical { animation: pulse-red 0.5s infinite; }

        /* Scrollbar */
        .ladder-scroll::-webkit-scrollbar { width: 4px; }
        .ladder-scroll::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 10px; }
    </style>
</head>
<body class="kbc-gradient h-screen flex items-center justify-center">

    <!-- Welcome Screen -->
    <div id="welcome-screen" class="fixed inset-0 flex flex-col items-center justify-center z-50 bg-[#020230]">
        <div class="text-center">
            <h1 class="text-9xl font-bold text-yellow-500 mb-2 drop-shadow-2xl">KBC</h1>
            <p class="text-2xl text-yellow-200 mb-12 tracking-widest">কৌন বনেগা ক্রোড়পতি</p>
            <button id="start-game-btn" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-4 px-16 rounded-full text-2xl transition-all hover:scale-110 shadow-[0_0_20px_rgba(255,215,0,0.5)]">
                গেম শুরু করুন
            </button>
        </div>
    </div>

    <!-- Gameplay Board -->
    <div id="game-board" class="hidden w-full h-full max-w-7xl mx-auto flex flex-col lg:flex-row p-6 gap-6">
        
        <!-- Left Side: Quiz Area -->
        <div class="flex-grow flex flex-col justify-between">
            <!-- Header: Lifelines & Timer -->
            <div class="flex justify-between items-center bg-black/40 p-4 rounded-2xl border border-yellow-500/30 shadow-xl">
                <div class="flex gap-4">
                    <button id="lifeline-5050" onclick="use5050()" class="w-14 h-14 rounded-full border-2 border-yellow-500 flex items-center justify-center font-bold hover:bg-yellow-500 hover:text-black transition-all">50:50</button>
                    <button id="lifeline-poll" onclick="usePoll()" class="w-14 h-14 rounded-full border-2 border-yellow-500 flex items-center justify-center font-bold hover:bg-yellow-500 hover:text-black transition-all text-xs">POLL</button>
                    <button id="lifeline-phone" onclick="usePhone()" class="w-14 h-14 rounded-full border-2 border-yellow-500 flex items-center justify-center font-bold hover:bg-yellow-500 hover:text-black transition-all text-xs">PHONE</button>
                </div>
                
                <div class="relative flex flex-col items-center">
                    <div id="timer-circle" class="text-4xl font-mono font-bold border-4 border-white w-20 h-20 rounded-full flex items-center justify-center bg-black/50">30</div>
                    <button id="start-timer-btn" onclick="triggerTimer()" class="absolute -bottom-10 whitespace-nowrap bg-green-600 hover:bg-green-500 px-4 py-1 rounded-full text-xs font-bold animate-pulse">সময় শুরু করুন</button>
                </div>

                <button onclick="quitGame()" class="bg-red-800 hover:bg-red-700 px-6 py-2 rounded-lg font-bold text-sm border border-red-500">QUIT</button>
            </div>

            <!-- Question Box -->
            <div class="mt-12">
                <div id="question-display" class="bg-gradient-to-r from-blue-900 to-indigo-900 p-10 rounded-3xl border-2 border-white/50 text-center text-3xl shadow-2xl leading-relaxed">
                    লোড হচ্ছে...
                </div>
                
                <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8">
                    <!-- Options JS injection -->
                </div>
            </div>
            
            <div id="game-feedback" class="text-center text-yellow-400 italic text-2xl h-10 mt-4"></div>
        </div>

        <!-- Right Side: Money Ladder -->
        <div class="w-full lg:w-80 bg-black/60 p-6 rounded-2xl border-l-4 border-yellow-600 flex flex-col shadow-2xl">
            <h2 class="text-yellow-500 font-bold text-center text-xl mb-4 border-b border-yellow-500/30 pb-2">মানি ল্যাডার</h2>
            <div id="money-ladder" class="ladder-scroll overflow-y-auto flex-grow flex flex-col-reverse text-sm font-semibold">
                <!-- Ladder JS injection -->
            </div>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden fixed inset-0 z-[100] flex flex-col items-center justify-center p-10 bg-[#020230] text-center">
        <h2 id="result-status" class="text-7xl font-bold mb-8 drop-shadow-lg"></h2>
        <p id="final-prize" class="text-5xl text-yellow-400 mb-12 font-bold"></p>
        <button onclick="location.reload()" class="bg-white text-black font-bold py-4 px-12 rounded-full text-xl hover:bg-yellow-500 transition-colors">আবার খেলুন</button>
    </div>

    <!-- Lifeline Modals -->
    <div id="poll-modal" class="hidden fixed inset-0 bg-black/90 z-[150] flex items-center justify-center p-6">
        <div class="bg-indigo-950 p-10 rounded-3xl border-2 border-yellow-500 w-full max-w-md">
            <h3 class="text-2xl text-center mb-8 font-bold text-yellow-400">অডিয়েন্স পোল</h3>
            <div id="poll-graph" class="space-y-6"></div>
            <button onclick="closeModal('poll-modal')" class="mt-10 w-full bg-yellow-500 text-black font-bold py-3 rounded-xl">ঠিক আছে</button>
        </div>
    </div>

    <script>
        // --- Questions (30 Questions Mixed) ---
        const questions = [
            { q: "ভারতের প্রথম নোবেল পুরস্কার জয়ী কে ছিলেন?", a: ["রবীন্দ্রনাথ ঠাকুর", "সি ভি রমন", "মাদার টেরেসা", "অমর্ত্য সেন"], c: 0 },
            { q: "পশ্চিমবঙ্গের রাজ্য পশুর নাম কি?", a: ["রয়্যাল বেঙ্গল টাইগার", "মেছো বিড়াল", "হাতি", "গন্ডার"], c: 1 },
            { q: "কলকাতা শহর কত সালে ভারতের রাজধানী থেকে সরে যায়?", a: ["১৯০৫", "১৯১১", "১৯৪৭", "১৯৫০"], c: 1 },
            { q: "সত্যজিৎ রায়ের প্রথম চলচ্চিত্র কোনটি?", a: ["অপরাজিত", "অপুর সংসার", "পথের পাঁচালী", "জলসাঘর"], c: 2 },
            { q: "সৌরজগতের বৃহত্তম গ্রহ কোনটি?", a: ["শনি", "ইউরেনাস", "বৃহস্পতি", "নেপচুন"], c: 2 },
            { q: "বিখ্যাত 'পথের পাঁচালী' উপন্যাসের লেখক কে?", a: ["শরৎচন্দ্র চট্টোপাধ্যায়", "বিভূতিভূষণ বন্দ্যোপাধ্যায়", "বঙ্কিমচন্দ্র চট্টোপাধ্যায়", "রবীন্দ্রনাথ ঠাকুর"], c: 1 },
            { q: "কোন গ্রহকে 'লাল গ্রহ' বলা হয়?", a: ["শুক্র", "বৃহস্পতি", "মঙ্গল", "শনি"], c: 2 },
            { q: "পেনিসিলিন কে আবিষ্কার করেন?", a: ["আলেকজান্ডার ফ্লেমিং", "লুই পাস্তুর", "মেরি কুরি", "আইজাক নিউটন"], c: 0 },
            { q: "তাজমহল কোন নদীর তীরে অবস্থিত?", a: ["গঙ্গা", "যমুনা", "সরস্বতী", "নর্মদা"], c: 1 },
            { q: "ভারতের সংবিধান দিবস কবে পালিত হয়?", a: ["১৫ই আগস্ট", "২৬ই জানুয়ারি", "২৬ই নভেম্বর", "২রা অক্টোবর"], c: 2 },
            { q: "কোন ভিটামিনের অভাবে স্কার্ভি রোগ হয়?", a: ["ভিটামিন এ", "ভিটামিন বি", "ভিটামিন সি", "ভিটামিন ডি"], c: 2 },
            { q: "দাবা খেলার জন্ম কোন দেশে হয়েছিল?", a: ["ভারত", "চীন", "পারস্য", "মিশর"], c: 0 },
            { q: "বিশ্বের উচ্চতম পর্বতশৃঙ্গ কোনটি?", a: ["কাঞ্চনজঙ্ঘা", "মাউন্ট এভারেস্ট", "কে-টু", "লোৎসে"], c: 1 },
            { q: "শান্তিনিকেতন কোন জেলায় অবস্থিত?", a: ["বাঁকুড়া", "বীরভূম", "পুরুলিয়া", "বর্ধমান"], c: 1 },
            { q: "কোন ধাতুকে 'তরল ধাতু' বলা হয়?", a: ["সোডিয়াম", "পারদ", "লিথিয়াম", "ম্যাগনেসিয়াম"], c: 1 },
            { q: "ভারতের দীর্ঘতম নদী কোনটি?", a: ["যমুনা", "ব্রহ্মপুত্র", "গঙ্গা", "গোদাবরী"], c: 2 },
            { q: "ভিক্টোরিয়া মেমোরিয়াল কোথায় অবস্থিত?", a: ["দিল্লি", "মুম্বাই", "কলকাতা", "চেন্নাই"], c: 2 },
            { q: "সৌরশক্তি কিসের মাধ্যমে বিদ্যুৎ উৎপন্ন করে?", a: ["জেনারেটর", "সোলার প্যানেল", "টারবাইন", "ব্যাটারি"], c: 1 },
            { q: "হাজারদুয়ারি প্যালেস পশ্চিমবঙ্গের কোন জেলায়?", a: ["মুর্শিদাবাদ", "মালদা", "বীরভূম", "নদীয়া"], c: 0 },
            { q: "ভারতের প্রবেশদ্বার বলা হয় কোন শহরকে?", a: ["কলকাতা", "মুম্বাই", "চেন্নাই", "দিল্লি"], c: 1 },
            { q: "মানুষের শরীরে হাড়ের সংখ্যা কত?", a: ["২০৬", "২১০", "২৫০", "১৯০"], c: 0 },
            { q: "শুশুনিয়া পাহাড় কোন জেলায় অবস্থিত?", a: ["বাঁকুড়া", "পুরুলিয়া", "বীরভূম", "ঝাড়গ্রাম"], c: 0 },
            { q: "জাপানের মুদ্রার নাম কি?", a: ["ইউয়ান", "ইয়েন", "টাকা", "ডলার"], c: 1 },
            { q: "জাতীয় গান 'বন্দে মাতরম' কার লেখা?", a: ["রবীন্দ্রনাথ ঠাকুর", "বঙ্কিমচন্দ্র চট্টোপাধ্যায়", "শরৎচন্দ্র চট্টোপাধ্যায়", "নজরুল ইসলাম"], c: 1 },
            { q: "কম্পিউটারের জনক কাকে বলা হয়?", a: ["অ্যালান টিউরিং", "চার্লস ব্যাবেজ", "বিল গেটস", "স্টিভ জবস"], c: 1 },
            { q: "সবচেয়ে হালকা গ্যাস কোনটি?", a: ["অক্সিজেন", "নাইট্রোজেন", "হাইড্রোজেন", "হিলিয়াম"], c: 2 },
            { q: "নোবেল পুরস্কার কয়টি বিভাগে দেওয়া হয়?", a: ["৫টি", "৬টি", "৪টি", "৭টি"], c: 1 },
            { q: "আইফেল টাওয়ার কোন শহরে অবস্থিত?", a: ["লন্ডন", "প্যারিস", "নিউ ইয়র্ক", "রোম"], c: 1 },
            { q: "ভারতের প্রথম প্রধানমন্ত্রী কে ছিলেন?", a: ["সর্দার প্যাটেল", "জওহরলাল নেহরু", "লাল বাহাদুর শাস্ত্রী", "ইন্দিরা গান্ধী"], c: 1 },
            { q: "চাঁদে প্রথম পা রাখা মানুষের নাম কি?", a: ["ইউরি গ্যাগারিন", "নীল আর্মস্ট্রং", "বাজ অলড্রিন", "রাকেশ শর্মা"], c: 1 }
        ];

        const prizeMoney = ["₹১", "₹২", "₹৫", "₹১০", "₹২০", "₹৪০", "₹৮০", "₹১৬০", "₹৩২০", "₹৬৪০", "₹১,২৫০", "₹২,৫০০", "₹৫,০০০", "₹১০,০০০", "₹২০,০০০", "₹৪০,০০০", "₹৮০,০০০", "₹১,৬০,০০০", "₹৩,২০,০০০", "₹৬,৪০,০০০", "₹১২,৫০,০০০", "₹২৫,০০,০০০", "₹৫০,০০,০০০", "₹১ কোটি", "₹২ কোটি", "₹৩ কোটি", "₹৪ কোটি", "₹৫ কোটি", "₹৬ কোটি", "₹৭ কোটি"];
        const safeLevels = [4, 9, 14, 19, 24, 29];

        let currentLevel = 0;
        let shuffledPool = [];
        let timer = 30;
        let timerId = null;
        let canClick = false;
        let lifelines = { fifty: true, poll: true, phone: true };

        // Sounds
        const sndTheme = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
        const sndTick = new Audio('https://actions.google.com/sounds/v1/alarms/mechanical_clock_ticking.ogg');
        const sndLock = new Audio('https://actions.google.com/sounds/v1/science_fiction/glitch_low_power_sweep.ogg');
        const sndCorrect = new Audio('https://actions.google.com/sounds/v1/cartoon/clime.ogg');
        const sndWrong = new Audio('https://actions.google.com/sounds/v1/cartoon/boing.ogg');

        // --- Screen Transition Logic (FIXED) ---
        document.getElementById('start-game-btn').addEventListener('click', function() {
            // Start Audio (Fix for Browser Policy)
            sndTheme.loop = true;
            sndTheme.play().catch(e => console.log("Audio play prevented"));

            // Visual Transition
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('game-board').style.display = 'flex';

            // Init Game
            initGame();
        });

        function initGame() {
            shuffledPool = shuffle([...questions]);
            currentLevel = 0;
            lifelines = { fifty: true, poll: true, phone: true };
            updateLifelineUI();
            renderLadder();
            loadQuestion();
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderLadder() {
            const container = document.getElementById('money-ladder');
            container.innerHTML = "";
            prizeMoney.forEach((m, i) => {
                const div = document.createElement('div');
                div.id = `step-${i}`;
                div.className = `flex justify-between py-1 px-4 border-b border-white/10 ${safeLevels.includes(i) ? 'text-white font-bold' : 'text-gray-500'}`;
                div.innerHTML = `<span>${i + 1}</span><span>${m}</span>`;
                container.appendChild(div);
            });
        }

        function loadQuestion() {
            canClick = false;
            stopTimer();
            timer = 30;
            updateTimerUI();
            document.getElementById('start-timer-btn').style.display = 'block';
            document.getElementById('game-feedback').innerText = "";

            const q = shuffledPool[currentLevel];
            document.getElementById('question-display').innerText = `প্রশ্ন ${currentLevel + 1}: ${q.q}`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            q.a.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "option-btn text-left p-6 rounded-full text-xl flex items-center";
                btn.innerHTML = `<span class="text-yellow-500 font-bold mr-4">${String.fromCharCode(65 + i)}:</span> <span>${opt}</span>`;
                btn.onclick = () => selectAnswer(i, btn);
                btn.disabled = true;
                container.appendChild(btn);
            });

            // Highlight Ladder
            document.querySelectorAll('[id^="step-"]').forEach(el => el.classList.remove('bg-yellow-600', 'text-black'));
            const activeStep = document.getElementById(`step-${currentLevel}`);
            activeStep.classList.add('bg-yellow-600', 'text-black');
            activeStep.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function triggerTimer() {
            document.getElementById('start-timer-btn').style.display = 'none';
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = false);
            canClick = true;
            
            timerId = setInterval(() => {
                timer--;
                updateTimerUI();
                sndTick.play();

                if (timer <= 7) {
                    document.getElementById('timer-circle').classList.add('timer-critical');
                    sndTick.playbackRate = 1.6;
                }

                if (timer <= 0) {
                    clearInterval(timerId);
                    endGame("সময় শেষ!", false);
                }
            }, 1000);
        }

        function updateTimerUI() {
            const circle = document.getElementById('timer-circle');
            circle.innerText = timer;
            if (timer > 7) circle.classList.remove('timer-critical');
        }

        function stopTimer() {
            clearInterval(timerId);
            sndTick.pause();
            sndTick.currentTime = 0;
            sndTick.playbackRate = 1.0;
        }

        function selectAnswer(idx, btn) {
            if (!canClick) return;
            canClick = false;
            stopTimer();
            sndLock.play();

            const correct = shuffledPool[currentLevel].c;
            const allBtns = document.querySelectorAll('.option-btn');
            
            allBtns.forEach(b => { if (b !== btn) b.classList.add('dimmed'); });
            btn.classList.add('blink-animation');
            document.getElementById('game-feedback').innerText = "Lock করা যাক?";

            setTimeout(() => {
                btn.classList.remove('blink-animation');
                if (idx === correct) {
                    btn.classList.add('bg-green-600', 'border-green-400');
                    sndCorrect.play();
                    document.getElementById('game-feedback').innerText = "অদ্ভূত! সঠিক জবাব!";
                    setTimeout(() => {
                        if (currentLevel === 29) {
                            endGame("অভিনন্দন! আপনি মহাকোটিপতি!", true);
                        } else {
                            currentLevel++;
                            loadQuestion();
                        }
                    }, 2500);
                } else {
                    btn.classList.add('bg-red-600', 'border-red-400');
                    allBtns[correct].classList.remove('dimmed');
                    allBtns[correct].classList.add('bg-green-600');
                    sndWrong.play();
                    document.getElementById('game-feedback').innerText = "আফসোস! ভুল উত্তর।";
                    setTimeout(() => endGame("খেলা শেষ!", false), 2500);
                }
            }, 3000);
        }

        // --- Lifelines ---
        function updateLifelineUI() {
            document.getElementById('lifeline-5050').style.opacity = lifelines.fifty ? "1" : "0.3";
            document.getElementById('lifeline-poll').style.opacity = lifelines.poll ? "1" : "0.3";
            document.getElementById('lifeline-phone').style.opacity = lifelines.phone ? "1" : "0.3";
        }

        function use5050() {
            if (!lifelines.fifty || !canClick) return;
            lifelines.fifty = false;
            updateLifelineUI();
            const correct = shuffledPool[currentLevel].c;
            const btns = document.querySelectorAll('.option-btn');
            let indices = [0, 1, 2, 3].filter(i => i !== correct);
            indices = shuffle(indices).slice(0, 2);
            indices.forEach(i => btns[i].style.visibility = 'hidden');
        }

        function usePoll() {
            if (!lifelines.poll || !canClick) return;
            lifelines.poll = false;
            updateLifelineUI();
            const correct = shuffledPool[currentLevel].c;
            const pollData = [15, 15, 15, 15];
            pollData[correct] = 55;
            
            const graph = document.getElementById('poll-graph');
            graph.innerHTML = "";
            ['A', 'B', 'C', 'D'].forEach((l, i) => {
                graph.innerHTML += `
                    <div class="flex items-center gap-4 text-white">
                        <span class="w-4 font-bold">${l}</span>
                        <div class="flex-grow bg-white/10 h-6 rounded-full overflow-hidden">
                            <div class="bg-yellow-500 h-full" style="width: ${pollData[i]}%"></div>
                        </div>
                        <span class="w-10 text-right">${pollData[i]}%</span>
                    </div>`;
            });
            document.getElementById('poll-modal').classList.remove('hidden');
        }

        function usePhone() {
            if (!lifelines.phone || !canClick) return;
            lifelines.phone = false;
            updateLifelineUI();
            const correctChar = String.fromCharCode(65 + shuffledPool[currentLevel].c);
            alert(`আপনার বন্ধু বলছে: "আমার মনে হয় সঠিক উত্তর ${correctChar} হবে।"`);
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function quitGame() {
            if (confirm("আপনি কি নিশ্চিত যে আপনি খেলা ছেড়ে দেবেন?")) endGame("আপনি খেলা ছেড়ে দিয়েছেন", false, true);
        }

        function endGame(status, isWin, isQuit = false) {
            stopTimer();
            sndTheme.pause();
            document.getElementById('game-board').style.display = 'none';
            const screen = document.getElementById('result-screen');
            screen.classList.remove('hidden');
            
            let prize = "₹০";
            if (isWin) prize = "₹৭ কোটি";
            else if (isQuit) prize = currentLevel > 0 ? prizeMoney[currentLevel - 1] : "₹০";
            else {
                let lastSafe = -1;
                for (let lv of safeLevels) { if (currentLevel > lv) lastSafe = lv; }
                prize = lastSafe >= 0 ? prizeMoney[lastSafe] : "₹০";
            }

            document.getElementById('result-status').innerText = status;
            document.getElementById('final-prize').innerText = `জয়ী অর্থ: ${prize}`;
        }
    </script>
</body>
</html>
