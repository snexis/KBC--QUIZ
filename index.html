<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBC Bengali - কোটিপতি কুইজ</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #020230;
            --accent-gold: #ffd700;
            --option-blue: #111499;
            --option-hover: #1e21d3;
            --correct-green: #2ecc71;
            --wrong-red: #e74c3c;
            --text-white: #ffffff;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: radial-gradient(circle, #05054d 0%, #02021a 100%);
            color: var(--text-white);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hidden { display: none !important; }

        /* --- SCREENS --- */
        #start-screen, #rules-screen, #game-screen {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        /* --- LOGO ANIMATION --- */
        .kbc-logo {
            width: 280px;
            margin-bottom: 40px;
            filter: drop-shadow(0 0 20px gold);
            animation: rotateLogo 20s linear infinite;
        }
        @keyframes rotateLogo { 
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .btn-grand {
            background: linear-gradient(180deg, #ffd700, #b8860b);
            color: #000;
            padding: 20px 60px;
            border: 4px solid #fff;
            border-radius: 50px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            transition: 0.3s;
        }
        .btn-grand:hover { transform: scale(1.1); filter: brightness(1.2); }

        /* --- RULES MODAL --- */
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 40px;
            border: 2px solid gold;
            border-radius: 20px;
            max-width: 600px;
        }
        .rules-list { text-align: left; margin: 20px 0; line-height: 1.8; font-size: 1.2rem; }

        /* --- GAME ARENA --- */
        .game-layout {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
            width: 100%;
            height: 100%;
        }

        .timer-box {
            width: 100px; height: 100px;
            border: 5px solid gold;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; font-weight: bold;
            margin: 20px auto;
            background: rgba(0,0,0,0.6);
        }

        .question-box {
            background: linear-gradient(90deg, transparent, #111499, transparent);
            border: 2px solid gold;
            padding: 30px;
            border-radius: 50px;
            font-size: 1.6rem;
            margin-bottom: 30px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .option {
            background: #05054d;
            border: 1px solid #444;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.2rem;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .option:hover { background: #1e21d3; border-color: gold; }

        .correct { background: var(--correct-green) !important; animation: flash 0.3s 3; }
        .wrong { background: var(--wrong-red) !important; }
        .blinking { animation: pulseBlink 0.3s infinite; }

        @keyframes pulseBlink {
            50% { background: #ff9900; color: #000; }
        }
        @keyframes flash {
            50% { opacity: 0.5; }
        }

        /* --- MONEY TREE --- */
        .money-pyramid {
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 10px;
            display: flex; flex-direction: column-reverse;
        }
        .lvl { padding: 4px 10px; font-size: 0.9rem; color: #888; }
        .lvl.active { color: gold; font-weight: bold; background: rgba(255,215,0,0.2); border-radius: 5px; transform: scale(1.05); }
        .lvl.safe { color: #fff; border-bottom: 1px solid #333; }

        /* --- LIFELINES --- */
        .lifelines { display: flex; gap: 15px; margin-bottom: 30px; }
        .ll-btn {
            width: 70px; height: 45px;
            background: #222; border: 2px solid gold;
            border-radius: 50%; color: gold; cursor: pointer;
            font-weight: bold;
        }
        .ll-btn.used { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }

        /* --- POLL MODAL --- */
        .poll-overlay {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #020230; border: 3px solid gold; padding: 30px; z-index: 1000;
            width: 320px; border-radius: 15px; text-align: center;
        }
        .poll-bar-container { margin: 10px 0; text-align: left; }
        .poll-bar { height: 15px; background: gold; transition: width 1s; }
    </style>
</head>
<body>

    <!-- AUDIO ELEMENTS -->
    <audio id="bgm-loop" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
    <audio id="snd-tick" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
    <audio id="snd-correct" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>
    <audio id="snd-applause" src="https://assets.mixkit.co/active_storage/sfx/544/544-preview.mp3"></audio>
    <audio id="snd-wrong" src="https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3"></audio>

    <!-- 1. START SCREEN -->
    <div id="start-screen">
        <div class="kbc-logo">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#111499" stroke="gold" stroke-width="2"/>
                <text x="50%" y="55%" text-anchor="middle" fill="gold" font-size="12" font-weight="bold">KBC BENGALI</text>
            </svg>
        </div>
        <button class="btn-grand" onclick="showRules()">খেলা শুরু করুন</button>
    </div>

    <!-- 2. RULES SCREEN -->
    <div id="rules-screen" class="hidden">
        <div class="glass-panel">
            <h2 style="color:gold">খেলার নিয়মাবলী</h2>
            <ul class="rules-list">
                <li>◆ মোট ১৫টি প্রশ্নের সঠিক উত্তর দিতে হবে।</li>
                <li>◆ প্রতি প্রশ্নের জন্য ৪৫ সেকেন্ড সময় পাবেন।</li>
                <li>◆ আপনার কাছে ৪টি লাইফলাইন থাকবে।</li>
                <li>◆ ভুল উত্তর দিলে খেলা সেখানেই শেষ হয়ে যাবে।</li>
            </ul>
            <button class="btn-grand" style="font-size:1.2rem" onclick="initGame()">PLAY NOW (শুরু করুন)</button>
        </div>
    </div>

    <!-- 3. GAME ARENA -->
    <div id="game-screen" class="hidden">
        <div class="game-layout">
            <div class="play-zone">
                <div class="lifelines">
                    <button id="ll-5050" class="ll-btn" onclick="use5050()">50:50</button>
                    <button id="ll-poll" class="ll-btn" onclick="usePoll()">POLL</button>
                    <button id="ll-phone" class="ll-btn" onclick="usePhone()">CALL</button>
                    <button id="ll-flip" class="ll-btn" onclick="useFlip()">FLIP</button>
                </div>

                <div class="timer-box" id="timer">45</div>

                <div class="question-box" id="q-text">লোড হচ্ছে...</div>

                <div class="options-grid">
                    <div class="option" id="opt-0" onclick="checkAnswer(0)"></div>
                    <div class="option" id="opt-1" onclick="checkAnswer(1)"></div>
                    <div class="option" id="opt-2" onclick="checkAnswer(2)"></div>
                    <div class="option" id="opt-3" onclick="checkAnswer(3)"></div>
                </div>
            </div>

            <div class="money-pyramid" id="money-tree"></div>
        </div>
    </div>

    <!-- MODALS -->
    <div id="poll-modal" class="poll-overlay hidden">
        <h3>Audience Poll</h3>
        <div id="poll-bars"></div>
        <button class="btn-grand" style="font-size:1rem; padding:10px 20px; margin-top:15px" onclick="closeModal('poll-modal')">OK</button>
    </div>

    <script>
        /* [DATA] 150+ QUESTIONS PRESERVED */
        const fullBank = [
  { q: "ভারতের রাজধানী কোনটি?", o: ["কলকাতা", "নয়াদিল্লি", "মুম্বই", "চেন্নাই"], a: 1, level: 1 },
  { q: "পশ্চিমবঙ্গের রাজ্য পশুর নাম কী?", o: ["রয়্যাল বেঙ্গল টাইগার", "মেছো বিড়াল", "হাতি", "হরিণ"], a: 1, level: 1 },
  { q: "সূর্য কোন দিকে ওঠে?", o: ["পশ্চিম", "উত্তর", "দক্ষিণ", "পূর্ব"], a: 3, level: 1 },
  { q: "আমাদের জাতীয় সংগীত 'জন গণ মন' কার লেখা?", o: ["রবীন্দ্রনাথ ঠাকুর", "কাজী নজরুল ইসলাম", "বঙ্কিমচন্দ্র চট্টোপাধ্যায়", "শরৎচন্দ্র চট্টোপাধ্যায়"], a: 0, level: 1 },
  { q: "ভারতের জাতীয় ফল কোনটি?", o: ["আপেল", "কাঁঠাল", "আম", "কলা"], a: 2, level: 1 },
  { q: "কোন গ্রহকে 'লাল গ্রহ' বলা হয়?", o: ["বুধ", "মঙ্গল", "শুক্র", "বৃহস্পতি"], a: 1, level: 1 },
  { q: "বছরের কোন মাসটি সাধারণত ২৮ দিনের হয়?", o: ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল"], a: 1, level: 1 },
  { q: "একটি ক্রিকেট ম্যাচে প্রতি দলে কতজন খেলোয়াড় থাকে?", o: ["৯ জন", "১০ জন", "১১ জন", "১২ জন"], a: 2, level: 1 },
  { q: "কোন প্রাণীকে 'মরুভূমির জাহাজ' বলা হয়?", o: ["উট", "ঘোড়া", "গাধা", "হাতি"], a: 0, level: 1 },
  { q: "ইংরেজি বর্ণমালায় মোট কয়টি স্বরবর্ণ (Vowel) আছে?", o: ["৫টি", "৪টি", "৬টি", "৭টি"], a: 0, level: 1 },
  { q: "তাজমহল ভারতের কোন শহরে অবস্থিত?", o: ["দিল্লি", "আগরা", "জয়পুর", "লখনউ"], a: 1, level: 1 },
  { q: "পৃথিবীর সবচেয়ে বড় মহাসাগর কোনটি?", o: ["ভারত মহাসাগর", "আটলান্টিক মহাসাগর", "প্রশান্ত মহাসাগর", "সুমেরu মহাসাগর"], a: 2, level: 1 },
  { q: "কোন উৎসবকে 'আলোর উৎসব' বলা হয়?", o: ["হোলি", "দুর্গাপুজো", "দীপাবলি", "ঈদ"], a: 2, level: 1 },
  { q: "ল্যাপটপ বা কম্পিউটার স্ক্রিনে দেখার জন্য কোন ইনপুট ডিভাইস ব্যবহার করা হয়?", o: ["মাউস", "কিবোর্ড", "মনিটর", "প্রিন্টার"], a: 0, level: 1 },
  { q: "কলকাতা কোন নদীর তীরে অবস্থিত?", o: ["গঙ্গা", "যমুনা", "হুগলি", "পদ্মা"], a: 2, level: 1 },
  { q: "ডাক্তাররা নাড়ি (Pulse) দেখে মানুষের কী পরীক্ষা করেন?", o: ["রক্তের পরিমাণ", "হৃদস্পন্দনের গতি", "শরীরের ওজন", "চোখের দৃষ্টি"], a: 1, level: 1 },
  { q: "মহাকাব্য 'রামায়ণ' অনুযায়ী শ্রী রামচন্দ্রের স্ত্রীর নাম কী?", o: ["সীতা", "রাধা", "দ্রৌপদী", "কুন্তী"], a: 0, level: 1 },
  { q: "দাবা খেলায় বোর্ডের ওপর মোট কতগুলি ঘর থাকে?", o: ["৫০টি", "৬৪টি", "৬০টি", "৭০টি"], a: 1, level: 1 },
  { q: "কোন রঙের ট্রাফিক লাইট দেখলে গাড়ি থামাতে হয়?", o: ["সবুজ", "হলুদ", "নীল", "লাল"], a: 3, level: 1 },
  { q: "মানুষের মুখের ভেতর মোট কত ধরনের দাঁত থাকে?", o: ["২ ধরনের", "৩ ধরনের", "৪ ধরনের", "৫ ধরনের"], a: 2, level: 1 },
  { q: "আমাদের সৌরজগতের সবচেয়ে বড় গ্রহ কোনটি?", o: ["পৃথিবী", "মঙ্গল", "বৃহস্পতি", "শনি"], a: 2, level: 1 },
  { q: "পাহাড়ি এলাকায় যাতায়াতের জন্য প্রধানত কোন পশুর সাহায্য নেওয়া হয়?", o: ["উট", "খচ্চর বা ঘোড়া", "হাতি", "মহিষ"], a: 1, level: 1 },
  { q: "মোবাইল ফোনে সিম কার্ডের 'SIM' এর পুরো নাম কী?", o: ["Subscriber Identity Module", "System Instant Message", "Secure Internet Medium", "Subscriber International Mobile"], a: 0, level: 1 },
  { q: "কোন পাখির ডিম পৃথিবীর মধ্যে সবচেয়ে বড় হয়?", o: ["ময়ূর", "উটপাখি", "ঈগল", "পেনগুইন"], a: 1, level: 1 },
  { q: "ভারতের স্বাধীনতা দিবস কোন তারিখে পালিত হয়?", o: ["২৬শে জানুয়ারি", "১৫ই আগস্ট", "২রা অক্টোবর", "১৪ই নভেম্বর"], a: 1, level: 1 },
  { q: "রামধনু বা রংধনুতে মোট কয়টি রঙ থাকে?", o: ["৫টি", "৬টি", "৭টি", "৮টি"], a: 2, level: 1 },
  { q: "কোন পতঙ্গ কামড়ালে ডেঙ্গু রোগ হতে পারে?", o: ["অ্যানোফিলিস মশা", "এডিস মশা", "কিউলেক্স msha", "মাছি"], a: 1, level: 1 },
  { q: "ফেসবুক (Facebook) এর প্রতিষ্ঠাতা কে?", o: ["বিল গেটস", "মার্ক জুকারবার্গ", "স্টিভ জবস", "এলন মাস্ক"], a: 1, level: 1 },
  { q: "কোন ফলকে 'ফলের রাজা' বলা হয়?", o: ["আপেল", "লিচু", "আম", "আঙুর"], a: 2, level: 1 },
  { q: "ভারতের জাতীয় পশু কোনটি?", o: ["সিংহ", "রয়্যাল বেঙ্গল টাইগার", "চিতাবাঘ", "হাতি"], a: 1, level: 1 },
  { q: "পৃথিবীর সবচেয়ে উঁচু পর্বতশৃঙ্গ কোনটি?", o: ["কাঞ্চনজঙ্ঘা", "গডউইন অস্টিন", "মাউন্ট এভারেস্ট", "নন্দাদেবী"], a: 2, level: 1 },
  { q: "ভারতের নোট বাতিলের ঐতিহাসিক ঘটনা (Demonetization) কোন সালে ঘটেছিল?", o: ["২০১৪", "২০১৫", "২০১৬", "২০১৭"], a: 2, level: 1 },
  { q: "কলকাতার বিখ্যাত 'হাওড়া ব্রিজ' এর আনুষ্ঠানিক নাম কী?", o: ["বিদ্যাসাগর সেতু", "রবীন্দ্র সেতু", "বিবেকানন্দ সেতু", "নজরুল সেতু"], a: 1, level: 1 },
  { q: "কোন ভিটামিনের অভাবে মানুষের রাতকানা রোগ হয়?", o: ["ভিটামিন B", "ভিটামিন C", "ভিটামিন A", "ভিটামিন D"], a: 2, level: 1 },
  { q: "স্বাধীন ভারতের প্রথম প্রধানমন্ত্রী কে ছিলেন?", o: ["মহাত্মা গান্ধী", "জওহরলাল নেহরু", "ড. রাজেন্দ্র প্রসাদ", "সর্দার বল্লভভাই প্যাটেল"], a: 1, level: 1 },
  { q: "টেলিফোন কে আবিষ্কার করেছিলেন?", o: ["টমাস আলভা এডিসন", "আলেকজান্ডার গ্রাহাম বেল", "আইজ্যাক নিউটন", "মারকনি"], a: 1, level: 1 },

  { q: "সূর্যের আলো পৃথিবীতে পৌঁছাতে কত সময় লাগে?", o: ["প্রায় ৮ মিনিট ২০ সেকেন্ড", "প্রায় ৫ মিনিট", "প্রায় ১০ মিনিট", "প্রায় ২ মিনিট"], a: 0, level: 2 }
];

        const moneyStairs = [
            "₹১,০০০", "₹২,০০০", "₹৩,০০০", "₹৫,০০০", "₹১০,০০০", 
            "₹২০,০০০", "₹৪০,০০০", "₹৮০,০০০", "₹১,৬০,০০০", "₹৩,২০,০০০",
            "₹৬,৪০,০০০", "₹১২,৫০,০০০", "₹২৫,০০,০০০", "₹৫০,০০,০০০", "₹৭ কোটি"
        ];

        /* --- GAME ENGINE --- */
        let shuffledList = [];
        let curIdx = 0;
        let timer = null;
        let timeLeft = 45;
        let activeQ = null;
        let lifeLines = { '5050': false, 'poll': false, 'phone': false, 'flip': false };

        function showRules() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('rules-screen').classList.remove('hidden');
        }

        // Fisher-Yates Shuffle
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            // Prepare 15 unique questions (1 per level difficulty)
            shuffledList = [];
            for(let i=1; i<=15; i++) {
                let lvl = i > 3 ? (i > 8 ? 3 : 2) : 1; // Map 15 rounds to 3 bank levels
                let pool = fullBank.filter(q => q.level === lvl);
                shuffle(pool);
                shuffledList.push(pool[0]);
            }

            document.getElementById('rules-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            // Start BGM
            document.getElementById('bgm-loop').play();
            renderTree();
            loadQuestion();
        }

        function renderTree() {
            const tree = document.getElementById('money-tree');
            tree.innerHTML = '';
            moneyStairs.forEach((m, i) => {
                const d = document.createElement('div');
                d.className = `lvl ${i === curIdx ? 'active' : ''}`;
                if(i === 4 || i === 9 || i === 14) d.classList.add('safe');
                d.innerHTML = `${i+1} ⬥ ${m}`;
                tree.appendChild(d);
            });
        }

        function loadQuestion() {
            activeQ = shuffledList[curIdx];
            document.getElementById('q-text').innerText = activeQ.q;
            
            for(let i=0; i<4; i++) {
                const btn = document.getElementById(`opt-${i}`);
                btn.innerHTML = `<span>${String.fromCharCode(65+i)}:</span> ${activeQ.o[i]}`;
                btn.className = 'option';
                btn.style.visibility = 'visible';
            }
            
            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 45;
            document.getElementById('timer').innerText = timeLeft;
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                document.getElementById('snd-tick').play();
                if(timeLeft <= 0) {
                    clearInterval(timer);
                    endGame("সময় শেষ!");
                }
            }, 1000);
        }

        function checkAnswer(idx) {
            clearInterval(timer);
            const selected = document.getElementById(`opt-${idx}`);
            selected.classList.add('blinking');

            setTimeout(() => {
                selected.classList.remove('blinking');
                if(idx === activeQ.a) {
                    selected.classList.add('correct');
                    document.getElementById('snd-correct').play();
                    
                    setTimeout(() => {
                        document.getElementById('snd-applause').play();
                        if(curIdx === 14) {
                            alert("অবিশ্বাস্য! আপনি ৭ কোটি টাকা জিতেছেন!");
                            location.reload();
                        } else {
                            curIdx++;
                            renderTree();
                            setTimeout(loadQuestion, 2000);
                        }
                    }, 1000);
                } else {
                    selected.classList.add('wrong');
                    document.getElementById(`opt-${activeQ.a}`).classList.add('correct');
                    document.getElementById('snd-wrong').play();
                    setTimeout(() => endGame("ভুল উত্তর!"), 2000);
                }
            }, 3000); // Suspense blink
        }

        function use5050() {
            if(lifeLines['5050']) return;
            lifeLines['5050'] = true;
            document.getElementById('ll-5050').classList.add('used');
            
            let count = 0;
            let indices = [0,1,2,3].filter(i => i !== activeQ.a);
            shuffle(indices);
            document.getElementById(`opt-${indices[0]}`).style.visibility = 'hidden';
            document.getElementById(`opt-${indices[1]}`).style.visibility = 'hidden';
        }

        function usePoll() {
            if(lifeLines['poll']) return;
            lifeLines['poll'] = true;
            document.getElementById('ll-poll').classList.add('used');
            
            document.getElementById('poll-modal').classList.remove('hidden');
            const container = document.getElementById('poll-bars');
            container.innerHTML = '';
            
            let vals = [12, 10, 8, 15];
            vals[activeQ.a] = 55; // Logic for audience preference
            
            vals.forEach((v, i) => {
                container.innerHTML += `
                    <div class="poll-bar-container">
                        <small>Option ${String.fromCharCode(65+i)} (${v}%)</small>
                        <div class="poll-bar" style="width:${v}%"></div>
                    </div>`;
            });
        }

        function usePhone() {
            if(lifeLines['phone']) return;
            lifeLines['phone'] = true;
            document.getElementById('ll-phone').classList.add('used');
            alert(`আপনার বন্ধু মনে করেন সঠিক উত্তর হতে পারে: ${String.fromCharCode(65+activeQ.a)}`);
        }

        function useFlip() {
            if(lifeLines['flip']) return;
            lifeLines['flip'] = true;
            document.getElementById('ll-flip').classList.add('used');
            loadQuestion(); // Reloads a random one from logic
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function endGame(msg) {
            const prize = curIdx > 0 ? moneyStairs[curIdx-1] : "₹০";
            alert(`${msg}\nআপনি জিতেছেন: ${prize}`);
            location.reload();
        }
    </script>
